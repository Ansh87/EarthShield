  const el = $("#v-overview"); if(!el) return;
  let selectedOverviewContent;
  if(ST.overviewSub==="drivers") selectedOverviewContent = overviewDrivers(R);
  else if(ST.overviewSub==="regiondata") selectedOverviewContent = overviewRegionData(R);
  else selectedOverviewContent = overviewSnapshot(R);
  // Secondary tabs always render first, in the same position, regardless of which
  // Overview subtab is selected, so navigation never shifts around underneath the user.
  el.innerHTML = overviewSubtabsHTML() + selectedOverviewContent;
  document.querySelectorAll("#overviewSubtabs .subtab").forEach(b=>b.onclick=()=>{
    ST.overviewSub = b.dataset.osub; buildOverview(computeRisks(ST.region, ST.live, null)); $("#main").scrollTop=0;
  });
  wireOverviewBody();
}

function earthWatermarkSVG(){
  // Back to the v12 composition (flat ocean sphere, curved lat/long grid, orbiting ring, glowing
  // signal nodes + arcs) which tested well. The only change from v12: continents are now rendered
  // twice -- a dark offset duplicate underneath, then the real aqua landmass on top -- to read as
  // raised/embossed "sticker" continents (like the reference photo) instead of flat silhouettes.
  // Land is still the SAME real low-poly coastline data used by the functional map in Region &
  // Data's hotspotMap() (worldLandPaths()). Note: we only have continent-level outlines, not real
  // country border data, so no per-country lines are drawn -- adding invented borders would misrepresent
  // the geography. Purely decorative: aria-hidden and pointer-events:none.
  const oldCx=120, oldCy=120, oldR=104, oldScale=0.66667, oldTx=-120, oldTy=0;
  const cx=200, cy=200, r=186;
  const k=r/oldR, s=k*oldScale;
  const tx=(k*oldTx + (cx-oldCx*k)).toFixed(2);
  const ty=(k*oldTy + (cy-oldCy*k)).toFixed(2);
  const shTx=(parseFloat(tx)+2.6).toFixed(2);
  const shTy=(parseFloat(ty)+3.4).toFixed(2);
  const sw=(1.4*k).toFixed(2);
  const nodes=[[186,69],[232,88],[196,140],[222,176],[176,206]];
  const dotsSVG = nodes.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#B9F5DF"/>`).join("");
  const arcsSVG = nodes.slice(0,-1).map((p,i)=>{
    const n=nodes[i+1];
    const mx=(p[0]+n[0])/2, my=(p[1]+n[1])/2-16;
    return `<path d="M${p[0]} ${p[1]} Q${mx} ${my} ${n[0]} ${n[1]}" stroke="#B9F5DF" stroke-width="1" fill="none" opacity=".6"/>`;
  }).join("");
  return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"
      style="position:absolute;top:-46px;right:-46px;width:58%;max-width:460px;aspect-ratio:1/1;opacity:.92;pointer-events:none;z-index:0" aria-hidden="true">
    <defs><clipPath id="earthClip"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#08201A" opacity=".72"/>
    <g clip-path="url(#earthClip)">
      <g transform="translate(${shTx},${shTy}) scale(${s.toFixed(4)})" fill="#04140F" opacity=".5" stroke="none">
        ${worldLandPaths()}
      </g>
      <g transform="translate(${tx},${ty}) scale(${s.toFixed(4)})" fill="var(--aqua)" opacity=".72"
         stroke="#0B5B47" stroke-width="${sw}" stroke-linejoin="round">
        ${worldLandPaths()}
      </g>
      ${arcsSVG}
      ${dotsSVG}
    </g>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--aqua)" stroke-width="2" opacity=".55"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.35}" fill="none" stroke="var(--aqua)" stroke-width="1" opacity=".3"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.7}" fill="none" stroke="var(--aqua)" stroke-width="1" opacity=".25"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r*0.35}" ry="${r}" fill="none" stroke="var(--aqua)" stroke-width="1" opacity=".3"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r*0.7}" ry="${r}" fill="none" stroke="var(--aqua)" stroke-width="1" opacity=".25"/>
    <line x1="${cx}" y1="${cy-r}" x2="${cx}" y2="${cy+r}" stroke="var(--aqua)" stroke-width="1" opacity=".25"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r+50}" ry="${r*0.4}" fill="none" stroke="var(--violet)" stroke-width="1.4" opacity=".32" transform="rotate(-10 ${cx} ${cy})"/>
    <circle cx="${cx-r-38}" cy="${cy+18}" r="4.5" fill="var(--violet)" opacity=".7"/>
  </svg>`;
}

function domainDonutSVG(R){
  const contribs = R.domains.map(d=>({...d, contrib: d.v*(R.weights[d.k]||0)})).sort((a,b)=>b.contrib-a.contrib);
  const total = contribs.reduce((s,d)=>s+d.contrib,0) || 1;
  const RAD=48, C=2*Math.PI*RAD;
  let cum=0;
  const segs = contribs.map(d=>{
    const frac = d.contrib/total;
    const dash = frac*C;
    const seg = `<circle cx="60" cy="60" r="${RAD}" fill="none" stroke="${cv(d.c)}" stroke-width="15"
      stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-cum).toFixed(2)}"
      transform="rotate(-90 60 60)"/>`;
    cum += dash;
    return seg;
  }).join("");
  const maxContrib = contribs[0] ? contribs[0].contrib : 1;
  const legend = contribs.map(d=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
      <span style="width:8px;height:8px;border-radius:50%;background:${cv(d.c)};flex:0 0 auto"></span>
      <span style="flex:0 0 auto;width:118px;font-size:11px;color:#B7D3BF;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.nm}</span>
      <div style="flex:1;height:5px;background:#06160E;border-radius:4px;overflow:hidden;min-width:24px">
        <div style="width:${(d.contrib/maxContrib*100).toFixed(0)}%;height:100%;background:${cv(d.c)}"></div>
      </div>
      <span style="flex:0 0 32px;text-align:right;font-family:'JetBrains Mono';font-size:10.5px;color:${cv(d.c)}">${d.contrib.toFixed(1)}</span>
    </div>`).join("");
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <div style="flex:0 0 auto;position:relative;width:120px;height:120px">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="${RAD}" stroke="${cv('--line')}" stroke-width="15" fill="none"/>
        ${segs}
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-family:'Space Grotesk';font-size:24px;font-weight:700">${R.cascade}</div>
        <div style="font-size:8px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;text-align:center;line-height:1.3">Regional<br>Stress Score</div>
      </div>
    </div>
    <div style="flex:1;min-width:180px">${legend}</div>
  </div>`;
}

function overviewRegionData(R){
  const bnd = band(R.cascade);
  const live = ST.live;
  const st = live ? live.status : {};
  const b = ST.region.b;
  // Current API signal coverage counts ONLY endpoints EarthShield fetches as current
  // conditions: sea temperature, atmosphere (CAPE/shear/humidity), air quality. The
  // statistical SST baseline (sstTrend) is a real OLS regression fit from live marine
  // history, not a "current" API endpoint, so it is tracked and shown separately rather
  // than folded into this count.
  const apiKeys = ["sst","atmo","aqi"];
  const apiOkCount = live ? apiKeys.filter(k=>st[k]==="ok").length : 0;
  const apiTotalCount = apiKeys.length;
  const coverage = !live ? {label:"Not yet loaded", col:"var(--muted)"}
    : apiOkCount===apiTotalCount ? {label:"Good", col:"var(--aqua)"}
    : apiOkCount>0 ? {label:"Partial", col:"var(--amber)"}
    : {label:"Low", col:"var(--red)"};
  const sstBaselineOk = live ? st.sstTrend==="stat" : false;
  const sstBaselineLabel = !live ? "Not yet loaded" : sstBaselineOk ? "Available" : "Fallback baseline";
  const MODELED_INDICATORS = [

  // SST baseline falling back to its regional baseline is a normal, labelled fallback

        </div>
        <div class="insight-card">
          <div class="ik">Statistical SST baseline</div>
          <div class="iv" style="font-size:15px">${sstBaselineLabel}</div>
          <div class="score-sub">OLS regression over ~60 days, shown separately from current API coverage.</div>
        </div>
        <div class="insight-card">
          <div class="ik">Modeled regional indicators</div>
          <div class="iv">${modeledCount} / ${modeledCount}</div>
          <div class="score-sub">Hand-calibrated baselines, always present for every region.</div>
        </div>

        <div style="overflow-x:auto">
        <table class="score-tbl">
          <thead><tr><th>Signal</th><th class="num">Current value</th><th>Source</th><th>Status</th></tr></thead>
          <tbody>
            ${liveRow("Current sea temperature",live?live.sst:"n/a","\u00B0C","Open-Meteo Marine",st.sst)}
            ${liveRow("Sea temperature vs baseline",live?(live.sstAnom>=0?"+":"")+live.sstAnom:"n/a","\u00B0C","Open-Meteo Marine (derived)",st.sst)}
            ${liveRow("Atmospheric instability",live?live.cape:"n/a","J/kg","Open-Meteo Forecast",st.atmo)}
            ${liveRow("Air quality",live?live.aqi:"n/a","","Open-Meteo Air Quality",st.aqi)}
            ${liveRow("Statistical SST baseline",live?live.sstBaseline:"n/a","\u00B0C","OLS regression \u00B7 shown separately",st.sstTrend)}

/* ---- compact "how this score was calculated" for the hero ---- */
function howCalculated(R){
  const w=R.weights;
  const rows=R.domains.map(d=>`<div class="hc-row"><span>${d.nm}</span>
    <span class="mono">${d.v} \u00D7 ${Math.round(w[d.k]*100)}% = ${(d.v*w[d.k]).toFixed(1)}</span></div>`).join("");
  const escPts=(R.baseWeighted*(R.escalation-1));
  return `<div class="hc">
    ${rows}
    <div class="hc-row hc-sub"><span>Weighted base</span><span class="mono">${R.baseWeighted.toFixed(1)}</span></div>
    <div class="hc-row hc-sub"><span>High-risk domains (\u226565)</span><span class="mono">${R.highCount} \u2192 \u00D7${R.escalation.toFixed(3)} (+${escPts.toFixed(1)})</span></div>
    <div class="hc-row hc-total"><span>Final Regional Stress Score</span><span class="mono">${R.cascade} / 100</span></div>
    <div style="font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5">Full breakdown and formula in Info \u203A Scoring.</div>
  </div>`;
}
function sensitivityCard(u){
  // Maps the underlying uncertainty() confidence classification onto the plain-language
  // Low/Moderate/High "sensitivity level" wording requested for Overview. Display-only relabel:
  // the same thresholds and u.confidence value are still used unchanged in Info -> Model Checks
  // (infoValidation()), so no scoring or classification logic changes here.
  const conf = u.confidence;
  const level = conf==="High confidence" ? "Low" : conf==="Moderate confidence" ? "Moderate" : "High";
  const cls = level==="Low" ? "agree" : level==="Moderate" ? "moderate" : "";
  const icon = level==="Low" ? "\u2713" : level==="Moderate" ? "\u25D1" : "\u26A0\uFE0E";
  const iconCol = level==="Low" ? "var(--green)" : level==="Moderate" ? "var(--amber)" : "var(--red)";
  return `<div class="uncert ${cls}">
    <div class="ui" style="color:${iconCol}">${icon}</div>
    <div class="ub" style="flex:1">
      <h5>Model Sensitivity ${helpIcon("sensitivity")}</h5>
      <div class="sens-grid">
        <div class="sens-row"><span class="sk">Current modeled score</span><span class="sv mono">${u.baseline}</span></div>
        <div class="sens-row"><span class="sk">Tested score range</span><span class="sv mono">${u.minimum}\u2013${u.maximum}</span></div>
        <div class="sens-row"><span class="sk">Sensitivity level ${helpIcon("sensitivityLevel")}</span><span class="sv" style="color:${iconCol}">${level}</span></div>
        <div class="sens-row"><span class="sk">Most influential assumption</span><span class="sv">${u.largestUncertaintyDriver}${u.largestUncertaintyGlossaryKey?helpIcon(u.largestUncertaintyGlossaryKey):""}</span></div>
      </div>
      <p style="font-size:11px;color:var(--muted);margin:9px 0 0;line-height:1.5">
        Varying the ${u.largestUncertaintyDriver.toLowerCase()} assumption across the tested range changed the
        Regional Stress Score by up to ${u.largestImpact} point${u.largestImpact===1?'':'s'} from the current score.</p>
    </div>
  </div>`;
}

function hotspotMap(reg, bnd){
  const W=720,H=360;
  const proj=(lat,lon)=>({ x:(lon+180)/360*W, y:(90-lat)/180*H });
  const land = worldLandPaths();
  let markers="";
  let onP = null;
  REGIONS.forEach(r=>{
    const p=proj(r.lat,r.lon), on=r.id===reg.id;
    if(on) onP = p;
    const col=on?cv(bnd.c):"#E8C98A";
    markers+=`<g>
      ${on?`<circle cx="${p.x}" cy="${p.y}" r="13" fill="${col}" opacity=".22"><animate attributeName="r" values="10;20;10" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".32;0;.32" dur="2.4s" repeatCount="indefinite"/></circle>`:""}
      <circle cx="${p.x}" cy="${p.y}" r="${on?6:3.5}" fill="${col}" stroke="#08231F" stroke-width="${on?2:1.2}" opacity="${on?1:.7}"/>
    </g>`;
  });
  // Invisible hover/focus target sitting exactly over the selected (blinking) marker, positioned
  // by percentage so it stays aligned regardless of the SVG's rendered size. Reuses the existing
  // .tip / .tip-box CSS (same mechanism as the app's help icons) so hover on desktop and tap/focus
  // on touch devices both reveal the region name; the always-visible "Region" row below the map
  // is the static fallback for devices where neither hover nor focus-on-tap is available.
  const regionSub = (typeof REGION_SUBLABEL!=="undefined" && REGION_SUBLABEL[reg.id]) || "";
  const hoverLabel = onP ? `
      <div class="tip" tabindex="0" aria-label="${reg.name}" style="position:absolute;left:${(onP.x/W*100).toFixed(2)}%;top:${(onP.y/H*100).toFixed(2)}%;
        transform:translate(-50%,-50%);width:26px;height:26px;margin:0;color:transparent;cursor:pointer">
        <span class="tip-box" style="left:50%;top:auto;bottom:150%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px)">
          <b style="color:var(--txt)">${reg.name}</b>${regionSub?`<br><span style="color:var(--muted)">${regionSub}</span>`:""}
        </span>
      </div>` : "";
  return `<div class="hotspot">
    <div class="hot-map">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" width="100%" height="100%"
           style="display:block" fill="#D9A14E" stroke="#B07E2F" stroke-width="1" stroke-linejoin="round">
        <rect x="0" y="0" width="${W}" height="${H}" fill="#072622" stroke="none"/>
        <g opacity=".92">${land}</g>
        <g stroke="none">${markers}</g>
      </svg>
      ${hoverLabel}
    </div>
    <div class="hot-meta">
      <div><span class="hk">Region</span><span class="hv">${reg.name}</span></div>
      <div><span class="hk">Coordinates</span><span class="hv mono">${reg.lat.toFixed(2)}, ${reg.lon.toFixed(2)}</span></div>
      <div><span class="hk">Risk band</span><span class="hv" style="color:${cv(bnd.c)}">${bnd.t}</span></div>
    </div>
  </div>`;
}

function cascadeSubtabsHTML(){
  const subs = [["regional","Regional Cascade"],["planetary","Planetary Cascade"]];
  return `<div class="subtabs" id="cascadeSubtabs">${subs.map(([k,l])=>
    `<button class="subtab ${ST.cascadeSub===k?'on':''}" data-csub="${k}">${l}</button>`).join("")}</div>`;
}

function buildCascade(R){
  const scenarioSim = ST.sim ? { ...ST.simInputs } : null;
  const baseProp = propagatePlanetaryCascade(ST.region, computeRisks(ST.region, ST.live, null), null);
  const scenarioR = scenarioSim ? computeRisks(ST.region, ST.live, scenarioSim) : null;
  const scenarioProp = scenarioR ? propagatePlanetaryCascade(ST.region, scenarioR, scenarioSim) : null;
  // If no scenario exists, never show a scenario view (nothing to compare against).
  if(!scenarioR) ST.cascadeShowScenario = false;
  const activeProp = (ST.cascadeShowScenario && scenarioProp) ? scenarioProp : baseProp;
  // Regional Cascade must reflect the SAME Baseline / Current Scenario selection as Planetary
  // Cascade, driven by one shared piece of state (ST.cascadeShowScenario), so switching the
  // toggle on either subtab updates both consistently.
  const activeRegionalR = (ST.cascadeShowScenario && scenarioR) ? scenarioR : R;

  const body = ST.cascadeSub === "planetary"
    ? cascadePlanetaryTab(activeProp, scenarioSim, baseProp, scenarioProp, R.cascade, scenarioR ? scenarioR.cascade : null)
    : cascadeRegionalTab(activeRegionalR, scenarioSim);

  $("#v-cascade").innerHTML = cascadeSubtabsHTML() + body;

  document.querySelectorAll("#cascadeSubtabs .subtab").forEach(b=>b.onclick=()=>{
    ST.cascadeSub = b.dataset.csub; buildCascade(computeRisks(ST.region, ST.live, null)); $("#main").scrollTop=0;
  });
  document.querySelectorAll("#pwFilterBar .subtab").forEach(b=>b.onclick=()=>{
    ST.cascadeFilter = b.dataset.cat; buildCascade(computeRisks(ST.region, ST.live, null));
  });
  document.querySelectorAll("#pwNodeButtons .preset").forEach(b=>b.onclick=()=>{
    ST.cascadeNode = ST.cascadeNode===b.dataset.node ? null : b.dataset.node;
    buildCascade(computeRisks(ST.region, ST.live, null));
  });
  const pta=$("#pwToggleAllNodes"); if(pta) pta.onclick=()=>{ ST.cascadeShowAllNodes=!ST.cascadeShowAllNodes; buildCascade(computeRisks(ST.region, ST.live, null)); };
  const pxf=$("#pwExploreFull"); if(pxf) pxf.onclick=()=>{ ST.cascadeShowAllNodes=true; buildCascade(computeRisks(ST.region, ST.live, null)); const nb=$("#pwNodeButtons"); if(nb && nb.scrollIntoView) nb.scrollIntoView({behavior:"smooth", block:"nearest"}); };
  const pb=$("#pwShowBase"); if(pb) pb.onclick=()=>{ ST.cascadeShowScenario=false; buildCascade(computeRisks(ST.region, ST.live, null)); };
  const ps=$("#pwShowScenario"); if(ps) ps.onclick=()=>{ ST.cascadeShowScenario=true; buildCascade(computeRisks(ST.region, ST.live, null)); };
  const rgb=$("#rgShowBase"); if(rgb) rgb.onclick=()=>{ ST.cascadeShowScenario=false; buildCascade(computeRisks(ST.region, ST.live, null)); };
  const rgs=$("#rgShowScenario"); if(rgs) rgs.onclick=()=>{ ST.cascadeShowScenario=true; buildCascade(computeRisks(ST.region, ST.live, null)); };
  const prb=$("#pwRefreshBtn"); if(prb) prb.onclick=refresh;
}

function spilloverMap(activeProp){
  // Compact dotted/stippled world map (same real coastline data as hotspotMap/earthWatermarkSVG,
  // via worldLandPaths()) with a glowing origin marker. When spillover is "documented" it also
  // draws an arc to each real destination region from REGION_CONNECTIONS, with every dot
  // hoverable for real connection info. When spillover is only "possible" or "none", it shows
  // ONLY the origin marker with a subtle glow -- no decorative arcs in arbitrary directions, so
  // the map never visually implies a geographic destination the model does not actually know.
  // Sized small (this is a supporting visual, not the focus of the card) via its flex container
  // in cascadePlanetaryTab. Hover/focus uses the same .tip / .tip-box mechanism as hotspotMap().
  const W=720,H=360;
  const proj=(lat,lon)=>({ x:(lon+180)/360*W, y:(90-lat)/180*H });
  const o = proj(ST.region.lat, ST.region.lon);
  const tips=[];
  const tipDiv=(p,label,sub,key)=>{
    tips.push(`<div class="tip" tabindex="0" aria-label="${label}" style="position:absolute;left:${(p.x/W*100).toFixed(2)}%;top:${(p.y/H*100).toFixed(2)}%;
        transform:translate(-50%,-50%);width:22px;height:22px;margin:0;color:transparent;cursor:pointer" data-spill="${key}">
        <span class="tip-box" style="left:50%;top:auto;bottom:150%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px)">
          <b style="color:var(--txt)">${label}</b>${sub?`<br><span style="color:var(--muted)">${sub}</span>`:""}
        </span>
      </div>`);
  };

  let arcsSVG="", destDotsSVG="";
  if(activeProp.spilloverStatus==="documented"){
    activeProp.affectedRegions.forEach(ar=>{
      const reg = REGIONS.find(r=>r.id===ar.id); if(!reg) return;
      const p = proj(reg.lat, reg.lon);
      const mx=(o.x+p.x)/2, my=Math.min(o.y,p.y)-26;
      arcsSVG+=`<path d="M${o.x} ${o.y} Q${mx} ${my} ${p.x} ${p.y}" stroke="var(--amber)" stroke-width="1.5" fill="none" opacity=".8"/>`;
      destDotsSVG+=`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="var(--amber)" stroke="#2A1D06" stroke-width="1.2"/>`;
      tipDiv(p, reg.name, `${ar.connectionType} \u00B7 Source pressure: ${ar.sourceDomainLabel} \u00B7 ${(ar.impact*100).toFixed(1)} impact`, ar.id);
    });
  }

  const originLabel = activeProp.spilloverStatus==="documented" ? `Origin \u00B7 driving ${activeProp.affectedRegions.length} documented connection${activeProp.affectedRegions.length===1?"":"s"}`
    : activeProp.spilloverStatus==="possible" ? "Origin \u00B7 elevated pressure, no documented destination"
    : "Origin \u00B7 spillover not indicated at current levels";
  tipDiv(o, ST.region.name, originLabel, "origin");

  return `<div class="hot-map" style="aspect-ratio:2/1">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;display:block;border-radius:8px" aria-hidden="true">
      <defs>
        <clipPath id="spillLandClip">${worldLandPaths()}</clipPath>
        <pattern id="spillDots" width="7" height="7" patternUnits="userSpaceOnUse">
          <circle cx="1.6" cy="1.6" r="1.15" fill="#8FE3C9" opacity=".55"/>
        </pattern>
      </defs>
      <rect x="0" y="0" width="${W}" height="${H}" fill="#04140F"/>
      <rect x="0" y="0" width="${W}" height="${H}" fill="url(#spillDots)" clip-path="url(#spillLandClip)"/>
      ${arcsSVG}
      <circle cx="${o.x}" cy="${o.y}" r="12" fill="var(--amber)" opacity=".22"><animate attributeName="r" values="9;18;9" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;0;.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="${o.x}" cy="${o.y}" r="5.5" fill="var(--amber)" stroke="#2A1D06" stroke-width="1.4"/>
      ${destDotsSVG}
    </svg>
    ${tips.join("")}
  </div>`;
}

function cascadeScenarioImpact(baseProp, scenarioProp, baseRSS, scenarioRSS){
  // Same numerical comparison style used in Simulator's scoreCompareCard (baseline -> result,
  // signed delta, semantic color) but as a compact row list rather than another large card.
  if(!baseProp || !scenarioProp) return "";
  const fmt=d=> d===0?"\u00B10":(d>0?`(+${d})`:`(${d})`);
  const row=(label,a,b,unit,last)=>{
    const d=b-a;
    const col = d>0 ? "var(--red)" : d<0 ? "var(--aqua)" : "var(--muted)";
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;${last?"":"border-bottom:1px solid var(--line)"}">
      <span style="font-size:12px;color:var(--muted)">${label}</span>
      <span style="font-size:12.5px;font-family:'JetBrains Mono'"><b style="color:var(--txt)">${a}${unit||""}</b>
        <span style="color:var(--muted2)"> \u2192 </span><b style="color:var(--txt)">${b}${unit||""}</b>
        <span style="color:${col};margin-left:6px">${fmt(d)}</span></span>
    </div>`;
  };
  const rssRow = (baseRSS!=null && scenarioRSS!=null) ? row("Regional Stress Score", baseRSS, scenarioRSS, "") : "";
  return `<div class="panel">
    <div class="phead"><span class="dot" style="background:var(--amber)"></span><h2>Scenario impact</h2></div>
    <p style="font-size:11.5px;color:var(--muted);line-height:1.5;margin:0 0 4px">Baseline vs. current scenario, for ${ST.region.name}.</p>
    ${rssRow}
    ${row("Global Cascade Potential", baseProp.gcp, scenarioProp.gcp, "/100")}
    ${row("Affected systems", baseProp.affectedNodes.length, scenarioProp.affectedNodes.length, "")}
    ${row("Cascade depth", baseProp.depthReached, scenarioProp.depthReached, "", true)}
  </div>`;
}

function pathwayChainHTML(prop){
  // Circular nodes connected by directional arrows, matching the same node-and-arrow visual
  // identity as the Regional Cascade diagram (cascadeDiagram), instead of generic rectangular
  // boxes. Entirely driven by the actual computed activeProp.strongestPath -- nothing here is
  // hardcoded. Each node after the origin/initial-pressure pair shows its real GRAPH_NODES
  // category as a small role label. Horizontally scrollable so it never forces page-level
  // horizontal overflow on narrow screens.
  if(!prop.strongestPath){
    return `<div style="font-size:12px;color:var(--muted)">No propagating pathway detected at current levels.</div>`;
  }
  const chain = prop.strongestPath.chain;
  const CAT_COL = {origin:"--violet", pressure:"--amber", environmental:"--aqua",
    infrastructure:"--violet", resource:"--amber", human:"--red"};
  const seq = [
    {name: ST.region.name, role:"Origin region", cat:"origin"},
    {name: DOMAIN_LABEL[chain[0].from] || chain[0].from, role:"Initial pressure", cat:"pressure"},
    ...chain.map(hop=>{
      const node = NODE_BY_ID[hop.to];
      const cat = node ? node.category : "";
      return {name: node ? node.nm : hop.to, role: cat ? cat.charAt(0).toUpperCase()+cat.slice(1) : "", cat};
    })
  ];
  const n = seq.length, step = 132, pad = 66, H = 116, R = 22, y = H/2;
  const W = step*(n-1) + pad*2;
  let markerDefs="", arrowsSVG="", nodesSVG="";
  seq.forEach((nd,i)=>{
    const x = pad + step*i;
    const col = cv(CAT_COL[nd.cat] || "--aqua");
    if(i>0){
      const px = pad + step*(i-1);
      markerDefs += `<marker id="pwArrow${i}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${col}"/></marker>`;
      arrowsSVG += `<path d="M${px+R+4} ${y} L${x-R-10} ${y}" stroke="${col}" stroke-width="1.8" fill="none" marker-end="url(#pwArrow${i})"/>`;
    }
    const label = nd.name.length>18 ? nd.name.slice(0,17)+"\u2026" : nd.name;
    nodesSVG += `<g>
      <circle cx="${x}" cy="${y}" r="${R}" fill="${col}" fill-opacity=".15" stroke="${col}" stroke-width="2"/>
      <circle cx="${x}" cy="${y}" r="4" fill="${col}"/>
      <text x="${x}" y="${y-R-20}" text-anchor="middle" fill="${cv('--txt')}" font-size="10.5" font-weight="600" font-family="Space Grotesk">${label}</text>
      <text x="${x}" y="${y-R-8}" text-anchor="middle" fill="${col}" font-size="9" font-weight="700" font-family="Space Grotesk" letter-spacing=".4">${nd.role}</text>
    </g>`;
  });
  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <svg viewBox="0 0 ${W} ${H}" width="${Math.max(W,300)}" height="${H}" style="display:block;min-width:${W}px">
      <defs>${markerDefs}</defs>
      ${arrowsSVG}${nodesSVG}
    </svg>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:8px">${chain.length>1?"End-to-end pathway strength":"Pathway strength"}: <b style="color:var(--aqua)">${prop.strongestPath.value}/100</b></div>`;
}

function nodeDetailHTML(nodeId, prop){
  const node = NODE_BY_ID[nodeId];
  if(!node) return "";
  const incoming = GRAPH_EDGES.filter(e=>e.target===nodeId && (ST.cascadeFilter==="all"||e.category===ST.cascadeFilter));
  const outgoing = GRAPH_EDGES.filter(e=>e.source===nodeId && (ST.cascadeFilter==="all"||e.category===ST.cascadeFilter));
  const contribs = prop.contributions[nodeId] || [];
  const contribByEdge = Object.fromEntries(contribs.map(c=>[c.edgeId,c]));
  const evClass = (ev)=> ev==="evidence-based"?"ok":ev==="modeled-proxy"?"mdl":"load";
  const edgeRow = (e, dir)=>{
    const c = contribByEdge[e.id];
    const otherLabel = dir==="in"
      ? (DOMAIN_LABEL[e.source] || (NODE_BY_ID[e.source]&&NODE_BY_ID[e.source].nm) || e.source)
      : (NODE_BY_ID[e.target] ? NODE_BY_ID[e.target].nm : e.target);
    return `<div class="mit-meta-row">
      <span class="mm-k">${dir==="in"?"From":"To"}</span>
      <span class="mm-v">
        <b style="color:var(--txt)">${otherLabel}</b>
        <span class="fstat ${evClass(e.evidenceType)}" style="margin-left:6px">${e.evidenceType}</span>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">
          Strength ${e.strength} · Confidence ${e.confidence} ·
          ${c ? `<span style="color:var(--aqua)">active this run, impact ${(c.impact*100).toFixed(1)}</span>` : `<span style="color:var(--muted2)">not active at current levels</span>`}
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">${e.explanation}</div>
        <div style="font-size:10.5px;color:var(--muted2);margin-top:2px">Source: ${e.sourceReference}</div>
      </span>
    </div>`;
  };
  return `<div class="panel" style="background:var(--panel2);margin-top:14px">
    <div class="phead"><span class="dot" style="background:var(--violet)"></span><h2>${node.nm}</h2>
      <span class="tag">${node.category}</span></div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px">Criticality if disrupted: ${(node.criticality*100).toFixed(0)}/100</div>
    <div class="preset-lab">Incoming connections</div>
    <div class="mit-meta">
      ${incoming.length ? incoming.map(e=>edgeRow(e,"in")).join("") : '<div class="mit-meta-row"><span class="mm-v" style="color:var(--muted)">No documented incoming connections in this filter.</span></div>'}
    </div>
    <div class="preset-lab" style="margin-top:10px">Outgoing connections</div>
    <div class="mit-meta">
      ${outgoing.length ? outgoing.map(e=>edgeRow(e,"out")).join("") : '<div class="mit-meta-row"><span class="mm-v" style="color:var(--muted)">No documented outgoing connections in this filter.</span></div>'}
    </div>
  </div>`;
}

  document.querySelectorAll("#v-sim .preset").forEach(btn=>btn.onclick=()=>{

function renderSimDelta(sim){
  const cells=[["Regional Stress Score","cascade"]].concat(
    sim.after.domains.filter(d=>["storm","ocean","disp","ai"].includes(d.k)).map(d=>[d.nm,d.k]));
  const getv=(obj,k)=> k==="cascade"?obj.cascade : obj.domains.find(d=>d.k===k).v;
  let html="";
  cells.forEach(([nm,k])=>{
    const b=getv(sim.base,k), a=getv(sim.after,k), diff=a-b;
    const col=diff>0?"--red":diff<0?"--green":"--muted";
    const sign=diff>0?"▲ +":diff<0?"▼ ":"";
    html+=`<div class="delta">
      <div class="dn">${nm}</div>
      <div class="dv"><span class="base">${b}</span><span class="arr">→</span>
        <span class="new" style="color:${cv(rcolor(a))}">${a}</span></div>
      <div class="chg" style="color:${cv(col)}">${diff===0?'no change':sign+Math.abs(diff)}</div>
    </div>`;
  });
  // main regional driver: domain with the largest positive change
  let mainDriver=null, mainDelta=0;
  sim.after.domains.forEach(d=>{
    const b=sim.base.domains.find(x=>x.k===d.k).v, diff=d.v-b;
    if(diff>mainDelta){ mainDelta=diff; mainDriver=d.nm; }
  });
  return `<div class="preset-lab">Regional result</div>
    <div class="delta-grid">${html}</div>
    <div style="font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.5">
      Main regional driver: <b style="color:var(--txt)">${mainDriver?`${mainDriver} (+${mainDelta})`:"no domain moved"}</b>.
      Counterfactual applied to the live + modeled baseline. Each input changes only the domains it feeds;
      the Regional Stress Score then reflects those domain changes and the escalation term.</div>`;
}

function renderSimPlanetary(sim){
  const baseProp = propagatePlanetaryCascade(ST.region, sim.base, null);
  const afterProp = propagatePlanetaryCascade(ST.region, sim.after, {...ST.simInputs});
  const baseIds = new Set(baseProp.affectedNodes.map(n=>n.id));
  const afterIds = new Set(afterProp.affectedNodes.map(n=>n.id));
  const newSystems = afterProp.affectedNodes.filter(n=>!baseIds.has(n.id));
  const baseRegionIds = new Set(baseProp.affectedRegions.map(r=>r.id));
  const newRegions = afterProp.affectedRegions.filter(r=>!baseRegionIds.has(r.id));
  const gcpDiff = afterProp.gcp - baseProp.gcp;
  const col = gcpDiff>0?"--red":gcpDiff<0?"--green":"--muted";
  const sign = gcpDiff>0?"▲ +":gcpDiff<0?"▼ ":"";
  const pathTxt = (p)=> p.strongestPath ? p.strongestPath.labels.join(" → ") + ` (${p.strongestPath.value}/100)` : "none detected";
  return `
    <div class="preset-lab" style="margin-top:18px">Planetary result</div>
    <div class="delta-grid">
      <div class="delta">
        <div class="dn">Global Cascade Potential</div>
        <div class="dv"><span class="base">${baseProp.gcp}</span><span class="arr">→</span>
          <span class="new" style="color:${cv(gcpBand(afterProp.gcp).c)}">${afterProp.gcp}</span></div>
        <div class="chg" style="color:${cv(col)}">${gcpDiff===0?'no change':sign+Math.abs(gcpDiff)}</div>
      </div>

        <div class="dv"><span class="base">${baseProp.depthReached}</span><span class="arr">→</span>
          <span class="new">${afterProp.depthReached}</span></div>
        <div class="chg" style="color:var(--muted)">of max 3</div>

    </div>
    <div class="lvm" style="margin-top:10px;border-top:1px solid var(--line);padding-top:12px">
      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Newly affected systems</span>

      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Newly affected regions</span>
        <span class="lvm-v">${newRegions.length?newRegions.map(r=>r.name).join(", "):"none"}</span></div>
      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Strongest Active Pathway before</span>
        <span class="lvm-v">${pathTxt(baseProp)}</span></div>
      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Strongest Active Pathway after</span>
        <span class="lvm-v">${pathTxt(afterProp)}</span></div>
      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Confidence</span>
        <span class="lvm-v">${afterProp.confidence}</span></div>

    ${afterProp.assumptions.length?`<div class="mit-disc" style="margin-top:12px">Important assumptions: ${afterProp.assumptions.join(" ")}</div>`:""}
  `;
}

function mitImpactBucket(a, list){
  const maxRed = Math.max(...list.map(x=>x.red), 1);
  if(a.red >= maxRed*0.7) return "High";
  if(a.red >= maxRed*0.4) return "Medium";
  return "Low";
}

function buildMitigation(){
  const scenarioSim = ST.sim ? {...ST.simInputs} : null;
  const planningBasis = scenarioSim ? (ST.simLabel || "Custom scenario") : "Current conditions";
  const m=mitigations(ST.region, ST.live, scenarioSim);
  const IMPACT_COL = {High:"var(--green)", Medium:"var(--amber)", Low:"var(--muted)"};
  const EFFORT_COL = {Low:"var(--green)", Medium:"var(--amber)", High:"var(--red)"};
  const allSystems = [...new Set(m.list.flatMap(a=>a.domains))].sort();

  let filtered = m.list.filter(a=>{
    const q = ST.mitSearch.trim().toLowerCase();
    const matchesSearch = !q || a.nm.toLowerCase().includes(q) || a.why.toLowerCase().includes(q);
    const matchesSystem = ST.mitSystemFilter==="all" || a.domains.includes(ST.mitSystemFilter);
    return matchesSearch && matchesSystem;
  });
  if(ST.mitSort==="effort"){
    const order={Low:0,Medium:1,High:2};
    filtered = filtered.slice().sort((x,y)=>(order[x.cost]??1)-(order[y.cost]??1));
  } // default order from mitigations() is already Regional Stress reduction (red) descending

  const cards=filtered.map((a,i)=>{
    const bucket = mitImpactBucket(a, m.list);
    const checked = ST.mitSelected.includes(a.key);
    const meta=[
      ["Regional effect", `${a.why} (domains: ${a.domains.join(", ")})`],
      ["Planetary effect", a.planetaryNarrative],
      ["Regional Stress Score reduction", `${a.red>0?'−'+a.red:'~0'} points (${a.baseR} → ${a.afterR})`],
      ["Global Cascade Potential reduction", `${a.gcpRed>0?'−'+a.gcpRed:'~0'} points (${a.baseGcp} → ${a.afterGcp})`],
      ["Planetary pathways interrupted", a.pathwaysInterruptedList.length ? a.pathwaysInterruptedList.join("; ") : "none crossed the reporting threshold"],
      ["Cost category", a.cost],
      ["Implementation time", a.time],
      ["Regional relevance", a.relevanceTxt],
      ["Planetary relevance", a.planetaryRelevanceTxt],
      ["Evidence", a.conf],
      ["Evidence basis", "Regional reduction: full regional model rerun. Planetary reduction: full propagatePlanetaryCascade() rerun on the merged counterfactual, not summed from individual pathway effects."],
      ["Methodology", a.method],
      ["Limitations", a.limits],
    ].map(([k,v])=>`<div class="mit-meta-row"><span class="mm-k">${k}</span><span class="mm-v">${v}</span></div>`).join("");
    return `
    <div class="mit" data-key="${a.key}">
      <div style="display:flex;gap:10px;padding:14px 14px 0 14px;align-items:flex-start">
        <input type="checkbox" class="mit-check" data-check="${a.key}" ${checked?"checked":""} aria-label="Select ${a.nm} for AI Strategist">
        <button class="mit-head" data-toggle="${a.key}" style="padding:0 0 14px;flex:1;align-items:flex-start">
          <div class="rank">${i+1}</div>
          <div class="mbody">
            <h4>${a.nm}</h4>
            <p>${a.why}</p>
            <div class="mit-chips">${a.domains.map(d=>`<span class="mit-chip">${d}</span>`).join("")}</div>
            <div class="mit-badges">
              <span class="mit-badge" style="color:${IMPACT_COL[bucket]};border-color:${IMPACT_COL[bucket]}">Regional impact: ${bucket}</span>
              <span class="mit-badge" style="color:${EFFORT_COL[a.cost]||'var(--muted)'};border-color:${EFFORT_COL[a.cost]||'var(--muted)'}">Effort: ${a.cost}</span>
              <span class="mit-badge" style="color:var(--violet);border-color:var(--violet)">Evidence: ${a.conf}</span>
            </div>
          </div>
          <div class="mit-dual">
            <div class="red"><div class="rv">${a.red>0?'−'+a.red:'~0'}</div><div class="rl">pts regional</div></div>
            <div class="red"><div class="rv" style="color:var(--violet)">${a.gcpRed>0?'−'+a.gcpRed:'~0'}</div><div class="rl">pts cascade</div></div>
          </div>
          <div class="mit-caret" id="mcaret-${a.key}">▾</div>
        </button>
      </div>
      <div class="mit-detail" id="mdetail-${a.key}">
        <div class="mit-meta">${meta}</div>
      </div>
    </div>`;
  }).join("") || `<div class="mit-disc">No interventions match this search/filter.</div>`;

  const selCount = ST.mitSelected.length;
  const ctaLabel = selCount===0 ? "Build AI Strategy →" : `Build AI Strategy with ${selCount} Selected →`;
  const ctaSub = selCount>0
    ? "Selected actions will be required in the verified portfolio."
    : "Select up to 3 interventions to require them in the verified portfolio.";

  $("#v-mitigation").innerHTML=`
    <div class="panel" style="margin-bottom:14px">
      <div class="phead"><span class="dot" style="background:var(--violet)"></span>
        <h2>Planning basis</h2></div>
      <div class="iv" style="font-size:15px">${planningBasis}</div>
      <p style="font-size:11px;color:var(--muted);margin:4px 0 0">
        ${scenarioSim ? "Interventions are evaluated on top of this active Simulator scenario, not in place of it." : "No Simulator scenario is active; interventions are evaluated against current conditions."}</p>
    </div>
    <div class="panel">
      <div class="phead"><span class="dot" style="background:var(--green)"></span>
        <h2>Interventions</h2>
        <span class="tag">Base Stress ${m.baseR} · Base Cascade Potential ${m.baseGcp}</span></div>
      <p style="font-size:12.5px;color:#B7D3BF;line-height:1.55;margin:0 0 8px">
        Each intervention changes one or more documented model variables, then BOTH the regional model and
        the planetary propagation model are rerun. Ranked by modeled Regional Stress Score reduction.
        Tap any intervention to see its full regional and planetary effects.</p>
      <div class="mit-disc">All reductions are <b>modeled estimates</b> from rerunning the deterministic models, not guarantees.</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin:12px 0">

          style="flex:1 1 200px;min-width:160px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;

            border-radius:8px;color:var(--txt);font-size:12px;padding:8px 10px">
          <option value="all" ${ST.mitSystemFilter==="all"?"selected":""}>All systems</option>
          ${allSystems.map(sys=>`<option value="${sys}" ${ST.mitSystemFilter===sys?"selected":""}>${sys}</option>`).join("")}
        </select>
        <select id="mitSort" style="flex:0 1 200px;background:var(--panel2);border:1px solid var(--line);
            border-radius:8px;color:var(--txt);font-size:12px;padding:8px 10px">
          <option value="impact" ${ST.mitSort!=="effort"?"selected":""}>Regional Impact (High to Low)</option>
          <option value="effort" ${ST.mitSort==="effort"?"selected":""}>Effort (Low to High)</option>
        </select>
      </div>
      ${cards}
      <div style="margin-top:16px;display:flex;flex-direction:column;gap:6px">
        <button class="btn primary" id="btnBuildStrategyFromMit" style="background:var(--violet);color:#0E1230">${ctaLabel}</button>
        <div id="mitSelCountTxt" style="font-size:10.5px;color:var(--muted);text-align:center">${ctaSub}</div>
      </div>
    </div>`;

  document.querySelectorAll("#v-mitigation .mit-head").forEach(btn=>btn.onclick=()=>{
    const k=btn.dataset.toggle;
    const d=$("#mdetail-"+k), c=$("#mcaret-"+k);
    const open=d.classList.contains("open");
    d.classList.toggle("open"); if(c) c.textContent=open?"▾":"▴";
  });
  document.querySelectorAll("#v-mitigation .mit-check").forEach(cb=>cb.onclick=(e)=>{
    e.stopPropagation();
    const key=cb.dataset.check;
    const idx=ST.mitSelected.indexOf(key);
    if(cb.checked && idx===-1){
      if(ST.mitSelected.length>=3){
        cb.checked=false;
        toast("EarthShield strategies contain three interventions. Deselect one before adding another.");
        return;
      }
      ST.mitSelected.push(key);
    }
    if(!cb.checked && idx!==-1) ST.mitSelected.splice(idx,1);
    buildMitigation();
  });
  const ms=$("#mitSearch"); if(ms) ms.oninput=()=>{ ST.mitSearch=ms.value; buildMitigation(); };
  const mf=$("#mitSystemFilter"); if(mf) mf.onchange=()=>{ ST.mitSystemFilter=mf.value; buildMitigation(); };
  const msort=$("#mitSort"); if(msort) msort.onchange=()=>{ ST.mitSort=msort.value; buildMitigation(); };
  const bs=$("#btnBuildStrategyFromMit"); if(bs) bs.onclick=()=>{
    ST.requiredActionKeys=[...ST.mitSelected];
    setView("strategist"); buildStrategist(); $("#main").scrollTop=0;
  };
}

/* =========================================================
   AI CASCADE STRATEGIST. A structured planning interface, not
   a chatbot. The browser generates verified deterministic
   candidates locally (generateInterventionCandidates), then
   either asks the Netlify function to have Gemini select and
   explain ONE of them, or runs the same selection with the
   non-AI generateInstantCascadeStrategy(). Every score shown
   here comes from the verified candidate object, never from
   AI-generated text. Any Netlify/Gemini failure of any kind
   (missing key, 429, timeout, 5xx, malformed JSON, failed
   validation, or simply no Netlify backend present) falls
   back to the instant rule-based strategy automatically.
   ========================================================= */
function strategistOptionsHTML(){
  const DECISION_MAKERS = ["International organization","National government","Regional government",

  const OBJECTIVES = Object.keys(OBJECTIVE_TAG);

  const opt=(arr,cur)=>arr.map(v=>`<option value="${v}" ${v===cur?'selected':''}>${v}</option>`).join("");
  return `
    <div class="strat-form">
      <div class="strat-field"><label>Decision-maker</label>
        <select id="stratRole">${opt(DECISION_MAKERS, s.decisionMaker)}</select></div>

        <select id="stratObjective">${opt(OBJECTIVES, s.objective)}</select></div>
      <div class="strat-field"><label>Budget</label>
        <select id="stratBudget">${opt(BUDGETS, s.budget)}</select></div>
      <div class="strat-field"><label>Implementation horizon</label>
        <select id="stratHorizon">${opt(HORIZONS, s.horizon)}</select></div>
      <div class="strat-field"><label>Intervention location</label>

  const genInstant = $("#stratGenInstant"); if(genInstant) genInstant.onclick=()=>runStrategistGenerate(false);

async function runStrategistGenerate(useAI, presetPrefs){
  const s = ST.strategist;
  if(presetPrefs) Object.assign(s, presetPrefs);
  s.infeasible = null;
  s.loading = !!useAI; s.notice = null;
  if(useAI) buildStrategist();

  // scenario-aware: if the user has run a simulator scenario, the strategist plans
  // against that scenario's state, not the untouched baseline.
  const scenarioSim = ST.sim ? { ...ST.simInputs } : null;
  const R = computeRisks(ST.region, ST.live, scenarioSim);
  const prop = propagatePlanetaryCascade(ST.region, R, scenarioSim);
  const candResult = generateInterventionCandidates({
    region: ST.region, live: ST.live, budget: s.budget, objective: s.objective,
    horizon: s.horizon, location: s.location, scenarioSim,
    requiredActionKeys: ST.requiredActionKeys,
  });
  s.candResult = candResult;

  // Required interventions are HARD requirements. If no feasible 3-action portfolio
  // satisfies them under the current budget, EarthShield does not silently ignore the
  // selection or fall through to Gemini with unrelated candidates -- it stops and tells
  // the user exactly what to change.
  if(!candResult.candidates.length){
    const actsByKey = Object.fromEntries(mitigationActions().map(a=>[a.key,a]));
    const reqK = candResult.requiredActionKeys||[];
    s.infeasible = reqK.length
      ? `No verified 3-intervention portfolio can satisfy the selected actions (${reqK.map(k=>actsByKey[k]?actsByKey[k].nm:k).join(", ")}) under the current budget. Increase the budget or remove one of the required interventions.`
      : "No verified 3-intervention portfolio is feasible under the current budget. Increase the budget.";
    s.result = null; s.loading = false;
    buildStrategist();
    return s;
  }

  if(!useAI){
    const instant = generateInstantCascadeStrategy(candResult, s);
    s.result = instant; s.source = "instant"; s.loading = false; s.notice = null;
    s.verified = candResult.candidates.find(c=>c.id===instant.selectedCandidateId);
    buildStrategist();
    return s;
  }

  const payload = {
    region: ST.region.name,
    scenario: ST.sim ? "user-run simulation scenario" : "current conditions",
    regionalStressScore: R.cascade,
    globalCascadePotential: prop.gcp,
    domains: R.domains.map(d=>({name:d.nm, score:d.v})),
    strongestPathways: prop.strongestPath ? [prop.strongestPath.labels.join(" → ")] : [],
    affectedSystems: prop.affectedNodes.map(n=>n.nm),
    affectedRegions: prop.affectedRegions.map(r=>r.name),
    confidence: prop.confidence,
    candidates: candResult.candidates,
    userRole: s.decisionMaker, objective: s.objective, budget: s.budget,
    horizon: s.horizon, locationPreference: s.location, localConcern: s.concern||"",
    requiredActionKeys: candResult.requiredActionKeys||[],
    approvedSourceSummaries: (typeof SOURCES!=="undefined"?SOURCES:[]).map(src=>`${src.nm}: ${src.d}`),
  };

  const FALLBACK_MSG = "AI strategy is temporarily unavailable. An instant rule-based strategy has been generated instead.";
  let fellBack = false, noticeMsg = "";
  try{
    const res = await fetch("/.netlify/functions/ai-strategist", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload),
    });
    if(!res.ok){
      fellBack = true; noticeMsg = FALLBACK_MSG;
    } else {
      const data = await res.json();
      const check = validateStrategistResponse(candResult.candidates, data.strategy, candResult.requiredActionKeys);
      // The server never sends back a candidate object as "verified". The browser is the
      // sole numerical source of truth: it looks up Gemini's selectedCandidateId in its own
      // locally-generated candidate list and displays only that local candidate's numbers.
      const localVerified = check.valid
        ? candResult.candidates.find(c=>c.id===data.strategy.selectedCandidateId)
        : null;
      if(!check.valid || !localVerified){
        fellBack = true; noticeMsg = FALLBACK_MSG;
      } else {
        s.result = data.strategy; s.source = "gemini"; s.verified = localVerified;
      }
    }
  }catch(e){
    fellBack = true; noticeMsg = FALLBACK_MSG;
  }

  if(fellBack){
    const instant = generateInstantCascadeStrategy(candResult, s);
    s.result = instant; s.source = "instant"; s.notice = noticeMsg;
    s.verified = candResult.candidates.find(c=>c.id===instant.selectedCandidateId);
  }
  s.loading = false;
  buildStrategist();
  return s;
}

/* ---- provenance without false precision: what each input actually is ---- */
function provenanceTableHTML(){
  const rows = [
    ["Sea-surface temperature","Current API","Open-Meteo Marine API","Current sea temperature (15-minutely model)","~0.25° grid, nearest point to region centroid","High","Single-point sample, not a regional average. API value may be model/analysis-derived, not necessarily a direct instrument observation."],
    ["SST baseline","Derived (regression)","OLS fit on Open-Meteo Marine history","Trailing 60 days","Same grid point as live SST","Moderate","Assumes a locally linear recent trend, not true seasonal climatology"],
    ["CAPE / wind shear / humidity","Current API","Open-Meteo Forecast API","Current day forecast","~0.1-0.25° grid","Moderate","Forecast model output, not direct observation. Wind shear is a simplified vertical-wind-shear proxy, transformed into low-shear favorability before use."],
    ["Air quality (AQI / PM2.5)","Current API","Open-Meteo Air Quality API","Current hour","~0.1° grid","Moderate","Single-point sample near region centroid"],
    ["Regional pressure indices (data center, mining, industry, energy, forest, coastal exposure, coastal population)","Modeled","Calibrated from NASA / IEA / IPCC public ranges","2024 reference year","Regional (whole-region estimate)","Low-Moderate","Hand-calibrated indices, not direct measurements; treat as illustrative baselines"],
    ["Graph edge strengths / vulnerabilities","Scenario/assumption","EarthShield dependency-graph design","Not time-based","Regional, reused across all 8 regions","Low-Moderate","Manually assigned to be directionally reasonable, not fit to observed cascade data"],
  ];
  const trs = rows.map(([input,status,source,ref,res,conf,lim])=>`
    <tr><td>${input}</td><td>${status}</td><td>${source}</td><td>${ref}</td><td>${res}</td><td>${conf}</td><td style="color:var(--muted)">${lim}</td></tr>`).join("");
  return `<div class="panel">
    <div class="phead"><span class="dot" style="background:var(--violet)"></span>
      <h2>Provenance</h2><span class="tag">No false precision</span></div>
    <p style="font-size:11.5px;color:var(--muted);margin:0 0 12px">
      Every important input, what it is, where it came from, and its limitation. Regional pressure indices
      and graph edge weights are explicitly labelled as calibrated/assumed, not measured.</p>
    <div style="overflow-x:auto">
    <table class="score-tbl" style="min-width:640px">
      <thead><tr><th>Input</th><th>Status</th><th>Source</th><th>Reference</th><th>Resolution</th><th>Confidence</th><th>Limitation</th></tr></thead>
      <tbody>${trs}</tbody>
    </table>
    </div>
  </div>`;
}

/* =========================================================

   page and every inline help icon / tooltip in the app. Keeping a
   single source of truth means a definition can never drift between
   a tooltip and the glossary entry for the same term.
   plain: user-facing plain-language name
   technical: technical name/abbreviation, if any (null if none)
   def: short definition
   why: why it matters in EarthShield specifically
   ========================================================= */
const GLOSSARY = {
  regionalStress: { plain:"Regional Stress Score", technical:null,
    def:"A modeled 0–100 score combining EarthShield's seven regional risk domains. Higher values indicate more combined pressure.",
    why:"This is the headline number for the region you have selected; every other regional view explains what feeds into it." },
  globalCascadePotential: { plain:"Global Cascade Potential", technical:"GCP",
    def:"A modeled 0–100 index estimating how strongly stress in the selected region could propagate through EarthShield's connected systems. It is not a disaster forecast.",
    why:"It is the second headline score, showing how far a regional problem could reach beyond the region itself." },
  connectivityIndex: { plain:"Modeled connectivity index", technical:null,
    def:"Estimates how stress may propagate through EarthShield's defined dependency graph. It is not a probability, operational forecast, or globally validated risk rating.",
    why:"This caption sits under the Global Cascade Potential score to make clear what kind of number it is." },
  sst: { plain:"Sea-surface temperature", technical:"SST",
    def:"The temperature of the ocean's surface layer at the region's location, pulled from live marine data where available.",
    why:"Warmer sea-surface temperature is the primary fuel EarthShield uses to estimate ocean heat and storm-intensification risk." },
  sstAnomaly: { plain:"Sea temperature difference from baseline", technical:"SST anomaly",
    def:"How much warmer or cooler the current sea-surface temperature is compared with EarthShield's recent statistical baseline.",
    why:"A positive anomaly is the strongest single signal EarthShield uses to raise ocean and storm-related risk for a region." },
  statisticalBaseline: { plain:"Statistical SST baseline", technical:"OLS-fit baseline",
    def:"A recent-trend baseline for sea-surface temperature, fit from about 60 days of real historical data instead of a fixed constant.",
    why:"EarthShield compares live sea temperature against this fitted baseline, not a hardcoded number, to compute the anomaly." },
  olsRegression: { plain:"Statistical trend model", technical:"OLS regression",
    def:"Ordinary least squares regression, a standard statistical method for fitting a straight-line trend through recent data points.",
    why:"EarthShield uses this to fit the sea-surface temperature baseline. It is a real statistical model, not the generative-AI Strategist." },
  cape: { plain:"Atmospheric instability", technical:"CAPE",
    def:"Convective Available Potential Energy estimates how much energy is available for rising air and thunderstorm development.",
    why:"Higher instability is one of the atmospheric ingredients EarthShield combines with ocean heat to estimate storm-intensification risk." },
  windShear: { plain:"Wind shear", technical:null,
    def:"A simplified vertical-wind-shear proxy comparing wind-speed magnitudes at two atmospheric levels, not a full wind-vector shear calculation or operational cyclone forecasting.",
    why:"EarthShield transforms wind shear into low-shear favorability, since lower shear allows storms to organize while higher shear disrupts them, then combines that with instability and humidity in the storm-intensification domain." },
  lowShearFavorability: { plain:"Low-shear favorability", technical:null,
    def:"A 0 to 1 transformation of the wind-shear proxy where lower shear produces higher favorability for storm organization, and higher shear produces lower favorability.",
    why:"This corrects a naive reading where more shear would be treated as more storm risk. Meteorologically, low shear favors storm intensification, so EarthShield scores it that way." },
  shearProxy: { plain:"Simplified vertical-wind-shear proxy", technical:null,
    def:"EarthShield's wind-shear signal compares wind-speed magnitudes at two atmospheric levels rather than full wind vectors, and is intentionally simplified.",
    why:"This is not operational cyclone forecasting; it is a transparent, deterministic ingredient inside the Storm Intensification domain." },
  humidity: { plain:"Humidity", technical:null,
    def:"Surface moisture in the air, pulled from live atmospheric data where available.",
    why:"Humidity is another convective ingredient EarthShield combines with ocean heat and instability for storm risk." },
  aqi: { plain:"Air quality", technical:"AQI",
    def:"The Air Quality Index summarizes how polluted the air is, on a standard scale.",
    why:"Poorer air quality contributes to EarthShield's biodiversity and resource-stress domains." },
  pm25: { plain:"Fine particulate matter", technical:"PM2.5",
    def:"Airborne particles smaller than 2.5 micrometers, a standard measure of air pollution and a contributor to the Air Quality Index.",
    why:"PM2.5 is one of the live air-quality signals EarthShield pulls in alongside AQI." },
  resourceStress: { plain:"Resource Stress", technical:null,
    def:"One of EarthShield's seven risk domains, combining industrial activity, mining, energy demand, forest-cover pressure, air quality and AI data-center load into a single pressure score.",
    why:"Resource Stress is where human consumption pressure, distinct from ocean warming, enters the Regional Stress Score." },
  dataCenterLoad: { plain:"AI Data Center Load", technical:null,
    def:"A modeled index of regional data-center electricity and cooling demand, a fast-growing modern driver of resource pressure.",
    why:"EarthShield treats AI and data-center growth as a first-class, rising pressure rather than folding it invisibly into generic energy demand." },
  forestCoverPressure: { plain:"Forest-Cover Pressure", technical:null,
    def:"Pressure associated with limited forest cover and modeled land-cover degradation, shown as a Regional Cascade driver.",
    why:"EarthShield has not measured historical deforestation rates for every region, so this baseline driver is framed as cover pressure rather than a claimed loss rate." },
  additionalForestLoss: { plain:"Additional Forest Loss", technical:null,
    def:"A Simulator counterfactual that reduces forest cover relative to the current baseline, used to test how further forest loss would affect Food & Water and Resource Stress.",
    why:"This is the scenario-testing counterpart to Forest-Cover Pressure: it represents a hypothetical additional reduction, not a measured historical trend." },
  cascadePathway: { plain:"Cascade pathway", technical:null,
    def:"A specific chain of connections, from a regional risk domain through EarthShield's dependency graph, showing how stress could reach other systems.",
    why:"Pathways are what make Global Cascade Potential explainable: every number traces back to a real, inspectable chain of edges." },
  materialSystem: { plain:"Materially affected system", technical:null,
    def:"A planetary system node whose modeled impact from the current scenario clears EarthShield's calibrated significance threshold, not just a nonzero signal.",
    why:"This distinguishes systems genuinely worth a decision-maker's attention from minor secondary signals." },
  crossRegionSpillover: { plain:"Cross-region spillover", technical:null,
    def:"The possibility that displacement pressure from the selected region reaches another region, based on a small documented dataset of real connections (shared storm basins, migration corridors, shared infrastructure).",
    why:"EarthShield only names a destination region when a documented connection exists; otherwise it reports spillover as possible without inventing a destination." },
  sensitivity: { plain:"Model sensitivity", technical:null,
    def:"Sensitivity shows how much the modeled score changes when uncertain assumptions are varied within their tested ranges. It is not a probability forecast or a statistical confidence interval.",
    why:"It shows how much the Regional Stress Score could move if a key assumption were different, a transparency check rather than a forecast interval." },
  sensitivityLevel: { plain:"Sensitivity level", technical:null,
    def:"A plain-language summary of how much the score moved under the sensitivity test. Low means a small change, Moderate means a noticeable change, High means a large change.",
    why:"High-sensitivity results should be interpreted with more caution than low-sensitivity ones, since the score depends more heavily on an uncertain assumption." },
  confidence: { plain:"Model confidence", technical:null,
    def:"A plain-language label (High / Moderate / Assumption-sensitive) summarizing how much the score moved under the sensitivity test.",
    why:"Assumption-sensitive results should be interpreted with more caution than high-confidence ones." },
  assumptionSensitive: { plain:"Assumption-sensitive", technical:null,
    def:"The exact score changes noticeably when model assumptions are varied, so the result should be interpreted with more caution.",
    why:"This is EarthShield's lowest confidence label, an honest flag rather than a hidden caveat." },
  modeledBaseline: { plain:"Modeled baseline", technical:null,
    def:"A regional value calibrated from public-source ranges (for example NASA, IEA, IPCC) rather than pulled from a live feed.",
    why:"EarthShield labels every input as live or modeled so users know which numbers are measured right now versus estimated." },
  liveSignal: { plain:"Current API signal", technical:null,
    def:"A current value retrieved from an external data API (Open-Meteo marine, forecast, or air-quality). Depending on the source, it may represent model output, analysis, or measurement-derived data, not necessarily a direct instrument observation.",
    why:"Current API signals update EarthShield's regional score with current conditions instead of a static assumption." },
  scenario: { plain:"Scenario", technical:null,
    def:"A counterfactual set of stressor changes, applied on top of the current baseline to see how the regional and planetary scores would respond.",
    why:"Scenarios, built in the Simulator, let users test what-if situations without altering the live baseline." },
  intervention: { plain:"Intervention", technical:null,
    def:"A specific, documented action (for example hardening the grid or restoring wetlands) that changes one or more model variables and is verified by rerunning the full model.",
    why:"Every intervention effect shown in EarthShield comes from an actual model rerun, not an estimated or asserted number." },
  evidenceBased: { plain:"Evidence-based connection", technical:null,
    def:"A dependency-graph connection backed by a specific, named real-world source (for example a NASA or NOAA dataset or report).",
    why:"This is EarthShield's highest-confidence category of cascade connection." },
  modeledProxy: { plain:"Modeled proxy", technical:null,
    def:"A dependency-graph connection representing a widely documented real-world pattern, but scored using EarthShield's own modeled strength rather than one specific measured coefficient.",
    why:"This is an honest middle confidence tier, real but not tied to a single citable number." },
  scenarioAssumption: { plain:"Scenario assumption", technical:null,
    def:"A dependency-graph connection that is a reasonable modeling assumption, not independently measured or sourced.",
    why:"EarthShield's lowest-confidence connection tier, shown so users know exactly which links are asserted versus sourced." },
  verifiedResult: { plain:"Verified result", technical:null,
    def:"Verified means the displayed impact was recalculated by EarthShield's deterministic models. The AI did not generate these scores.",
    why:"Gemini selects and explains a strategy; EarthShield calculates and verifies every displayed score, so the numbers you see never come directly from the AI." },
};
/* Small inline help icon (ⓘ) reusing the existing .tip/.tip-box tooltip pattern,
   sourced from the same GLOSSARY object as the Info -> Glossary page so a definition
   can never drift between a tooltip and the glossary entry for the same term. */
function helpIcon(key){
  const g = GLOSSARY[key];
  if(!g) return "";
  const label = g.technical ? `${g.plain} (${g.technical})` : g.plain;
  return `<span class="tip" tabindex="0">ⓘ<span class="tip-box"><b>${label}</b><br>${g.def}</span></span>`;
}
