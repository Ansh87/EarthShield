function ringSVG(score, opts){
  opts = opts || {};
  const bandFn = opts.bandFn || band;
  const label = opts.label===undefined ? "Regional Stress" : opts.label;
  const size = opts.size || 132, r = size/2 - 14;
  const band_=bandFn(score), C=2*Math.PI*r, off=C*(1-score/100);
  return `<div class="cascade-ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${cv('--line')}" stroke-width="9" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${cv(band_.c)}" stroke-width="9" fill="none"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
        style="transition:stroke-dashoffset 1s cubic-bezier(.4,1.2,.5,1)"/>
    </svg>
    <div class="ctr"><div class="num" style="color:${cv(band_.c)}">${score}</div>
      ${label?`<div class="lbl">${label}</div>`:""}</div>
  </div>`;
}

function scoreDeltaInterpretation(metricLabel, delta, context){
  // context: "scenario" (Simulator) or "strategy" (AI Strategist). Shared wording so the same
  // metric change reads the same way everywhere it appears (Simulator, AI Strategist, Cascade
  // scenario-impact panel).
  const under = context==="strategy" ? "the selected strategy" : "this scenario";
  if(delta===0) return `No meaningful change in ${metricLabel} under ${under}.`;
  const verb = context==="strategy" ? (delta>0?"increases":"decreases") : (delta>0?"increased":"decreased");
  const prefix = context==="strategy" ? "Verified " : "";
  const label = prefix ? metricLabel : (metricLabel.charAt(0).toUpperCase()+metricLabel.slice(1));
  return `${prefix}${label} ${verb} under ${under}.`;
}

function scoreCompareCard(opts){
  // The single shared "result" score component used by Overview, Simulator, and AI Strategist:
  // one ring for the RESULTING score (never two rings for the same metric), plus a compact
  // baseline -> result -> delta row underneath, using the same semantic delta colors everywhere
  // (reduction/improvement = aqua, increase/worsening = amber or red by severity, no change =
  // muted). Always shows the numeric +/- delta, never relies on color alone.
  const bandFn = opts.bandFn || band;
  const b = bandFn(opts.resultScore);
  const delta = opts.resultScore - opts.baselineScore;
  const magnitude = Math.abs(delta);
  const deltaCol = delta===0 ? "var(--muted)" : delta<0 ? "var(--aqua)" : (magnitude>=10 ? "var(--red)" : "var(--amber)");
  const deltaTxt = delta===0 ? "\u00B10" : (delta>0?`+${delta}`:`${delta}`);
  return `<div class="score-block">
    ${ringSVG(opts.resultScore, {label:"", bandFn, size:opts.size||96})}
    <div style="min-width:0;flex:1">
      <div style="font-size:10.5px;color:var(--muted);letter-spacing:.4px">${opts.label}${opts.help?opts.help:""}</div>
      <div style="font-family:'Space Grotesk';font-size:13.5px;font-weight:600;color:${cv(b.c)};margin-top:5px">${b.t}</div>
      <div class="score-sub mono" style="margin-top:4px;font-size:11.5px">
        ${opts.baselineLabel||"Baseline"} ${opts.baselineScore} <span style="color:var(--muted2)">\u2192</span>
        ${opts.resultLabel||"Result"} ${opts.resultScore}
        <b style="color:${deltaCol};margin-left:6px">${deltaTxt}</b>
      </div>
      ${opts.interpretation?`<div class="score-sub" style="margin-top:4px">${opts.interpretation}</div>`:""}
    </div>
  </div>`;
}

function renderSimDelta(sim){
  const cells=[["Regional Stress Score","cascade"]].concat(
    sim.after.domains.filter(d=>["storm","ocean","disp","ai"].includes(d.k)).map(d=>[d.nm,d.k]));
  const getv=(obj,k)=> k==="cascade"?obj.cascade : obj.domains.find(d=>d.k===k).v;
  let html="";
  cells.forEach(([nm,k])=>{
    const b=getv(sim.base,k), a=getv(sim.after,k), diff=a-b;
    const col=diff>0?"--red":diff<0?"--green":"--muted";
    const sign=diff>0?"▲ +":diff<0?"▼ ":"";
    html+=`<div class="delta">
      <div class="dn">${nm}</div>
      <div class="dv"><span class="base">${b}</span><span class="arr">→</span>
        <span class="new" style="color:${cv(rcolor(a))}">${a}</span></div>
      <div class="chg" style="color:${cv(col)}">${diff===0?'no change':sign+Math.abs(diff)}</div>
    </div>`;
  });
  // main regional driver: domain with the largest positive change
  let mainDriver=null, mainDelta=0;
  sim.after.domains.forEach(d=>{
    const b=sim.base.domains.find(x=>x.k===d.k).v, diff=d.v-b;
    if(diff>mainDelta){ mainDelta=diff; mainDriver=d.nm; }
  });
  return `<div class="preset-lab">Regional result</div>
    <div class="delta-grid">${html}</div>
    <div style="font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.5">
      Main regional driver: <b style="color:var(--txt)">${mainDriver?`${mainDriver} (+${mainDelta})`:"no domain moved"}</b>.
      Counterfactual applied to the live + modeled baseline. Each input changes only the domains it feeds;
      the Regional Stress Score then reflects those domain changes and the escalation term.</div>`;
}

async function runStrategistGenerate(useAI, presetPrefs){
  const s = ST.strategist;
  if(presetPrefs) Object.assign(s, presetPrefs);
  s.loading = !!useAI; s.notice = null;
  if(useAI) renderStrategyPanel();

  // scenario-aware: if the user has run a simulator scenario, the strategist plans
  // against that scenario's state, not the untouched baseline.
  const scenarioSim = currentScenarioSim();
  const R = computeRisks(ST.region, ST.live, scenarioSim);
  const prop = propagatePlanetaryCascade(ST.region, R, scenarioSim);
  const candResult = generateInterventionCandidates({
    region: ST.region, live: ST.live, budget: s.budget, objective: s.objective,
    horizon: s.horizon, location: s.location, scenarioSim,
    selectedKeys: selectedInterventionKeys(),
  });
  s.candResult = candResult;
  // The ticked interventions could not be combined under the selected budget, so the
  // optimizer widened the search. Say so rather than silently ignoring the selection.
  const selectionDropped = ST.mitSelected.length>0 && !candResult.selectionApplied;
  const SELECTION_MSG = "The ticked interventions cannot be funded together under the selected budget, so the strategy was built from all feasible portfolios instead.";

  if(!useAI){
    const instant = generateInstantCascadeStrategy(candResult, s);
    s.result = instant; s.source = "instant"; s.loading = false;
    s.notice = selectionDropped ? SELECTION_MSG : null;
    s.verified = candResult.candidates.find(c=>c.id===instant.selectedCandidateId);
    renderStrategyPanel();
    return s;
  }

  const payload = {
    region: ST.region.name,
    scenario: ST.sim ? "user-run simulation scenario" : "current conditions",
    regionalStressScore: R.cascade,
    globalCascadePotential: prop.gcp,
    domains: R.domains.map(d=>({name:d.nm, score:d.v})),
    strongestPathways: prop.strongestPath ? [prop.strongestPath.labels.join(" → ")] : [],
    affectedSystems: prop.affectedNodes.map(n=>n.nm),
    affectedRegions: prop.affectedRegions.map(r=>r.name),
    confidence: prop.confidence,
    candidates: candResult.candidates,
    userRole: s.decisionMaker, objective: s.objective, budget: s.budget,
    horizon: s.horizon, locationPreference: s.location, localConcern: s.concern||"",
    approvedSourceSummaries: (typeof SOURCES!=="undefined"?SOURCES:[]).map(src=>`${src.nm}: ${src.d}`),
  };

  const FALLBACK_MSG = "AI strategy is temporarily unavailable. An instant rule-based strategy has been generated instead.";
  let fellBack = false, noticeMsg = "";
  try{
    const res = await fetch("/.netlify/functions/ai-strategist", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload),
    });
    if(!res.ok){
      fellBack = true; noticeMsg = FALLBACK_MSG;
    } else {
      const data = await res.json();
      const check = validateStrategistResponse(candResult.candidates, data.strategy);
      // The server never sends back a candidate object as "verified". The browser is the
      // sole numerical source of truth: it looks up Gemini's selectedCandidateId in its own
      // locally-generated candidate list and displays only that local candidate's numbers.
      const localVerified = check.valid
        ? candResult.candidates.find(c=>c.id===data.strategy.selectedCandidateId)
        : null;
      if(!check.valid || !localVerified){
        fellBack = true; noticeMsg = FALLBACK_MSG;
      } else {
        s.result = data.strategy; s.source = "gemini"; s.verified = localVerified;
      }
    }
  }catch(e){
    fellBack = true; noticeMsg = FALLBACK_MSG;
  }

  if(fellBack){
    const instant = generateInstantCascadeStrategy(candResult, s);
    s.result = instant; s.source = "instant"; s.notice = noticeMsg;
    s.verified = candResult.candidates.find(c=>c.id===instant.selectedCandidateId);
  }
  if(selectionDropped) s.notice = (s.notice? s.notice+" " : "") + SELECTION_MSG;
  s.loading = false;
  renderStrategyPanel();
  return s;
}

/* =========================================================
   CENTRAL GLOSSARY. One object, used for both the Info -> Glossary
   page and every inline help icon / tooltip in the app. Keeping a
   single source of truth means a definition can never drift between
   a tooltip and the glossary entry for the same term.
   plain: user-facing plain-language name
   technical: technical name/abbreviation, if any (null if none)
   def: short definition
   why: why it matters in Spillover specifically
   ========================================================= */
const GLOSSARY = {
  regionalStress: { plain:"Regional Stress Score", technical:null,
    def:"A modeled 0–100 score combining Spillover's seven regional risk domains. Higher values indicate more combined pressure.",
    why:"This is the headline number for the region you have selected; every other regional view explains what feeds into it." },
  globalCascadePotential: { plain:"Global Cascade Potential", technical:"GCP",
    def:"A modeled 0–100 index estimating how strongly stress in the selected region could propagate through Spillover's connected systems. It is not a disaster forecast.",
    why:"It is the second headline score, showing how far a regional problem could reach beyond the region itself." },
  connectivityIndex: { plain:"Modeled connectivity index", technical:null,
    def:"Estimates how stress may propagate through Spillover's defined dependency graph. It is not a probability, operational forecast, or globally validated risk rating.",
    why:"This caption sits under the Global Cascade Potential score to make clear what kind of number it is." },
  sst: { plain:"Sea-surface temperature", technical:"SST",
    def:"The temperature of the ocean's surface layer at the region's location, pulled from live marine data where available.",
    why:"Warmer sea-surface temperature is the primary fuel Spillover uses to estimate ocean heat and storm-intensification risk." },
  sstAnomaly: { plain:"Sea temperature difference from baseline", technical:"SST anomaly",
    def:"How much warmer or cooler the current sea-surface temperature is compared with Spillover's recent statistical baseline.",
    why:"A positive anomaly is the strongest single signal Spillover uses to raise ocean and storm-related risk for a region." },
  statisticalBaseline: { plain:"Statistical SST baseline", technical:"OLS-fit baseline",
    def:"A recent-trend baseline for sea-surface temperature, fit from about 60 days of real historical data instead of a fixed constant.",
    why:"Spillover compares live sea temperature against this fitted baseline, not a hardcoded number, to compute the anomaly." },
  olsRegression: { plain:"Statistical trend model", technical:"OLS regression",
    def:"Ordinary least squares regression, a standard statistical method for fitting a straight-line trend through recent data points.",
    why:"Spillover uses this to fit the sea-surface temperature baseline. It is a real statistical model, not the generative-AI Strategist." },
  cape: { plain:"Atmospheric instability", technical:"CAPE",
    def:"Convective Available Potential Energy estimates how much energy is available for rising air and thunderstorm development.",
    why:"Higher instability is one of the atmospheric ingredients Spillover combines with ocean heat to estimate storm-intensification risk." },
  windShear: { plain:"Wind shear", technical:null,
    def:"Change in wind speed or direction with height. It can influence storm organization.",
    why:"Spillover includes wind shear as one of the convective ingredients feeding the storm-intensification domain." },
  humidity: { plain:"Humidity", technical:null,
    def:"Surface moisture in the air, pulled from live atmospheric data where available.",
    why:"Humidity is another convective ingredient Spillover combines with ocean heat and instability for storm risk." },
  aqi: { plain:"Air quality", technical:"AQI",
    def:"The Air Quality Index summarizes how polluted the air is, on a standard scale.",
    why:"Poorer air quality contributes to Spillover's biodiversity and resource-stress domains." },
  pm25: { plain:"Fine particulate matter", technical:"PM2.5",
    def:"Airborne particles smaller than 2.5 micrometers, a standard measure of air pollution and a contributor to the Air Quality Index.",
    why:"PM2.5 is one of the live air-quality signals Spillover pulls in alongside AQI." },
  resourceStress: { plain:"Resource Stress", technical:null,
    def:"One of Spillover's seven risk domains, combining industrial activity, mining, energy demand, forest loss, air quality and AI data-center load into a single pressure score.",
    why:"Resource Stress is where human consumption pressure, distinct from ocean warming, enters the Regional Stress Score." },
  dataCenterLoad: { plain:"AI Data Center Load", technical:null,
    def:"A modeled index of regional data-center electricity and cooling demand, a fast-growing modern driver of resource pressure.",
    why:"Spillover treats AI and data-center growth as a first-class, rising pressure rather than folding it invisibly into generic energy demand." },
  cascadePathway: { plain:"Cascade pathway", technical:null,
    def:"A specific chain of connections, from a regional risk domain through Spillover's dependency graph, showing how stress could reach other systems.",
    why:"Pathways are what make Global Cascade Potential explainable: every number traces back to a real, inspectable chain of edges." },
  materialSystem: { plain:"Materially affected system", technical:null,
    def:"A planetary system node whose modeled impact from the current scenario clears Spillover's calibrated significance threshold, not just a nonzero signal.",
    why:"This distinguishes systems genuinely worth a decision-maker's attention from minor secondary signals." },
  crossRegionSpillover: { plain:"Cross-region spillover", technical:null,
    def:"The possibility that displacement pressure from the selected region reaches another region, based on a small documented dataset of real connections (shared storm basins, migration corridors, shared infrastructure).",
    why:"Spillover only names a destination region when a documented connection exists; otherwise it reports spillover as possible without inventing a destination." },
  sensitivity: { plain:"Model sensitivity", technical:null,
    def:"Sensitivity shows how much the modeled score changes when uncertain assumptions are varied within their tested ranges. It is not a probability forecast or a statistical confidence interval.",

  evidenceBased: { plain:"Evidence-based connection", technical:null,

    why:"This is Spillover's highest-confidence category of cascade connection." },
  modeledProxy: { plain:"Modeled proxy", technical:null,
    def:"A dependency-graph connection representing a widely documented real-world pattern, but scored using Spillover's own modeled strength rather than one specific measured coefficient.",

  scenarioAssumption: { plain:"Scenario assumption", technical:null,
    def:"A dependency-graph connection that is a reasonable modeling assumption, not independently measured or sourced.",
    why:"Spillover's lowest-confidence connection tier, shown so users know exactly which links are asserted versus sourced." },
};
/* Small inline help icon (ⓘ) reusing the existing .tip/.tip-box tooltip pattern,
   sourced from the same GLOSSARY object as the Info -> Glossary page so a definition
   can never drift between a tooltip and the glossary entry for the same term. */
function helpIcon(key){
  const g = GLOSSARY[key];
  if(!g) return "";
  const label = g.technical ? `${g.plain} (${g.technical})` : g.plain;
  return `<span class="tip" tabindex="0">ⓘ<span class="tip-box"><b>${label}</b><br>${g.def}</span></span>`;
}

function earthWatermarkSVG(){
  // Back to the v12 composition (flat ocean sphere, curved lat/long grid, orbiting ring, glowing
  // signal nodes + arcs) which tested well. The only change from v12: continents are now rendered
  // twice -- a dark offset duplicate underneath, then the real aqua landmass on top -- to read as
  // raised/embossed "sticker" continents (like the reference photo) instead of flat silhouettes.
  // Land is still the SAME real low-poly coastline data used by the functional map in Region &
  // Data's hotspotMap() (worldLandPaths()). Note: we only have continent-level outlines, not real
  // country border data, so no per-country lines are drawn -- adding invented borders would misrepresent
  // the geography. Purely decorative: aria-hidden and pointer-events:none.
  const oldCx=120, oldCy=120, oldR=104, oldScale=0.66667, oldTx=-120, oldTy=0;
  const cx=200, cy=200, r=186;
  const k=r/oldR, s=k*oldScale;
  const tx=(k*oldTx + (cx-oldCx*k)).toFixed(2);
  const ty=(k*oldTy + (cy-oldCy*k)).toFixed(2);
  const shTx=(parseFloat(tx)+2.6).toFixed(2);
  const shTy=(parseFloat(ty)+3.4).toFixed(2);
  const sw=(1.4*k).toFixed(2);
  const nodes=[[186,69],[232,88],[196,140],[222,176],[176,206]];
  const dotsSVG = nodes.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#B9F5DF"/>`).join("");
  const arcsSVG = nodes.slice(0,-1).map((p,i)=>{
    const n=nodes[i+1];
    const mx=(p[0]+n[0])/2, my=(p[1]+n[1])/2-16;
    return `<path d="M${p[0]} ${p[1]} Q${mx} ${my} ${n[0]} ${n[1]}" stroke="#B9F5DF" stroke-width="1" fill="none" opacity=".6"/>`;
  }).join("");
  return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"
      style="position:absolute;top:-46px;right:-46px;width:58%;max-width:460px;aspect-ratio:1/1;opacity:.92;pointer-events:none;z-index:0" aria-hidden="true">
    <defs><clipPath id="earthClip"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#08201A" opacity=".72"/>
    <g clip-path="url(#earthClip)">
      <g transform="translate(${shTx},${shTy}) scale(${s.toFixed(4)})" fill="#04140F" opacity=".5" stroke="none">
        ${worldLandPaths()}
      </g>
      <g transform="translate(${tx},${ty}) scale(${s.toFixed(4)})" fill="var(--aqua)" opacity=".72"
         stroke="#0B5B47" stroke-width="${sw}" stroke-linejoin="round">
        ${worldLandPaths()}
      </g>
      ${arcsSVG}
      ${dotsSVG}
    </g>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--aqua)" stroke-width="2" opacity=".55"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.35}" fill="none" stroke="var(--aqua)" stroke-width="1" opacity=".3"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.7}" fill="none" stroke="var(--aqua)" stroke-width="1" opacity=".25"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r*0.35}" ry="${r}" fill="none" stroke="var(--aqua)" stroke-width="1" opacity=".3"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r*0.7}" ry="${r}" fill="none" stroke="var(--aqua)" stroke-width="1" opacity=".25"/>
    <line x1="${cx}" y1="${cy-r}" x2="${cx}" y2="${cy+r}" stroke="var(--aqua)" stroke-width="1" opacity=".25"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${r+50}" ry="${r*0.4}" fill="none" stroke="var(--violet)" stroke-width="1.4" opacity=".32" transform="rotate(-10 ${cx} ${cy})"/>
    <circle cx="${cx-r-38}" cy="${cy+18}" r="4.5" fill="var(--violet)" opacity=".7"/>
  </svg>`;
}

   DASHBOARD. The ten-second read: what is under pressure here,
   what is driving it, how far the model says it travels, and a
   single call to action into the Simulator.
   --------------------------------------------------------- */
function buildDashboard(){
  const el=$("#v-dashboard"); if(!el) return;
  if(ST.loading && !ST.live){
    el.innerHTML = loadingCard("Pulling live ocean & atmosphere signals…");
    return;
  }
  const R = computeRisks(ST.region, ST.live, null);
  const prop = propagatePlanetaryCascade(ST.region, R, null);
  const unc = uncertainty(ST.region, ST.live);
  const bnd = band(R.cascade);
  const regionShort = ST.region.name.split("(")[0].trim();

  const drivers = (R.drivers||[]).slice(0,5);
  const chips = drivers.length
    ? drivers.map(d=>`<div class="chip"><i style="background:${cv(d.c)}"></i>${d.t}</div>`).join("")
    : `<div class="chip"><i style="background:var(--aqua)"></i>No single pressure is dominant right now</div>`;

  const regionsTxt = prop.spilloverStatus==="documented"
    ? `${prop.affectedRegions.length} region${prop.affectedRegions.length===1?"":"s"} · ${prop.affectedRegions.map(r=>r.name.split("(")[0].trim()).join(", ")}`
    : prop.spilloverStatus==="possible"
      ? "Pressure elevated, no documented destination"
      : "None indicated at current levels";
  const pathTxt = prop.strongestPath
    ? `${prop.strongestPath.labels.join(" → ")} (${prop.strongestPath.value}/100)`
    : "None detected at current levels";

  const sortedDomains = [...R.domains].sort((a,b)=>b.v-a.v);
  const meters = sortedDomains.map(meterHTML).join("");

  el.innerHTML = `
    <div class="panel intro-panel">
      ${earthWatermarkSVG()}
      <div style="position:relative;z-index:1">
      <div class="phead"><span class="dot" style="background:${cv(bnd.c)}"></span>
        <h2>${ST.region.name}</h2></div>
      <p style="font-family:'Space Grotesk';font-size:16px;font-weight:600;line-height:1.45;margin:0 0 8px">
        One regional stress can cascade across connected systems.</p>
      <p style="font-size:12.5px;color:#B7D3BF;line-height:1.6;margin:0">
        ${bnd.d} Spillover scores the combined pressure on ${regionShort}, then propagates it through a
        documented dependency graph to estimate how far it travels.</p>
      <div class="preset-lab" style="margin-top:16px">Top drivers right now</div>
      <div class="drivers" style="margin-top:8px">${chips}</div>
      <div class="lvm" style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
        <div class="lvm-row"><span class="lvm-k">Systems materially affected${helpIcon("materialSystem")}</span>
          <span class="lvm-v">${prop.affectedNodes.length} of ${GRAPH_NODES.length}${
            prop.affectedNodes.length?` · ${prop.affectedNodes.slice(0,3).map(n=>n.nm).join(", ")}${prop.affectedNodes.length>3?"…":""}`:""}</span></div>
        <div class="lvm-row"><span class="lvm-k">Regions affected${helpIcon("crossRegionSpillover")}</span>
          <span class="lvm-v">${regionsTxt}</span></div>
        <div class="lvm-row"><span class="lvm-k">Strongest modeled pathway${helpIcon("cascadePathway")}</span>
          <span class="lvm-v">${pathTxt}</span></div>
        <div class="lvm-row"><span class="lvm-k">Model confidence${helpIcon("confidence")}</span>
          <span class="lvm-v">${prop.confidence} (${prop.confidenceScore})</span></div>
        <div class="lvm-row"><span class="lvm-k">Sensitivity${helpIcon("sensitivity")}</span>
          <span class="lvm-v">${unc.confidence} · most sensitive to ${unc.largestUncertaintyDriver.toLowerCase()} (±${unc.largestImpact} pts)</span></div>
      </div>
      <div class="cta-row">
        <button class="btn primary" id="goSim">Run a scenario →</button>
        <button class="btn secondary" id="goInterventions">See interventions →</button>
      </div>
      </div>
    </div>

    ${scoresStripHTML(R, prop)}

    <div class="panel">
      <div class="phead"><span class="dot" style="background:var(--amber)"></span>
        <h2>Regional risk domains</h2></div>
      <p style="font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 12px">
        The seven domains behind the Regional Stress Score, highest first. Each is scored 0–100 from the
        live signals and this region's modeled baseline indices.</p>
      <div class="grid" style="gap:10px">${meters}</div>
    </div>

    ${regionContextHTML()}`;

  const gs=$("#goSim"); if(gs) gs.onclick=()=>setView("sim");
  const gi=$("#goInterventions"); if(gi) gi.onclick=()=>setView("interventions");
}

/* ---- region context: the live/modeled signals this region is scored from ---- */
function regionContextHTML(){
  const live=ST.live, st=live?live.status:{};
  const row=(ic,col,a,b,val,unit)=>`
    <div class="frow">
      <div class="fic" style="background:${cv(col)}1f;color:${cv(col)}">${ic}</div>
      <div class="fnm"><div class="a">${a}</div><div class="b">${b}</div></div>
      <div class="fval" style="color:${cv(col)}">${val}<span class="u"> ${unit}</span></div>
    </div>`;
  const b=ST.region.b;
  const updated = ST.lastRefreshAt ? new Date(ST.lastRefreshAt).toLocaleTimeString() : "–";
  return `
    <div class="panel">
      <div class="phead"><span class="dot" style="background:var(--aqua)"></span>
        <h2>Region context</h2></div>
      <div class="feed">
        ${row("〜","--aqua","Sea temperature","SST · Open-Meteo Marine",live?live.sst:"n/a","°C",st.sst)}
        ${row("Δ","--aqua","Difference from statistical baseline","OLS trend baseline · derived",live?(live.sstAnom>=0?"+":"")+live.sstAnom:"n/a","°C",st.sstTrend)}
        ${row("⌁","--red","Atmospheric instability","CAPE · Open-Meteo Forecast",live?live.cape:"n/a","J/kg",st.atmo)}
        ${row("◍","--amber","Air quality","AQI · Open-Meteo Air Quality",live?live.aqi:"n/a","",st.aqi)}
        ${row("▦","--amber","AI data center load","IEA-calibrated regional index",Math.round(b.dataCtr*100),"/100","mdl")}
        ${row("⚑","--red","Coastal exposure","Regional index",Math.round(b.coastExp*100),"/100","mdl")}
      </div>
      <div class="mit-disc" style="margin-top:12px">Live signals come from key-free Open-Meteo endpoints and fall
        back to this region's modeled baseline when unreachable; every row is labelled with which one is in use.</div>

}

/* ---------------------------------------------------------
   SIMULATOR. All modeling controls in one place. The cascade
   diagram and the spillover map render here, and only after a
   scenario has actually been run, so a diagram is never shown
   for a scenario the user has not asked for.
   --------------------------------------------------------- */
function buildSimulator(){
  const el=$("#v-sim"); if(!el) return;
  const s=ST.simInputs;
  const slider=(id,lab,val,min,max,unit,lo,hi,affects)=>`
    <div class="ctrl">
      <div class="clab"><span class="l">${lab}</span>
        <span class="v" id="val-${id}">${val>0?'+':''}${val}${unit}</span></div>
      <input type="range" id="sim-${id}" min="${min}" max="${max}" value="${val}" step="1">
      <div class="crange"><span>${lo}</span><span>${hi}</span></div>
      <div class="affects">Affects: ${affects}</div>
    </div>`;
  const simResult = ST.sim
    ? simScenarioResultHTML(ST.sim) + renderSimDelta(ST.sim) + renderSimPlanetary(ST.sim)
    : `<div class="empty-sim"><div class="ico">◇</div>
        <p>Adjust the stressors, then press <b style="color:var(--aqua)">Run simulation</b><br>
        to see how the Regional Stress Score and Global Cascade Potential respond.</p></div>`;

  el.innerHTML = `
    <div class="grid cols2">
      <div class="panel">
        <div class="phead"><span class="dot" style="background:var(--aqua)"></span>
          <h2>Counterfactual stressors</h2></div>
        <div class="preset-lab">Preset scenarios</div>
        <div class="presets">
          <button class="preset" data-preset="ai">⚡ AI and Energy Demand Surge</button>
          <button class="preset" data-preset="ocean">〜 Ocean Warming +1°C</button>
          <button class="preset" data-preset="forest">☘ Forest Loss</button>
          <button class="preset" data-preset="coastpop">⌂ Coastal Population Increase</button>
          <button class="preset" data-preset="infra">⚠ Coastal Infrastructure Disruption</button>
        </div>
        ${slider("energy","Energy demand",s.energy,-30,40,"%","−30%","+40%","Resource Stress, AI Data Center Load")}
        ${slider("dataCtr","AI data center load",s.dataCtr,-30,60,"%","−30%","+60%","AI Data Center Load, Resource Stress, and (via the planetary graph) Electricity Grid and Digital Infrastructure pressure")}
        ${slider("forest","Forest cover loss",s.forest,0,40,"%","0%","+40%","Food & Water, Resource Stress")}
        ${slider("sst","Sea-surface temp",s.sst,0,3,"°C","0°C","+3°C","Ocean Heat, Storm Intensification, Biodiversity, Food & Water")}
        ${slider("coastPop","Coastal population",s.coastPop,0,30,"%","0%","+30%","Human Displacement")}
        ${slider("gridResilience","Grid & port resilience",s.gridResilience,-30,30,"pts","−30","+30","Human Displacement (negative = disruption, positive = hardening)")}
        ${slider("coastalBuffer","Coastal buffer",s.coastalBuffer,-30,30,"pts","−30","+30","Human Displacement, Biodiversity, Food & Water")}
        <div class="runbar">
          <button class="btn primary" id="runSim">Run simulation</button>
          <button class="btn ghost" id="resetSim" title="Reset">↺</button>
        </div>
      </div>
      <div class="panel">
        <div class="phead"><span class="dot" style="background:var(--red)"></span>
          <h2>Projected change</h2></div>
        <div id="simOut">${simResult}</div>
      </div>
    </div>`;

  ["energy","dataCtr","forest","sst","coastPop","gridResilience","coastalBuffer"].forEach(id=>{
    const inp=$(`#sim-${id}`); if(!inp) return;
    inp.oninput=()=>{
      const u=(id==="sst")?"°C":(id==="gridResilience"||id==="coastalBuffer")?"pts":"%";
      const v=+inp.value;
      $(`#val-${id}`).textContent=(v>0?'+':'')+v+u; ST.simInputs[id]=v;
      if(ST.sim){
        ST.sim=null;
        $("#simOut").innerHTML=`<div class="empty-sim"><div class="ico">◇</div><p>Inputs changed, press
          <b style="color:var(--aqua)">Run simulation</b> to recompute.</p></div>`;
        const t=$('#v-sim .phead .tag'); if(t) t.remove();
      }
    };
  });

  const run = ()=>{
    const base=computeRisks(ST.region,ST.live,null);
    const after=computeRisks(ST.region,ST.live,{...ST.simInputs});
    ST.sim={base,after};
    buildSimulator();
  };
  $("#runSim").onclick=()=>{ run(); toast("Simulation complete"); };
  $("#resetSim").onclick=()=>{
    ST.simInputs={energy:0,forest:0,sst:0,dataCtr:0,coastPop:0,gridResilience:0,coastalBuffer:0};
    ST.sim=null; buildSimulator();
  };
  const PRESETS={
    ai:      {energy:25, dataCtr:55, forest:0,  sst:0, coastPop:0, gridResilience:0, coastalBuffer:0},
    ocean:   {energy:0,  dataCtr:0,  forest:0,  sst:1, coastPop:0, gridResilience:0, coastalBuffer:0},
    forest:  {energy:0,  dataCtr:0,  forest:30, sst:0, coastPop:0, gridResilience:0, coastalBuffer:0},
    coastpop:{energy:0,  dataCtr:0,  forest:0,  sst:0, coastPop:22,gridResilience:0, coastalBuffer:0},
    infra:   {energy:0,  dataCtr:0,  forest:0,  sst:0, coastPop:0, gridResilience:-20,coastalBuffer:-14},
  };
  const PRESET_NAME={ai:"AI and Energy Demand Surge",ocean:"Ocean Warming +1°C",forest:"Forest Loss",
    coastpop:"Coastal Population Increase", infra:"Coastal Infrastructure Disruption"};
  document.querySelectorAll("#v-sim .preset").forEach(btn=>btn.onclick=()=>{
    ST.simInputs={...PRESETS[btn.dataset.preset]};
    run();
    toast(PRESET_NAME[btn.dataset.preset]+" applied");
  });
}

/* The counterfactual the app is currently reasoning about: the Simulator scenario when one
   has been run, otherwise the untouched baseline. Interventions and the strategy builder both
   read it, so their numbers always describe the same world. */
function currentScenarioSim(){ return ST.sim ? { ...ST.simInputs } : null; }

/* ---------------------------------------------------------
   INTERVENTIONS. Filterable, ranked action list, then a strategy
   builder driven by whatever the user has ticked. Selecting
   actions constrains which verified candidate portfolios the
   optimizer is allowed to return; it never changes how those
   portfolios are scored.
   --------------------------------------------------------- */
function buildInterventions(){
  const el=$("#v-interventions"); if(!el) return;
  const m=mitigations(ST.region, ST.live, currentScenarioSim());
  const IMPACT_COL = {High:"var(--green)", Medium:"var(--amber)", Low:"var(--muted)"};
  const EFFORT_COL = {Low:"var(--green)", Medium:"var(--amber)", High:"var(--red)"};
  const allSystems = [...new Set(m.list.flatMap(a=>a.domains))].sort();

  let filtered = m.list.filter(a=>{
    const q = ST.mitSearch.trim().toLowerCase();
    const matchesSearch = !q || a.nm.toLowerCase().includes(q) || a.why.toLowerCase().includes(q);
    const matchesSystem = ST.mitSystemFilter==="all" || a.domains.includes(ST.mitSystemFilter);
    return matchesSearch && matchesSystem;
  });
  if(ST.mitSort==="effort"){
    const order={Low:0,Medium:1,High:2};
    filtered = filtered.slice().sort((x,y)=>(order[x.cost]??1)-(order[y.cost]??1));
  } // default order from mitigations() is already impact (red) descending

  const cards=filtered.map((a)=>{
    const i = m.list.indexOf(a);
    const bucket = mitImpactBucket(a, m.list);
    const checked = ST.mitSelected.includes(a.key);
    const meta=[
      ["Regional effect", `${a.why} (domains: ${a.domains.join(", ")})`],
      ["Planetary effect", a.planetaryNarrative],
      ["Regional Stress Score reduction", `${a.red>0?'−'+a.red:'~0'} points (${a.baseR} → ${a.afterR})`],
      ["Global Cascade Potential reduction", `${a.gcpRed>0?'−'+a.gcpRed:'~0'} points (${a.baseGcp} → ${a.afterGcp})`],
      ["Planetary pathways interrupted", a.pathwaysInterruptedList.length ? a.pathwaysInterruptedList.join("; ") : "none crossed the reporting threshold"],
      ["Cost category", a.cost],
      ["Implementation time", a.time],
      ["Regional relevance", a.relevanceTxt],
      ["Planetary relevance", a.planetaryRelevanceTxt],
      ["Confidence", a.conf],
      ["Evidence basis", "Regional reduction: full regional model rerun. Planetary reduction: full propagatePlanetaryCascade() rerun on the merged counterfactual, not summed from individual pathway effects."],
      ["Methodology", a.method],
      ["Limitations", a.limits],
    ].map(([k,v])=>`<div class="mit-meta-row"><span class="mm-k">${k}</span><span class="mm-v">${v}</span></div>`).join("");
    return `
    <div class="mit" data-idx="${i}">
      <div style="display:flex;gap:10px;padding:14px 14px 0 14px;align-items:flex-start">
        <input type="checkbox" class="mit-check" data-check="${a.key}" ${checked?"checked":""} aria-label="Select ${a.nm} for the strategy builder">
        <button class="mit-head" data-toggle="${i}" style="padding:0 0 14px;flex:1;align-items:flex-start">
          <div class="rank">${i+1}</div>
          <div class="mbody">
            <h4>${a.nm}</h4>
            <p>${a.why}</p>
            <div class="mit-chips">${a.domains.map(d=>`<span class="mit-chip">${d}</span>`).join("")}</div>
            <div class="mit-badges">
              <span class="mit-badge" style="color:${IMPACT_COL[bucket]};border-color:${IMPACT_COL[bucket]}">Impact: ${bucket} (−${a.red} pts)</span>
              <span class="mit-badge" style="color:${EFFORT_COL[a.cost]||'var(--muted)'};border-color:${EFFORT_COL[a.cost]||'var(--muted)'}">Effort: ${a.cost}</span>
              <span class="mit-badge" style="color:var(--violet);border-color:var(--violet)">Evidence: ${a.conf}</span>
            </div>
          </div>
          <div class="red"><div class="rv">${a.red>0?'−'+a.red:'~0'}</div><div class="rl">pts regional</div></div>
          <div class="mit-caret" id="mcaret-${i}">▾</div>
        </button>
      </div>
      <div class="mit-detail" id="mdetail-${i}">
        <div class="mit-meta">${meta}</div>
      </div>
    </div>`;
  }).join("") || `<div class="mit-disc">No interventions match this search/filter.</div>`;

  el.innerHTML=`
    <div class="panel">
      <div class="phead"><span class="dot" style="background:var(--green)"></span>
        <h2>Interventions${helpIcon("intervention")}</h2></div>
      <p style="font-size:12.5px;color:#B7D3BF;line-height:1.55;margin:0 0 8px">
        Each intervention changes one or more documented model variables, then BOTH the regional model and
        the planetary propagation model are rerun. Ranked by modeled Regional Stress Score reduction.
        Tap any intervention to see its full regional and planetary effects.</p>
      <div class="mit-disc">All reductions are <b>modeled estimates</b> from rerunning the deterministic models, not guarantees.</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin:12px 0">
        <input type="text" id="mitSearch" placeholder="Search interventions…" value="${ST.mitSearch.replace(/"/g,'&quot;')}"
          style="flex:1 1 200px;min-width:160px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
            color:var(--txt);font-size:12px;padding:8px 10px">
        <select id="mitSystemFilter" style="flex:0 1 200px;background:var(--panel2);border:1px solid var(--line);
            border-radius:8px;color:var(--txt);font-size:12px;padding:8px 10px">
          <option value="all" ${ST.mitSystemFilter==="all"?"selected":""}>All systems</option>
          ${allSystems.map(sys=>`<option value="${sys}" ${ST.mitSystemFilter===sys?"selected":""}>${sys}</option>`).join("")}
        </select>
        <select id="mitSort" style="flex:0 1 200px;background:var(--panel2);border:1px solid var(--line);
            border-radius:8px;color:var(--txt);font-size:12px;padding:8px 10px">
          <option value="impact" ${ST.mitSort!=="effort"?"selected":""}>Impact (High to Low)</option>
          <option value="effort" ${ST.mitSort==="effort"?"selected":""}>Effort (Low to High)</option>
        </select>
      </div>
      ${cards}
      <div class="strat-inline">
        <button class="btn primary" id="btnBuildStrategy" style="background:var(--violet);color:#0E1230;width:100%">
          ${ST.strategist.showBuilder?"Hide strategy builder":"Build strategy"}</button>
        <div id="stratCount" style="font-size:10.5px;color:var(--muted);text-align:center;margin-top:6px">
          ${strategySelectionNote()}</div>
        <div id="stratPanel" style="display:${ST.strategist.showBuilder?"block":"none"};margin-top:14px">
          ${strategyBuilderHTML()}
        </div>
      </div>
    </div>`;

  document.querySelectorAll("#v-interventions .mit-head").forEach(btn=>btn.onclick=()=>{
    const i=btn.dataset.toggle;
    const d=$("#mdetail-"+i), c=$("#mcaret-"+i);
    const open=d.classList.contains("open");
    d.classList.toggle("open"); if(c) c.textContent=open?"▾":"▴";
  });
  document.querySelectorAll("#v-interventions .mit-check").forEach(cb=>cb.onclick=(e)=>{
    e.stopPropagation();
    const key=cb.dataset.check;
    const idx=ST.mitSelected.indexOf(key);
    if(cb.checked && idx===-1) ST.mitSelected.push(key);
    if(!cb.checked && idx!==-1) ST.mitSelected.splice(idx,1);
    const countEl=$("#stratCount"); if(countEl) countEl.innerHTML = strategySelectionNote();
  });
  const ms=$("#mitSearch"); if(ms) ms.oninput=()=>{ ST.mitSearch=ms.value; buildInterventions(); };
  const mf=$("#mitSystemFilter"); if(mf) mf.onchange=()=>{ ST.mitSystemFilter=mf.value; buildInterventions(); };
  const msort=$("#mitSort"); if(msort) msort.onchange=()=>{ ST.mitSort=msort.value; buildInterventions(); };
  const bs=$("#btnBuildStrategy"); if(bs) bs.onclick=()=>{
    ST.strategist.showBuilder=!ST.strategist.showBuilder;
    buildInterventions();
    if(ST.strategist.showBuilder){ const p=$("#stratPanel"); if(p) p.scrollIntoView({behavior:"smooth", block:"nearest"}); }
  };
  wireStrategyForm();
}

/* ---- which ticked interventions the optimizer will be constrained to ---- */
function selectedInterventionKeys(){
  const acts = mitigationActions();
  return ST.mitSelected.filter(k=>acts.some(a=>a.key===k));
}

function strategySelectionNote(){
  const n = ST.mitSelected.length;
  if(!n) return "No interventions ticked · the optimizer will consider every feasible 3-action portfolio";
  if(n<=3) return `${n} intervention${n===1?"":"s"} ticked · every portfolio considered will include ${n===1?"it":"them"}`;
  return `${n} interventions ticked · portfolios will be drawn only from this set`;
}

function strategyBuilderHTML(){
  const s=ST.strategist;
  const opt=(arr,cur)=>arr.map(v=>`<option value="${v}" ${v===cur?'selected':''}>${v}</option>`).join("");
  return `
    <div class="strat-form">
      <div class="strat-field"><label>Budget</label>
        <select id="stratBudget">${opt(Object.keys(BUDGET_CAP), s.budget)}</select></div>
      <div class="strat-field"><label>Primary objective</label>
        <select id="stratObjective">${opt(Object.keys(OBJECTIVE_TAG), s.objective)}</select></div>
      <div class="strat-field"><label>Implementation horizon</label>
        <select id="stratHorizon">${opt(Object.keys(HORIZON_FIT), s.horizon)}</select></div>
    </div>
    <div class="strat-actions">
      <button class="btn primary" id="stratGen" ${s.loading?"disabled":""}>${
        s.loading?'<span class="spin"></span> Generating…':'Generate strategy'}</button>
    </div>
    <div id="stratResultBody">${strategistResultHTML()}</div>`;
}

function wireStrategyForm(){
  const s=ST.strategist;
  const bind=(id,key)=>{ const el=$(id); if(el) el.onchange=()=>{ s[key]=el.value; }; };
  bind("#stratBudget","budget"); bind("#stratObjective","objective"); bind("#stratHorizon","horizon");
  const gen=$("#stratGen"); if(gen) gen.onclick=()=>runStrategistGenerate(true);
  const dt=$("#stratDetailToggle"); if(dt) dt.onclick=()=>{
    ST.strategist.showDetail=!ST.strategist.showDetail;
    renderStrategyPanel();
  };
}

/* Re-render only the strategy builder, so generating a strategy never
   rebuilds (and collapses) the intervention list underneath it. */
function renderStrategyPanel(){
  const p=$("#stratPanel"); if(!p) return;
  p.innerHTML = strategyBuilderHTML();
  wireStrategyForm();
}

/* ---------------------------------------------------------
   INFO MODAL. The two header icons; the old footer expanders
   and the Info tab before them.
   --------------------------------------------------------- */
const MODAL_CONTENT = {
  how: { title:"How Spillover works", body:`
    <div style="font-size:12.5px;color:#B7D3BF;line-height:1.65">
      <p style="margin:0 0 10px">Spillover scores a coastal region on seven risk domains (ocean heat, storm
      intensification, biodiversity, food and water, displacement, resource stress and AI data-center load).
      Live sea-surface temperature, atmospheric and air-quality signals come from key-free Open-Meteo endpoints;
      the sea-temperature baseline is fitted with an ordinary-least-squares regression over roughly 60 days of
      recent history rather than a fixed constant. The weighted combination of those domains, plus an escalation
      term for simultaneously high domains, is the <b>Regional Stress Score</b>.</p>
      <p style="margin:0 0 10px">That regional pressure is then propagated through a documented dependency graph
      of eight planetary systems. Each connection carries a strength, an evidence type and a named source, and
      cross-region spillover only fires along explicitly documented region-to-region connections. The result is the
      <b>Global Cascade Potential</b>: how far, and into how many connected systems, the model expects the pressure
      to travel.</p>
      <p style="margin:0">Interventions are evaluated by rerunning both models on the changed variables, never by
      subtracting points afterwards. The strategy builder ranks every feasible three-action portfolio
      deterministically; the AI Cascade Strategist may only select one of those pre-verified portfolios, order it
      and explain it, and its response is validated server-side before it is shown. If the AI is unavailable or its
      response fails validation, the same selection is made by transparent rules with no generative model involved.</p>
    </div>` },
  sources: { title:"Data sources", body:`
    <div class="src-list">${SOURCES.map(s=>`
      <a class="src-row" href="${s.url}" target="_blank" rel="noopener">
        <div class="src-nm">${s.nm}</div>
        <div class="src-d">${s.d}${s.usedFor?`<div style="color:var(--muted);font-size:10.5px;margin-top:3px">Used for: ${s.usedFor}</div>`:""}</div>
        <div class="src-ar">\u2197</div>
      </a>`).join("")}</div>` },
};
function openModal(kind){
  const c = MODAL_CONTENT[kind]; if(!c) return;
  $("#modalTitle").textContent = c.title;
  $("#modalBody").innerHTML = c.body;
  $("#modal").classList.add("on");
}
function closeModal(){ $("#modal").classList.remove("on"); }
$("#btnHow").onclick=()=>openModal("how");
$("#btnSources").onclick=()=>openModal("sources");
$("#modalX").onclick=closeModal;
$("#modal").onclick=(e)=>{ if(e.target.id==="modal") closeModal(); };
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });

/* =========================================================
   NAVIGATION AND SESSION
   ========================================================= */
function setView(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  $("#main").scrollTop=0;
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.v));

function fillRegions(){
  $("#regionSel").innerHTML=REGIONS.map(r=>`<option value="${r.id}">${r.name}</option>`).join("");
  $("#regionSel").value=ST.region.id;
  updateRegionLabel();
  $("#regionSel").onchange=async e=>{
    ST.region=REGIONS.find(r=>r.id===e.target.value);
    ST.sim=null; ST.simInputs={energy:0,forest:0,sst:0,dataCtr:0,coastPop:0,gridResilience:0,coastalBuffer:0};
    ST.mitSelected=[];
    ST.strategist.result=null; ST.strategist.source=null; ST.strategist.notice=null; ST.strategist.verified=null;
    updateRegionLabel();
    await refresh();
  };
}

async function refresh(){
  ST.loading=true;
  $("#v-dashboard").innerHTML=loadingCard("Pulling live ocean & atmosphere signals…");
  try{ ST.live=await loadLive(ST.region); }
  catch(e){ ST.live=null; }
  ST.lastRefreshAt = Date.now();
  ST.loading=false;
  renderAll();
  const fails = ST.live ? Object.values(ST.live.status).filter(s=>s==="mdl").length : 99;
  if(!ST.live) toast("Live feeds unreachable, showing modeled baseline");
  else if(fails>0) toast(`Loaded · ${fails} signal group(s) on modeled fallback`);
  else toast("Live data loaded");
}

/* re-render on breakpoint cross / orientation change (cascade & column layouts) */
let _rt, _lastNarrow = window.innerWidth<=560;
window.addEventListener("resize", ()=>{
  clearTimeout(_rt);
  _rt=setTimeout(()=>{
    const nowNarrow = window.innerWidth<=560;
    if(nowNarrow!==_lastNarrow){ _lastNarrow=nowNarrow; if(ST.live!==undefined) renderAll(); }
  }, 180);
});

fillRegions();
buildFooter();
refresh();

</script>
</body>
