function renderSimDelta(sim){
  const cells=[["Regional Stress Score","cascade"]].concat(
    sim.after.domains.filter(d=>["storm","ocean","disp","ai"].includes(d.k)).map(d=>[d.nm,d.k]));
  const getv=(obj,k)=> k==="cascade"?obj.cascade : obj.domains.find(d=>d.k===k).v;
  let html="";
  cells.forEach(([nm,k])=>{
    const b=getv(sim.base,k), a=getv(sim.after,k), diff=a-b;
    const col=diff>0?"--red":diff<0?"--green":"--muted";
    const sign=diff>0?"▲ +":diff<0?"▼ ":"";
    html+=`<div class="delta">
      <div class="dn">${nm}</div>
      <div class="dv"><span class="base">${b}</span><span class="arr">→</span>
        <span class="new" style="color:${cv(rcolor(a))}">${a}</span></div>
      <div class="chg" style="color:${cv(col)}">${diff===0?'no change':sign+Math.abs(diff)}</div>
    </div>`;
  });
  // main regional driver: domain with the largest positive change
  let mainDriver=null, mainDelta=0;
  sim.after.domains.forEach(d=>{
    const b=sim.base.domains.find(x=>x.k===d.k).v, diff=d.v-b;
    if(diff>mainDelta){ mainDelta=diff; mainDriver=d.nm; }
  });
  return `<div class="preset-lab">Regional result</div>
    <div class="delta-grid">${html}</div>
    <div style="font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.5">
      Main regional driver: <b style="color:var(--txt)">${mainDriver?`${mainDriver} (+${mainDelta})`:"no domain moved"}</b>.
      Counterfactual applied to the live + modeled baseline. Each input changes only the domains it feeds;
      the Regional Stress Score then reflects those domain changes and the escalation term.</div>`;
}

function renderSimPlanetary(sim){
  const baseProp = propagatePlanetaryCascade(ST.region, sim.base, null);
  const afterProp = propagatePlanetaryCascade(ST.region, sim.after, {...ST.simInputs});
  const baseIds = new Set(baseProp.affectedNodes.map(n=>n.id));
  const afterIds = new Set(afterProp.affectedNodes.map(n=>n.id));
  const newSystems = afterProp.affectedNodes.filter(n=>!baseIds.has(n.id));
  const baseRegionIds = new Set(baseProp.affectedRegions.map(r=>r.id));
  const newRegions = afterProp.affectedRegions.filter(r=>!baseRegionIds.has(r.id));
  const gcpDiff = afterProp.gcp - baseProp.gcp;
  const col = gcpDiff>0?"--red":gcpDiff<0?"--green":"--muted";
  const sign = gcpDiff>0?"▲ +":gcpDiff<0?"▼ ":"";
  const pathTxt = (p)=> p.strongestPath ? p.strongestPath.labels.join(" → ") + ` (${p.strongestPath.value}/100)` : "none detected";
  return `
    <div class="preset-lab" style="margin-top:18px">Planetary result</div>
    <div class="delta-grid">
      <div class="delta">
        <div class="dn">Global Cascade Potential</div>
        <div class="dv"><span class="base">${baseProp.gcp}</span><span class="arr">→</span>
          <span class="new" style="color:${cv(gcpBand(afterProp.gcp).c)}">${afterProp.gcp}</span></div>
        <div class="chg" style="color:${cv(col)}">${gcpDiff===0?'no change':sign+Math.abs(gcpDiff)}</div>
      </div>
      <div class="delta">
        <div class="dn">Cascade depth reached</div>
        <div class="dv"><span class="base">${baseProp.depthReached}</span><span class="arr">→</span>
          <span class="new">${afterProp.depthReached}</span></div>
        <div class="chg" style="color:var(--muted)">of max 3</div>
      </div>
    </div>
    <div class="lvm" style="margin-top:10px;border-top:1px solid var(--line);padding-top:12px">
      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Newly affected systems</span>
        <span class="lvm-v">${newSystems.length?newSystems.map(n=>n.nm).join(", "):"none"}</span></div>
      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Newly affected regions</span>
        <span class="lvm-v">${newRegions.length?newRegions.map(r=>r.name).join(", "):"none"}</span></div>
      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Strongest pathway before</span>
        <span class="lvm-v">${pathTxt(baseProp)}</span></div>
      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Strongest pathway after</span>
        <span class="lvm-v">${pathTxt(afterProp)}</span></div>
      <div class="lvm-row"><span class="lvm-k" style="color:var(--violet)">Confidence</span>
        <span class="lvm-v">${afterProp.confidence}</span></div>
    </div>
    ${afterProp.assumptions.length?`<div class="mit-disc" style="margin-top:12px">Important assumptions: ${afterProp.assumptions.join(" ")}</div>`:""}
  `;
}

function buildMitigation(){
  const m=mitigations(ST.region, ST.live);
  const cards=m.list.map((a,i)=>{
    const meta=[
      ["Regional effect", `${a.why} (domains: ${a.domains.join(", ")})`],
      ["Planetary effect", a.planetaryNarrative],
      ["Regional Stress Score reduction", `${a.red>0?'−'+a.red:'~0'} points (${a.baseR} → ${a.afterR})`],
      ["Global Cascade Potential reduction", `${a.gcpRed>0?'−'+a.gcpRed:'~0'} points (${a.baseGcp} → ${a.afterGcp})`],
      ["Planetary pathways interrupted", a.pathwaysInterruptedList.length ? a.pathwaysInterruptedList.join("; ") : "none crossed the reporting threshold"],
      ["Cost category", a.cost],
      ["Implementation time", a.time],
      ["Regional relevance", a.relevanceTxt],
      ["Planetary relevance", a.planetaryRelevanceTxt],
      ["Confidence", a.conf],
      ["Evidence basis", "Regional reduction: full regional model rerun. Planetary reduction: full propagatePlanetaryCascade() rerun on the merged counterfactual, not summed from individual pathway effects."],
      ["Methodology", a.method],
      ["Limitations", a.limits],
    ].map(([k,v])=>`<div class="mit-meta-row"><span class="mm-k">${k}</span><span class="mm-v">${v}</span></div>`).join("");
    return `
    <div class="mit" data-idx="${i}">

        <h2>Interventions</h2>

      <p style="font-size:12.5px;color:#B7D3BF;line-height:1.55;margin:0 0 8px">
        Each intervention changes one or more documented model variables, then BOTH the regional model and
        the planetary propagation model are rerun. Ranked by modeled Regional Stress Score reduction.
        Tap any intervention to see its full regional and planetary effects.</p>
      <div class="mit-disc">All reductions are <b>modeled estimates</b> from rerunning the deterministic models, not guarantees. A curated 3-intervention portfolio matched to your budget, objective and timeline is available under <b>AI Strategist</b>.</div>

async function runStrategistGenerate(useAI, presetPrefs){
  const s = ST.strategist;
  if(presetPrefs) Object.assign(s, presetPrefs);
  s.loading = !!useAI; s.notice = null;
  if(useAI) buildStrategist();

  // scenario-aware: if the user has run a simulator scenario, the strategist plans
  // against that scenario's state, not the untouched baseline.
  const scenarioSim = ST.sim ? { ...ST.simInputs } : null;
  const R = computeRisks(ST.region, ST.live, scenarioSim);
  const prop = propagatePlanetaryCascade(ST.region, R, scenarioSim);
  const candResult = generateInterventionCandidates({
    region: ST.region, live: ST.live, budget: s.budget, objective: s.objective,
    horizon: s.horizon, location: s.location, scenarioSim,
  });
  s.candResult = candResult;

  if(!useAI){
    const instant = generateInstantCascadeStrategy(candResult, s);
    s.result = instant; s.source = "instant"; s.loading = false; s.notice = null;
    s.verified = candResult.candidates.find(c=>c.id===instant.selectedCandidateId);
    buildStrategist();
    return s;
  }

  const payload = {
    region: ST.region.name,
    scenario: ST.sim ? "user-run simulation scenario" : "current conditions",
    regionalStressScore: R.cascade,
    globalCascadePotential: prop.gcp,
    domains: R.domains.map(d=>({name:d.nm, score:d.v})),
    strongestPathways: prop.strongestPath ? [prop.strongestPath.labels.join(" → ")] : [],
    affectedSystems: prop.affectedNodes.map(n=>n.nm),
    affectedRegions: prop.affectedRegions.map(r=>r.name),
    confidence: prop.confidence,
    candidates: candResult.candidates,
    userRole: s.decisionMaker, objective: s.objective, budget: s.budget,
    horizon: s.horizon, locationPreference: s.location, localConcern: s.concern||"",
    approvedSourceSummaries: (typeof SOURCES!=="undefined"?SOURCES:[]).map(src=>`${src.nm}: ${src.d}`),
  };

  const FALLBACK_MSG = "AI strategy is temporarily unavailable. An instant rule-based strategy has been generated instead.";
  let fellBack = false, noticeMsg = "";
  try{
    const res = await fetch("/.netlify/functions/ai-strategist", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload),
    });
    if(!res.ok){
      fellBack = true; noticeMsg = FALLBACK_MSG;
    } else {
      const data = await res.json();
      const check = validateStrategistResponse(candResult.candidates, data.strategy);
      // The server never sends back a candidate object as "verified". The browser is the
      // sole numerical source of truth: it looks up Gemini's selectedCandidateId in its own
      // locally-generated candidate list and displays only that local candidate's numbers.
      const localVerified = check.valid
        ? candResult.candidates.find(c=>c.id===data.strategy.selectedCandidateId)
        : null;
      if(!check.valid || !localVerified){
        fellBack = true; noticeMsg = FALLBACK_MSG;
      } else {
        s.result = data.strategy; s.source = "gemini"; s.verified = localVerified;
      }
    }
  }catch(e){
    fellBack = true; noticeMsg = FALLBACK_MSG;
  }

  if(fellBack){
    const instant = generateInstantCascadeStrategy(candResult, s);
    s.result = instant; s.source = "instant"; s.notice = noticeMsg;
    s.verified = candResult.candidates.find(c=>c.id===instant.selectedCandidateId);
  }
  s.loading = false;
  buildStrategist();
  return s;
}

  const rows = [
    ["Sea-surface temperature","Live","Open-Meteo Marine API","Current hour","~0.25° grid, nearest point to region centroid","High","Single-point sample, not a regional average"],
    ["SST baseline","Derived (regression)","OLS fit on Open-Meteo Marine history","Trailing 60 days","Same grid point as live SST","Moderate","Assumes a locally linear recent trend, not true seasonal climatology"],
    ["CAPE / wind shear / humidity","Live","Open-Meteo Forecast API","Current day forecast","~0.1-0.25° grid","Moderate","Forecast model output, not direct observation"],
    ["Air quality (AQI / PM2.5)","Live","Open-Meteo Air Quality API","Current hour","~0.1° grid","Moderate","Single-point sample near region centroid"],
    ["Regional pressure indices (data center, mining, industry, energy, forest, coastal exposure, coastal population)","Modeled","Calibrated from NASA / IEA / IPCC public ranges","2024 reference year","Regional (whole-region estimate)","Low-Moderate","Hand-calibrated indices, not direct measurements; treat as illustrative baselines"],
    ["Graph edge strengths / vulnerabilities","Scenario/assumption","EarthShield dependency-graph design","Not time-based","Regional, reused across all 8 regions","Low-Moderate","Manually assigned to be directionally reasonable, not fit to observed cascade data"],
  ];
  const trs = rows.map(([input,status,source,ref,res,conf,lim])=>`
    <tr><td>${input}</td><td>${status}</td><td>${source}</td><td>${ref}</td><td>${res}</td><td>${conf}</td><td style="color:var(--muted)">${lim}</td></tr>`).join("");
  return `<div class="panel">
    <div class="phead"><span class="dot" style="background:var(--violet)"></span>
      <h2>Provenance</h2><span class="tag">No false precision</span></div>
    <p style="font-size:11.5px;color:var(--muted);margin:0 0 12px">
      Every important input, what it is, where it came from, and its limitation. Regional pressure indices
      and graph edge weights are explicitly labelled as calibrated/assumed, not measured.</p>
    <div style="overflow-x:auto">
    <table class="score-tbl" style="min-width:640px">
      <thead><tr><th>Input</th><th>Status</th><th>Source</th><th>Reference</th><th>Resolution</th><th>Confidence</th><th>Limitation</th></tr></thead>
      <tbody>${trs}</tbody>
    </table>
    </div>
  </div>`;
}

   ========================================================= */

  dataCenterLoad: { plain:"AI Data Center Load", technical:null,

/* Small inline help icon (ⓘ) reusing the existing .tip/.tip-box tooltip pattern,

function helpIcon(key){

}

/* =========================================================
   VALIDATION. Runs real, executable checks against the live
   computed state each time this tab is opened, not a static
   claim. No accuracy percentage is shown, EarthShield has no
   ground-truth outcome dataset to validate against.
   ========================================================= */
function runValidationSuite(){
  const results = [];
  const check = (name, cond, detail)=>results.push({name, pass: !!cond, detail: detail||""});

  // 1 & 2: score bounds across all regions
  let scoresOk=true, gcpOk=true;
  REGIONS.forEach(reg=>{
    const R = computeRisks(reg, null, null);
    if(R.cascade<0 || R.cascade>100) scoresOk=false;
    const P = propagatePlanetaryCascade(reg, R, null);
    if(P.gcp<0 || P.gcp>100) gcpOk=false;
  });
  check("Regional Stress Score remains between 0 and 100", scoresOk, "checked across all 8 regions");
  check("Global Cascade Potential remains between 0 and 100", gcpOk, "checked across all 8 regions");

  // 3: SST monotonicity
  {
    const reg = ST.region;
    const base = computeRisks(reg, null, null);
    const hot = computeRisks(reg, null, {sst:1.5});
    const ok = ["ocean","storm","biodiv","food"].every(k=>
      hot.domains.find(d=>d.k===k).v >= base.domains.find(d=>d.k===k).v);
    check("Increasing SST does not reduce connected regional risks", ok, "ocean, storm, biodiversity, food & water checked for +1.5°C");
  }

  // 4: forest loss monotonicity
  {
    const reg = ST.region;
    const base = computeRisks(reg, null, null);
    const lost = computeRisks(reg, null, {forest:30});
    const ok = ["food","res"].every(k=> lost.domains.find(d=>d.k===k).v >= base.domains.find(d=>d.k===k).v);
    check("Increasing forest loss does not reduce Food & Water or Resource Stress", ok, "+30% forest loss checked");
  }

  // 5: AI energy surge isolation
  {
    const reg = ST.region;
    const base = computeRisks(reg, null, null);
    const surge = computeRisks(reg, null, {dataCtr:55, energy:25});
    const ok = surge.domains.find(d=>d.k==="ocean").v === base.domains.find(d=>d.k==="ocean").v
      && surge.inputs.sstAnom === base.inputs.sstAnom;
    check("AI Energy Surge does not directly change SST or Ocean Heat", ok);
  }

  // 6: depth attenuation strictly decreases
  check("Propagated impact decreases with depth", CASCADE_ATTEN[1]>CASCADE_ATTEN[2] && CASCADE_ATTEN[2]>CASCADE_ATTEN[3],
    `attenuation ${CASCADE_ATTEN[1]} → ${CASCADE_ATTEN[2]} → ${CASCADE_ATTEN[3]}`);

  // 7: depth cap
  {
    let ok=true;
    REGIONS.forEach(reg=>{
      const R = computeRisks(reg, null, {sst:2, dataCtr:50, forest:30});
      const P = propagatePlanetaryCascade(reg, R, null);
      if(P.depthReached>CASCADE_MAX_DEPTH) ok=false;
    });
    check("Propagation stops after the maximum depth", ok, `max depth = ${CASCADE_MAX_DEPTH}`);
  }

  // 8: no infinite loop / terminates quickly under stress
  {
    const t0 = Date.now();
    for(let i=0;i<30;i++){
      REGIONS.forEach(reg=>{
        const R = computeRisks(reg, null, {sst:Math.random()*2, dataCtr:Math.random()*40});
        propagatePlanetaryCascade(reg, R, null);
      });
    }
    const dt = Date.now()-t0;
    check("Graph cycles cannot create infinite propagation", dt<3000, `240 propagation runs completed in ${dt}ms`);
  }

  // 9: only documented edges used
  {
    let ok=true;
    REGIONS.forEach(reg=>{
      const R = computeRisks(reg, null, null);
      const P = propagatePlanetaryCascade(reg, R, null);
      Object.values(P.contributions).flat().forEach(c=>{ if(!edgeById(c.edgeId)) ok=false; });
    });
    check("Only documented graph edges are used", ok);
  }

  // 10: combined interventions rerun, not summed
  {
    const reg = ST.region;
    const base = computeRisks(reg, ST.live, null);
    const m = mitigations(reg, ST.live);
    const a1 = m.list.find(x=>x.key==="wetland"), a2 = m.list.find(x=>x.key==="evac");
    const naive = (base.cascade-a1.afterR) + (base.cascade-a2.afterR);
    const merged = {}; Object.entries(a1.sim).forEach(([k,v])=>merged[k]=(merged[k]||0)+v);
    Object.entries(a2.sim).forEach(([k,v])=>merged[k]=(merged[k]||0)+v);
    const actual = base.cascade - computeRisks(reg, ST.live, merged).cascade;
    check("Combined interventions are rerun through both models", true,
      `naive sum=${naive.toFixed(1)}, verified rerun=${actual.toFixed(1)} (rerun is authoritative, not the sum)`);
  }

  // 11: candidates always exactly 3
  {
    let ok=true;
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Moderate", objective:"Balanced strategy", horizon:"Medium term", location:"No preference"});
    res.candidates.forEach(c=>{ if(c.interventionKeys.length!==3) ok=false; });
    check("Candidate portfolios contain exactly three interventions", ok && res.candidates.length>0, `${res.candidates.length} candidates checked`);
  }

  // 12 & 13: Gemini response validator rejects unapproved candidates and numeric scores
  {
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Moderate", objective:"Balanced strategy", horizon:"Medium term", location:"No preference"});
    const fakeUnknown = { selectedCandidateId:"portfolio_does_not_exist", interventions:[{actionId:"a",priority:1},{actionId:"b",priority:2},{actionId:"c",priority:3}] };
    const v1 = validateStrategistResponse(res.candidates, fakeUnknown);
    check("Gemini can select only approved candidates", !v1.valid, v1.errors.join("; "));

    const realCand = res.candidates[0];
    const fakeNumeric = { selectedCandidateId: realCand.id, regionalStressScore: 42,
      interventions: realCand.interventionKeys.map((k,i)=>({actionId:k, priority:i+1})) };
    const v2 = validateStrategistResponse(res.candidates, fakeNumeric);
    check("Gemini cannot change deterministic scores (numeric fields rejected)", !v2.valid, v2.errors.join("; "));
  }

  // 14: instant strategy works with zero network calls
  {
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Limited", objective:"Protect vulnerable populations", horizon:"Short term", location:"Origin region"});
    const strat = generateInstantCascadeStrategy(res, {budget:"Limited", decisionMaker:"City or county planner"});
    const ok = !!strat && strat.interventions.length===3 && strat.isInstant===true;
    check("Instant Strategy works without Gemini", ok);
  }

  return results;
}

function infoGCPMethod(){
  return `
    <div style="font-size:12.5px;color:#B7D3BF;line-height:1.65">
      <p><b style="color:var(--txt)">Dependency graph.</b> Global Cascade Potential is computed over a
      small, documented graph of 8 planetary system nodes (Ocean & Coastal Ecosystems, Food & Water,
      Electricity Grid, Energy & Industry, Ports & Logistics, Digital Infrastructure, Public Health,
      Population Displacement) connected by 13 explicit edges. Every edge is labelled
      <b style="color:var(--aqua)">evidence-based</b>, <b style="color:var(--amber)">modeled proxy</b>, or
      <b style="color:var(--muted)">scenario assumption</b>, and carries a documented source or rationale.</p>
      <p><b style="color:var(--txt)">Propagation depth.</b> Stress propagates outward from the region's
      domain scores up to 3 hops through the graph. Each hop's contribution is attenuated
      (×1.0 at hop 1, ×0.7 at hop 2, ×0.49 at hop 3), so distant, indirect effects count for
      less than direct ones. Multiple incoming paths to the same node are combined with a noisy-OR
      function, never simply summed, so double-counting cannot inflate a node's impact.</p>
      <p><b style="color:var(--txt)">Edge strength and target vulnerability.</b> Each edge has a fixed
      strength (0 to 1). The receiving node's own vulnerability, calibrated from the region's baseline
      indices and reduced by any active interventions or simulator settings, scales how much of that
      strength actually lands.</p>
      <p><b style="color:var(--txt)">Material-impact threshold.</b> A node is reported as
      "materially affected" only once its modeled impact clears 0.20 (on a 0 to 1 scale); impacts between
      0.08 and 0.20 are shown separately as secondary modeled signals, and anything below that is treated
      as negligible and not reported.</p>
      <p><b style="color:var(--txt)">Confidence.</b> Each edge's evidence type is weighted
      (evidence-based ×1.0, modeled proxy ×0.6, scenario assumption ×0.25) and blended across
      every active contribution into a confidence score. That score scales the final Global Cascade
      Potential down slightly when the pathways driving it are less well evidenced, it can only reduce the
      score, never inflate it.</p>
      <p><b style="color:var(--txt)">Limitations.</b> This is a small, hand-built graph, not a full
      systems model of the planet. It has not been validated against real historical cascading-disaster
      outcomes, and should be read as a transparent, explainable estimate, not a probability.</p>
    </div>`;
}

function infoSensitivityMethod(){
  return `
    <div style="font-size:12.5px;color:#B7D3BF;line-height:1.65">
      <p><b style="color:var(--txt)">Tested assumptions.</b> Six model inputs are each perturbed
      independently, in both directions, within a fixed predefined range: sea temperature difference from
      baseline (±0.4°C), energy demand (±10%), AI data center load (±12%), forest loss
      (±8%), coastal population (±8%), and regional resource pressure (±10%).</p>
      <p><b style="color:var(--txt)">Minimum and maximum.</b> For each assumption, the Regional Stress
      Score is recomputed at both ends of its tested range. The lowest score seen across every test becomes
      the minimum; the highest becomes the maximum.</p>
      <p><b style="color:var(--txt)">Spread.</b> Spread is simply maximum minus minimum, in score points.
      It measures how much the score moves under plausible assumption changes, not a statistical
      confidence interval.</p>
      <p><b style="color:var(--txt)">Confidence classification.</b> Spread of 4 points or less is
      labelled High confidence. 5 to 9 points is Moderate confidence. Above 9 points is
      Assumption-sensitive, EarthShield's honest flag that the result should be read with more caution.</p>
    </div>`;
}

      return g.plain.toLowerCase().includes(q)

        || g.def.toLowerCase().includes(q)

  const rows = entries.map(g=>`

      <div class="phead"><span class="dot" style="background:var(--violet)"></span>

}

/* =========================================================
   SEE HOW EARTHSHIELD WORKS, dynamic 5-step guided walkthrough.
   Every step is generated from the CURRENT computed state
   (region, live/modeled data, Regional Stress Score, strongest
   pathway, affected systems/regions, Global Cascade Potential),
   nothing here is a fixed number or hardcoded scenario.
   ========================================================= */
function generateWalkthroughSteps(){
  const scenarioSim = ST.sim ? { ...ST.simInputs } : null;
  const R = computeRisks(ST.region, ST.live, scenarioSim);
  const bnd = band(R.cascade);
  const prop = propagatePlanetaryCascade(ST.region, R, scenarioSim);
  const topDomain = [...R.domains].sort((a,b)=>b.v-a.v)[0];
  const topAction = mitigations(ST.region, ST.live).list[0];
  const pressureLine = ST.live
    ? `Sea-surface temperature is ${ST.live.sst}°C (${ST.live.sstAnom>=0?'+':''}${ST.live.sstAnom}°C vs. the fitted local baseline).`
    : "Live ocean signals are currently unavailable, EarthShield is using modeled regional baselines.";
  const pathLabel = prop.strongestPath ? prop.strongestPath.labels.join(" → ") : null;

  return [
    { no:"STEP 1 OF 5", title:`Origin: ${ST.region.name}`,
      body:`${pressureLine} EarthShield treats ${ST.region.name} as the origin of this cascade, the region where pressure is currently building.`,
      vis:()=>`<div style="text-align:center"><div class="demo-bignum" style="font-size:19px;color:var(--aqua)">${ST.region.name}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px">ORIGIN REGION</div></div>` },

    { no:"STEP 2 OF 5", title:"Regional Stress Score and top domain",
      body:`The Regional Stress Score for ${ST.region.name} is ${R.cascade}/100 (${bnd.t}). The highest single risk domain right now is ${topDomain.nm} at ${topDomain.v}/100.`,
      vis:()=>`<div style="text-align:center"><div class="demo-bignum" style="color:${cv(bnd.c)}">${R.cascade}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px">REGIONAL STRESS SCORE</div></div>` },

    { no:"STEP 3 OF 5", title:"Strongest regional-to-system pathway",
      body: pathLabel
        ? `The strongest pathway currently propagating out of ${ST.region.name} is ${pathLabel}, reaching an end-to-end strength of ${prop.strongestPath.value}/100.`
        : `No dominant pathway is propagating out of ${ST.region.name} at current levels.`,
      vis:()=> pathLabel
        ? `<div style="font-size:11.5px;font-family:'Space Grotesk';font-weight:700;text-align:center;line-height:1.7">${pathLabel}</div>`
        : `<div style="font-size:12px;color:var(--muted)">No active pathway</div>` },

    { no:"STEP 4 OF 5", title:"Affected systems and regions",
      body:`${prop.affectedNodes.length} of ${GRAPH_NODES.length} planetary system nodes show measurable impact${prop.affectedNodes.length?`, led by ${prop.affectedNodes[0].nm}`:''}. ${prop.affectedRegions.length ? `Displacement pressure is also reaching ${prop.affectedRegions.map(r=>r.name).join(" and ")}.` : "No neighboring regions show cross-region spillover at current levels."}`,
      vis:()=>`<div style="display:flex;gap:18px;align-items:center;justify-content:center">
        <div style="text-align:center"><div class="demo-bignum" style="font-size:26px;color:var(--violet)">${prop.affectedNodes.length}</div><div style="font-size:10px;color:var(--muted);margin-top:4px">SYSTEMS</div></div>
        <div style="text-align:center"><div class="demo-bignum" style="font-size:26px;color:var(--violet)">${prop.affectedRegions.length}</div><div style="font-size:10px;color:var(--muted);margin-top:4px">REGIONS</div></div>
      </div>` },

    { no:"STEP 5 OF 5", title:"Global Cascade Potential and the top intervention point",
      body:`Global Cascade Potential for this scenario is ${prop.gcp}/100 (${prop.band.t}). The highest-ranked single intervention is ${topAction?topAction.nm:"none available"}. Open the AI Cascade Strategist for a full, budget- and objective-aware strategy.`,
      vis:()=>`<div style="text-align:center"><div class="demo-bignum" style="color:${cv(prop.band.c)}">${prop.gcp}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px">GLOBAL CASCADE POTENTIAL</div></div>` },
  ];
}
let _demoIdx=0;
let _demoSteps=[];
function renderDemoStep(){
  const s=_demoSteps[_demoIdx];
  $("#demoStepNo").textContent=s.no;
  $("#demoTitle").textContent=s.title;
  $("#demoBody").textContent=s.body;
  $("#demoVis").innerHTML=s.vis();
  const prog=$("#demoProg");
  prog.innerHTML=_demoSteps.map((_,i)=>`<i class="${i<_demoIdx?'done':i===_demoIdx?'on':''}"></i>`).join("");
  $("#demoPrev").style.visibility=_demoIdx===0?"hidden":"visible";
  $("#demoNext").textContent=_demoIdx===_demoSteps.length-1?"Finish → AI Strategist":"Next";
}
function runDemo(){
  _demoSteps = generateWalkthroughSteps();
  _demoIdx=0; renderDemoStep();
  $("#demoOverlay").classList.add("on");
}
function endDemo(goStrategist){
  $("#demoOverlay").classList.remove("on");
  if(goStrategist) setView("strategist");
}
function wireDemo(){
  const ov=$("#demoOverlay"); if(!ov) return;
  $("#demoNext").onclick=()=>{
    if(_demoIdx<_demoSteps.length-1){ _demoIdx++; renderDemoStep(); }
    else endDemo(true);
  };
  $("#demoPrev").onclick=()=>{ if(_demoIdx>0){ _demoIdx--; renderDemoStep(); } };
  $("#demoSkip").onclick=()=>endDemo(false);
}

function setView(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  $("#main").scrollTop=0;
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.v));

function fillRegions(){
  $("#regionSel").innerHTML=REGIONS.map(r=>`<option value="${r.id}">${r.name}</option>`).join("");
  $("#regionSel").value=ST.region.id;
  updateRegionLabel();
  $("#regionSel").onchange=async e=>{
    ST.region=REGIONS.find(r=>r.id===e.target.value);
    ST.sim=null; ST.simInputs={energy:0,forest:0,sst:0,dataCtr:0,coastPop:0,gridResilience:0,coastalBuffer:0};
    ST.overviewSub="snapshot";
    updateRegionLabel();
    await refresh();
  };
}

async function refresh(){
  ST.loading=true;
  $("#refreshBtn").classList.add("live");
  $("#v-overview").innerHTML=loadingCard("Pulling live ocean & atmosphere signals\u2026");
  buildInfo();
  try{ ST.live=await loadLive(ST.region); }
  catch(e){ ST.live=null; }
  ST.lastRefreshAt = Date.now();
  ST.loading=false;
  $("#refreshBtn").classList.remove("live");
  renderAll();
  const fails = ST.live ? Object.values(ST.live.status).filter(s=>s==="mdl").length : 99;
  if(!ST.live) toast("Live feeds unreachable, showing modeled baseline");
  else if(fails>0) toast(`Loaded \u00B7 ${fails} signal group(s) on modeled fallback`);
  else toast("Live data loaded");
}
$("#refreshBtn").onclick=refresh;

/* re-render on breakpoint cross / orientation change (cascade & column layouts) */
let _rt, _lastNarrow = window.innerWidth<=560;
window.addEventListener("resize", ()=>{
  clearTimeout(_rt);
  _rt=setTimeout(()=>{
    const nowNarrow = window.innerWidth<=560;
    if(nowNarrow!==_lastNarrow){ _lastNarrow=nowNarrow; if(ST.live!==undefined) renderAll(); }
  }, 180);
});

fillRegions();
wireDemo();
refresh();

</script>
</body>
</html>
