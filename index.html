<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="EarthShield is an AI-assisted planetary cascade intelligence platform that models how regional environmental and human pressures propagate through connected systems, simulates scenarios, and evaluates interventions.">
<title>EarthShield · Planetary Cascade Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071A12; --panel:#0E2B1D; --panel2:#123A27; --line:#1B4A34;
  --txt:#EAF3EC; --muted:#8FB89E; --muted2:#5E8870;
  --amber:#E8B24A; --aqua:#48D0AE; --red:#F0795C; --violet:#9CA7E8;
  --green:#7FD89A;
  --r:14px; --rsm:10px;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Space Grotesk',sans-serif}

#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- top bar ---------- */
header{flex:0 0 auto;padding:calc(var(--sat) + 12px) 16px 11px;display:flex;flex-direction:column;
  gap:10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0C2519,#071A12)}
.hrow1{display:flex;align-items:center;gap:12px}
.hrow2{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.logo{width:34px;height:34px;flex:0 0 auto;position:relative}
.brand h1{font-family:'Space Grotesk';font-size:17px;font-weight:700;margin:0;letter-spacing:-.3px;white-space:nowrap}
.brand .sub{font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.region-pick{position:relative;display:flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--rsm);padding:10px 13px;font-size:13px;font-weight:600;
  flex:1;min-width:0;color:var(--txt);transition:.15s;text-align:left}
.region-pick:hover,.region-pick:focus-within{border-color:var(--aqua)}
.region-pick > svg:first-child{flex:0 0 auto;color:var(--aqua)}
.region-pick .rp-label{flex:0 0 auto;color:var(--muted);font-size:11px;font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;border-right:1px solid var(--line);padding-right:9px}
.region-pick select{appearance:none;background:none;border:none;color:var(--txt);font:inherit;
  font-weight:600;outline:none;flex:1;min-width:0;cursor:pointer;
  position:absolute;inset:0;opacity:0;width:100%;height:100%}
.region-pick select option{background:#0E2B1D;color:#EAF3EC;font-weight:600;padding:8px}
.region-pick select optgroup{background:#0E2B1D;color:#EAF3EC}
.region-pick .rp-current{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-pick .rp-caret{flex:0 0 auto;color:var(--muted)}
.gbtn{flex:0 0 auto;width:42px;height:42px;border-radius:var(--rsm);background:var(--panel);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--amber);transition:.15s}
.gbtn:hover{color:#F0B968;border-color:var(--amber)}
.gbtn.live{color:var(--aqua);border-color:var(--aqua)}
@media(min-width:880px){
  .hrow2{max-width:420px;margin-left:auto;margin-top:-46px}
  .hrow1{align-items:center}
}

/* ---------- tab strip ---------- */
nav{flex:0 0 auto;display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);
  background:var(--bg);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{padding:9px 15px 11px;font-size:13px;font-weight:600;color:var(--muted);position:relative;
  white-space:nowrap;border-radius:8px 8px 0 0;transition:.15s}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--txt)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;
  background:var(--aqua);border-radius:2px}

/* ---------- scroll body ---------- */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:18px;overscroll-behavior:contain}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- generic panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:14px}
.phead{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.phead .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.phead h2{font-family:'Space Grotesk';font-size:14px;font-weight:600;margin:0;letter-spacing:.2px}
.phead .tag{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:20px}
.tag.real{color:var(--aqua);border-color:#1d5e4e}
.tag.model{color:var(--amber);border-color:#4a3c1c}

.grid{display:grid;gap:14px}
@media(min-width:880px){
  main{padding:22px 26px}
  .cols2{grid-template-columns:1fr 1fr}
  .cols3{grid-template-columns:repeat(3,1fr)}
  .wrap{max-width:1180px;margin:0 auto}
}

/* ---------- MOBILE ---------- */
@media(max-width:560px){
  header{padding:calc(var(--sat) + 11px) 14px 11px}
  .brand h1{font-size:16px}
  .gbtn{width:40px;height:40px}
  main{padding:14px}
  /* hero: stack and center the ring above the meta */
  .hero{padding:17px}
  .hero-top{flex-direction:column;align-items:center;text-align:center;gap:14px}
  .hero-meta{min-width:0;width:100%}
  .hero-meta h3{font-size:12px}
  .hero-meta .band{font-size:22px}
  .drivers{justify-content:center}
  .uncert{text-align:left}
  /* sliders / sim: single column already; keep delta 2-up but tighter */
  .delta-grid{gap:8px}
  .delta .dv .new{font-size:18px}
  /* cascade diagram: let it shrink to fit, no forced min-width scroll */
  #cascadeSVG{min-width:0;width:100%}
  .cascade-wrap{overflow-x:visible}
  /* meters & feed: a touch more breathing room */
  .panel{padding:14px}
  .meter .mt .nm{font-size:12px}
  .mit{padding:12px;gap:11px}
  .mit .red .rv{font-size:17px}
  .feed .frow{padding:11px 12px}
  .feed .frow .fnm .a{font-size:12px}
  /* All 6 tab names stay fully readable; scroll horizontally instead of
     truncating with ellipsis, so judges never see a clipped tab label. */
  nav{gap:2px;padding:8px 6px 0;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .tab{flex:0 0 auto;min-width:0;white-space:nowrap;text-align:center;padding:9px 13px 11px;font-size:11.5px;scroll-snap-align:start}
  .tab.on::after{left:8px;right:8px}
}
@media(max-width:560px){
  input[type=range]{height:6px}
  input[type=range]::-webkit-slider-thumb{width:22px;height:22px}
  input[type=range]::-moz-range-thumb{width:18px;height:18px}
}
/* very narrow phones */
@media(max-width:360px){
  .brand .sub{display:none}
  .delta-grid{grid-template-columns:1fr}
  .hero-meta .band{font-size:20px}
  .tab{font-size:9.5px;padding-left:1px;padding-right:1px}
}

/* ---------- score hero ---------- */
.hero{background:radial-gradient(135% 150% at 78% -10%,#15402B 0%,#0F3322 48%,#0A2418 100%);
  border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.hero .glow{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(60% 80% at 85% 10%,rgba(72,208,174,.15),transparent 60%)}
.hero-top{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.cascade-ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.cascade-ring svg{transform:rotate(-90deg)}
.cascade-ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.cascade-ring .num{font-family:'Space Grotesk';font-size:34px;font-weight:700;line-height:1}
.cascade-ring .lbl{font-size:9.5px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
.hero-meta{flex:1;min-width:200px}
.hero-meta h3{font-family:'Space Grotesk';font-size:13px;color:var(--muted);font-weight:500;
  letter-spacing:.4px;text-transform:uppercase;margin:0 0 4px}
.hero-meta .band{font-family:'Space Grotesk';font-size:25px;font-weight:700;margin:0 0 10px;letter-spacing:-.3px}
.hero-meta p{font-size:13px;line-height:1.55;color:#B7D3BF;margin:0}
.band-scale{font-family:'JetBrains Mono';font-size:13px;font-weight:600;color:var(--muted);
  margin-left:8px;vertical-align:middle}
.drivers{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{font-size:11.5px;font-weight:500;padding:5px 10px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.chip i{width:6px;height:6px;border-radius:50%;display:inline-block}
.hero-meta p.lede{font-size:13.5px;color:var(--aqua);font-weight:500;margin:0 0 8px;line-height:1.45}

/* run demo button */
.demo-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:10px 16px;
  border-radius:30px;background:linear-gradient(100deg,var(--aqua),#2BB793);color:#04130D;
  font-family:'Space Grotesk';font-size:13px;font-weight:700;text-align:left;transition:.15s;
  position:relative}
.demo-btn:hover{filter:brightness(1.06)}
.demo-btn .dp{font-size:10px}
.demo-btn .ds{display:none}


/* live vs modeled note */
.lvm{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;display:flex;flex-direction:column;gap:8px}
.lvm-row{display:flex;gap:10px;font-size:11.5px;line-height:1.45;align-items:baseline}
.lvm-k{flex:0 0 auto;font-weight:700;font-size:10px;letter-spacing:.5px;text-transform:uppercase;min-width:108px}
.lvm-v{color:var(--muted)}

/* hotspot map */
.hotspot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#072622}
.hot-map{width:100%;aspect-ratio:2/1;line-height:0;position:relative}
.hot-map svg{width:100%;height:100%}
.hot-meta{display:flex;flex-wrap:wrap;gap:14px;padding:13px 14px;border-top:1px solid var(--line)}
.hot-meta > div{display:flex;flex-direction:column;gap:3px}
.hot-meta .hk{font-size:9.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.hot-meta .hv{font-size:12.5px;font-weight:600}

/* demo overlay */
#demoOverlay{position:fixed;inset:0;z-index:300;background:rgba(5,18,11,.9);backdrop-filter:blur(4px);
  display:none;flex-direction:column;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 20px);
  align-items:center;justify-content:center}
#demoOverlay.on{display:flex;animation:fade .3s ease}
.demo-card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.demo-step-no{font-family:'JetBrains Mono';font-size:11px;font-weight:700;color:var(--aqua);
  letter-spacing:1px;margin-bottom:10px}
.demo-card h3{font-family:'Space Grotesk';font-size:19px;font-weight:700;margin:0 0 9px;line-height:1.25}
.demo-card p{font-size:13px;color:#B7D3BF;line-height:1.55;margin:0 0 16px}
.demo-vis{height:96px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  margin-bottom:16px;display:grid;place-items:center;overflow:hidden;position:relative}
.demo-prog{display:flex;gap:6px;margin-bottom:18px}
.demo-prog i{flex:1;height:4px;border-radius:3px;background:var(--line);transition:.3s}
.demo-prog i.on{background:var(--aqua)}
.demo-prog i.done{background:var(--aqua);opacity:.5}
.demo-ctrl{display:flex;gap:10px}
.demo-ctrl .btn{flex:1}
.demo-skip{position:absolute;top:calc(var(--sat) + 16px);right:18px;color:var(--muted);
  font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line)}
.demo-bignum{font-family:'Space Grotesk';font-size:40px;font-weight:700;line-height:1}
.demo-arrow{font-size:24px;color:var(--muted)}

/* ---------- risk meters ---------- */
.meter{padding:13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--rsm)}
.meter .mt{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.meter .mt .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.meter .mt .nm{font-size:12.5px;font-weight:600;line-height:1.2}
.meter .mt .vv{margin-left:auto;font-family:'Space Grotesk';font-size:17px;font-weight:700}
.bar{height:7px;border-radius:6px;background:#06160E;overflow:hidden;position:relative}
.bar > i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .7s cubic-bezier(.4,1.3,.5,1)}
.meter .cap{font-size:10.5px;color:var(--muted);margin-top:7px;line-height:1.4}

/* ---------- cascade diagram ---------- */
.cascade-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:4px}
#cascadeSVG{display:block;min-width:640px}
.cz-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}
.cz-legend span{display:flex;align-items:center;gap:6px}
.cz-legend i{width:18px;height:3px;border-radius:2px;display:inline-block}

/* ---------- how-this-score-was-calculated (hero) ---------- */
.calc-toggle{margin-top:14px;font-size:11.5px;font-weight:600;color:var(--aqua);
  background:none;border:none;padding:0;display:inline-flex;align-items:center;gap:5px}
.calc-inline{max-height:0;overflow:hidden;transition:max-height .3s ease}
.calc-inline.open{max-height:3000px;margin-top:12px}
.hc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.hc-row{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;padding:5px 0;
  color:#B7D3BF;border-bottom:1px solid rgba(27,74,52,.4)}
.hc-row .mono{font-weight:600}
.hc-sub{color:var(--muted)}
.hc-total{border-bottom:none;border-top:1px solid var(--line);margin-top:4px;padding-top:8px;
  font-weight:700;font-family:'Space Grotesk';font-size:12.5px;color:var(--txt)}

/* ---------- scoring calc / band legend ---------- */
.score-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:2px}
.score-tbl th{text-align:left;font-size:10px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--muted);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--line)}
.score-tbl td{padding:8px;border-bottom:1px solid rgba(27,74,52,.4);color:#B7D3BF}
.score-tbl td.num, .score-tbl th.num{text-align:right;font-family:'JetBrains Mono';font-variant-numeric:tabular-nums}
.score-sum{margin-top:12px;display:flex;flex-direction:column;gap:1px}
.ss-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 8px;color:#B7D3BF}
.ss-row .mono{font-weight:600}
.ss-row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:700;
  font-family:'Space Grotesk';font-size:13px}
.calc{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.calc-row{display:flex;gap:11px;font-size:12px;color:#B7D3BF;line-height:1.55;align-items:flex-start}
.calc-n{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--aqua);color:#04130D;
  font-family:'Space Grotesk';font-weight:700;font-size:12px;display:grid;place-items:center}
.calc-eq{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  font-size:12px;color:var(--aqua);text-align:center;letter-spacing:.2px}
.band-legend{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:9px;overflow:hidden}
.bl-row{display:flex;align-items:center;gap:10px;background:var(--panel);padding:11px 14px;font-size:12.5px}
.bl-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.bl-row b{flex:1}
.bl-r{color:var(--muted)}

/* ---------- why-score explainer ---------- */
/* ---------- model fidelity note + slider affects ---------- */
.model-note{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 11px;margin-bottom:14px;display:inline-block}
.affects{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.affects::before{content:"";display:inline-block}

/* ---------- preset scenarios ---------- */
.preset-lab{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);margin-bottom:9px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;padding-bottom:16px;
  border-bottom:1px solid var(--line)}
.preset{flex:1 1 auto;min-width:0;padding:10px 12px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt);font-size:12px;font-weight:600;transition:.15s;
  white-space:nowrap}
.preset:hover{border-color:var(--aqua);color:var(--aqua)}
.preset:active{transform:scale(.97)}

/* ---------- sim controls ---------- */
.ctrl{margin-bottom:16px}
.ctrl:last-child{margin-bottom:0}
.ctrl .clab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ctrl .clab .l{font-size:12.5px;font-weight:600}
.ctrl .clab .v{font-family:'JetBrains Mono';font-size:12.5px;font-weight:700;color:var(--aqua)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;
  background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--aqua);border:3px solid #071A12;box-shadow:0 0 0 1px var(--aqua);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--aqua);
  border:3px solid #071A12;cursor:pointer}
.ctrl .crange{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted2);margin-top:5px}
.runbar{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;padding:13px;border-radius:var(--rsm);font-family:'Space Grotesk';font-size:13.5px;
  font-weight:600;transition:.15s;text-align:center;border:1px solid transparent}
.btn.primary{background:var(--aqua);color:#04130D}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel2);border-color:var(--line);color:var(--muted);flex:0 0 auto;width:54px}
.btn.ghost:hover{color:var(--txt);border-color:var(--aqua)}

/* sim delta readout */
.delta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.delta{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rsm);padding:11px 12px}
.delta .dn{font-size:11px;color:var(--muted);margin-bottom:5px}
.delta .dv{display:flex;align-items:baseline;gap:8px}
.delta .dv .base{font-family:'JetBrains Mono';font-size:13px;color:var(--muted2)}
.delta .dv .arr{color:var(--muted2);font-size:12px}
.delta .dv .new{font-family:'Space Grotesk';font-size:20px;font-weight:700}
.delta .chg{font-family:'JetBrains Mono';font-size:11px;font-weight:700;margin-top:4px}
.empty-sim{text-align:center;padding:26px 16px;color:var(--muted)}
.empty-sim .ico{font-size:26px;margin-bottom:8px;opacity:.5}
.empty-sim p{font-size:12.5px;margin:0;line-height:1.5}

/* ---------- mitigation cards ---------- */
.mit{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rsm);
  transition:.15s;position:relative;overflow:hidden}
.mit + .mit{margin-top:10px}
.mit:hover{border-color:#2a5a3c}
.mit-head{width:100%;display:flex;gap:13px;align-items:center;padding:14px;text-align:left;
  background:none;border:none;color:inherit}
.mit .rank{font-family:'Space Grotesk';font-size:13px;font-weight:700;color:#04130D;background:var(--green);
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.mit .mbody{flex:1;min-width:0}
.mit .mbody h4{font-family:'Space Grotesk';font-size:13.5px;font-weight:600;margin:0 0 4px}
.mit .mbody p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.45}

<script>
/* ===================================================================
   EarthShield, Planetary Cascade Intelligence (single-file POC)

   EarthShield combines:
     1. Statistical SST baseline estimation using OLS regression
     2. Deterministic regional scoring, planetary cascade propagation,
        simulation, sensitivity analysis and intervention optimization
     3. Gemini AI Cascade Strategist for selecting and explaining one
        pre-verified intervention portfolio

   OLS regression (fetchSSTTrendModel()) is a statistical model, not
   generative AI. Intervention portfolio generation
   (generateInterventionCandidates()) is deterministic optimization,
   not AI or an agentic search. Gemini, called only from the Netlify
   function, is the single generative-AI component in the app and it
   never computes or overrides a score, it selects and explains one
   already-verified candidate. See Info -> "How It Works" for the
   same breakdown in the UI.
   =================================================================== */
const MODEL_ID = "earthshield-cascade-v1";  // deterministic scoring engine identifier

/* =========================================================
   REGIONS, mix of US coastal + global hotspots.
   baselines: modeled regional pressure/exposure indices
   (0..1) calibrated from public-source ranges in the brief
   (NASA ocean-heat, IEA data center TWh, IPCC land-use).
   Live signals (SST, instability, AQI) overwrite the
   ocean/weather portions at runtime where reachable.
   ========================================================= */
const REGIONS = [
  {id:"miami",   name:"South Florida (Miami)",  lat:25.76, lon:-80.19, grid:"FRCC",
   b:{coastPop:.88, coastExp:.92, energy:.66, dataCtr:.58, forest:.18, mining:.10, industry:.46, water:.55, sstClim:28.4}},
  {id:"njcoast", name:"New Jersey Coast",        lat:39.36, lon:-74.42, grid:"PJM",
   b:{coastPop:.74, coastExp:.71, energy:.72, dataCtr:.81, forest:.22, mining:.12, industry:.58, water:.5,  sstClim:22.1}},
  {id:"gulf",    name:"Gulf of Mexico (NOLA)",   lat:29.30, lon:-89.40, grid:"MISO",
   b:{coastPop:.62, coastExp:.95, energy:.78, dataCtr:.42, forest:.20, mining:.66, industry:.74, water:.48, sstClim:28.9}},
  {id:"houston", name:"Houston–Galveston, TX",   lat:29.31, lon:-94.79, grid:"ERCOT",
   b:{coastPop:.79, coastExp:.83, energy:.91, dataCtr:.69, forest:.14, mining:.71, industry:.88, water:.62, sstClim:28.6}},
  {id:"bangla",  name:"Bay of Bengal (Bangladesh)", lat:22.0, lon:90.4, grid:"BD",
   b:{coastPop:.97, coastExp:.99, energy:.41, dataCtr:.18, forest:.40, mining:.30, industry:.55, water:.78, sstClim:29.2}},
  {id:"manila",  name:"Philippines (Manila Bay)", lat:14.55, lon:120.9, grid:"PH",
   b:{coastPop:.93, coastExp:.90, energy:.48, dataCtr:.34, forest:.46, mining:.62, industry:.6,  water:.66, sstClim:29.6}},
  {id:"carib",   name:"Caribbean (San Juan)",    lat:18.46, lon:-66.10, grid:"PR",
   b:{coastPop:.80, coastExp:.88, energy:.55, dataCtr:.22, forest:.34, mining:.18, industry:.4,  water:.6,  sstClim:28.8}},
  {id:"chennai", name:"India SE Coast (Chennai)",lat:13.08, lon:80.27, grid:"IN-S",
   b:{coastPop:.95, coastExp:.84, energy:.6,  dataCtr:.52, forest:.16, mining:.5,  industry:.78, water:.83, sstClim:29.0}},
];

/* short geographic sublabels for Region & Data's regional-lens card */
const REGION_SUBLABEL = {
  miami:"Southeast USA", njcoast:"Mid-Atlantic, USA", gulf:"Gulf Coast, USA", houston:"Gulf Coast, USA",
  bangla:"South Asia", manila:"Southeast Asia", carib:"Caribbean", chennai:"South Asia",
};

/* live state per session */
const ST = {
  region: REGIONS[0],
  live: null,            // {sst, sstAnom, cape, shear, humidity, aqi, pm25, status:{}}
  loading: false,
  lastRefreshAt: null,
  sim: null,             // last simulation result
  simInputs: {energy:0, forest:0, sst:0, dataCtr:0, coastPop:0, gridResilience:0, coastalBuffer:0},
  simLabel: null,         // exact preset name when a preset was run, "Custom scenario" when manually run, null when no scenario is active
  simControlsOpen: false, // "Customize Scenario" collapsible, collapsed by default
  infoTab: "about",
  overviewSub: "snapshot",
  glossaryQuery: "",
  glossaryCat: "all",
  strategist: {
    decisionMaker:"Regional government", objective:"Balanced strategy", budget:"Moderate",
    horizon:"Medium term", location:"No preference", concern:"",
    loading:false, result:null, source:null, notice:null, showDetail:false,
  },
  cascadeSub: "regional",
  cascadeFilter: "all",
  cascadeNode: null,
  cascadeShowScenario: false,
  cascadeShowAllNodes: false,
  mitSearch: "",
  mitSystemFilter: "all",
  mitSort: "impact",
  mitSelected: [],        // stable action KEYS (e.g. "wetland"), not list indexes -- max 3
  requiredActionKeys: [], // action keys carried from Interventions -> AI Strategist as hard requirements
};

/* =========================================================
   DATA LAYER, real key-free CORS APIs (Open-Meteo family).
   Sandbox blocks these hosts; the browser does not. Each
   signal degrades to a modeled baseline on failure and is
   labelled accordingly in the Data Feeds view.
   ========================================================= */
async function jget(url, ms=9000){
  const c = new AbortController(); const t=setTimeout(()=>c.abort(), ms);
  try{ const r=await fetch(url,{signal:c.signal}); clearTimeout(t);
    if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}

/* =========================================================
   STATISTICAL SST BASELINE MODEL.
   Fits an ordinary-least-squares trend line over ~60 days of
   real historical sea-surface temperature (Open-Meteo Marine
   archive) instead of using a fixed per-region constant. The
   fitted line's value at "today" becomes the baseline; the
   residual standard deviation becomes the scale for a z-score,
   so the anomaly used everywhere downstream (oceanHeat, storm,
   biodiversity, food/water) is grounded in a small trained
   statistical model, not a hardcoded number. Falls back to the
   static regional constant if history is unavailable.
   ========================================================= */
function linreg(ys){
  const n=ys.length; if(n<3) return null;
  const xs=ys.map((_,i)=>i);
  const mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
  const slope = den===0?0:num/den, intercept = my - slope*mx;
  const resid = ys.map((y,i)=>y-(intercept+slope*xs[i]));
  const variance = resid.reduce((a,b)=>a+b*b,0)/Math.max(1,n-2);
  const std = Math.sqrt(variance);
  const fitted = intercept + slope*(n-1);
  return {slope, intercept, std, n, fitted};
}

async function fetchSSTTrendModel(reg){
  const {lat,lon}=reg;
  try{
    const m = await jget(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=sea_surface_temperature&past_days=60&forecast_days=1`,12000);
    const hourly = (m.hourly&&m.hourly.sea_surface_temperature)||[];
    const times = (m.hourly&&m.hourly.time)||[];
    const byDay={};
    times.forEach((t,i)=>{ const v=hourly[i]; if(v==null) return;
      const day=t.slice(0,10); (byDay[day]=byDay[day]||[]).push(v); });
    const days=Object.keys(byDay).sort();
    const daily=days.map(d=>byDay[d].reduce((a,b)=>a+b,0)/byDay[d].length);
    if(daily.length<10) throw new Error("insufficient history");
    const fit=linreg(daily);
    if(!fit) throw new Error("fit failed");
    return { baseline:+fit.fitted.toFixed(2), std:+fit.std.toFixed(2),
      slope:+fit.slope.toFixed(4), days:daily.length, status:"stat" };
  }catch(e){
    return { baseline:reg.b.sstClim, std:0.6, slope:0, days:0, status:"mdl" };
  }
}

async function loadLive(reg){
  const out = {status:{}};
  const {lat,lon} = reg;
  // 1) Ocean: sea-surface temperature (Open-Meteo Marine) + statistical SST baseline
  const trend = await fetchSSTTrendModel(reg);
  out.sstBaseline=trend.baseline; out.sstStd=trend.std; out.sstSlope=trend.slope;
  out.sstTrendDays=trend.days; out.status.sstTrend=trend.status;
  // Uses the Marine API's `current` parameter (based on 15-minutely model data per
  // Open-Meteo docs), not an hourly-average, so this is a genuine current value rather
  // than a same-day mean relabelled. It is still API-derived (model/analysis output),
  // not necessarily a direct instrument observation.
  try{
    const m = await jget(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=sea_surface_temperature&forecast_days=1`);
    const cur = m.current && m.current.sea_surface_temperature;
    if(cur!=null){ out.sst=+cur.toFixed(1); out.status.sst="ok"; }
    else throw new Error("empty");
  }catch(e){ out.sst=trend.baseline; out.status.sst="mdl"; }
  out.sstAnom = +(out.sst - out.sstBaseline).toFixed(1);
  out.sstZ = out.sstStd>0 ? +((out.sst - out.sstBaseline)/out.sstStd).toFixed(2) : 0;

  // 2) Atmosphere: severe-convective ingredients (CAPE, shear, humidity)
  try{
    const w = await jget(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=relative_humidity_2m,wind_speed_10m&hourly=cape,wind_speed_700hPa,wind_speed_10m&wind_speed_unit=ms&forecast_days=1`);
    const cape=(w.hourly&&w.hourly.cape||[]).filter(v=>v!=null);
    out.cape = cape.length ? Math.round(Math.max(...cape)) : 800;
    const up=(w.hourly&&w.hourly.wind_speed_700hPa||[]); const lo=(w.hourly&&w.hourly.wind_speed_10m||[]);
    let sh=null; for(let i=0;i<up.length;i++){ if(up[i]!=null&&lo[i]!=null){ sh=Math.max(sh??0, Math.abs(up[i]-lo[i])); } }
    out.shear = sh!=null?Math.round(sh):18;
    out.humidity = w.current ? Math.round(w.current.relative_humidity_2m) : 70;
    out.status.atmo="ok";
  }catch(e){ out.cape=900; out.shear=20; out.humidity=72; out.status.atmo="mdl"; }

  // 3) Pollution: US AQI / PM2.5 (Open-Meteo Air Quality)
  try{
    const a = await jget(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm2_5`);
    if(a.current){ out.aqi=Math.round(a.current.us_aqi); out.pm25=+(a.current.pm2_5).toFixed(1); out.status.aqi="ok"; }
    else throw new Error("empty");
  }catch(e){ out.aqi=Math.round(40+reg.b.industry*70); out.pm25=+(8+reg.b.industry*22).toFixed(1); out.status.aqi="mdl"; }

  return out;
}

/* =========================================================
   CASCADE MODEL, the patentable core.
   Two engines feed a multi-domain Regional Stress Score.
   Each domain risk is 0..100. Deterministic + transparent.
   ========================================================= */
function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x));}

function computeRisks(reg, live, sim){
  const b=reg.b;
  // full set of counterfactual deltas (sim inputs + action resilience variables)
  const s=Object.assign({
    energy:0, forest:0, sst:0, dataCtr:0, coastPop:0,
    // resilience / action variables (0 unless an action sets them)
    gridResilience:0, evacuationReadiness:0, coastalBuffer:0,
    renewableShare:0, industrialPollution:0, forestProtection:0
  }, sim||{});

  // applied counterfactual deltas
  const sstAnom = (live?live.sstAnom:0) + s.sst;                 // °C above the fitted statistical baseline
  const energy  = clamp(b.energy*100 + s.energy - s.renewableShare, 0, 100)/100;
  const dataCtr = clamp(b.dataCtr*100 + s.dataCtr,0,100)/100;
  // FOREST: cover vs loss are now separated.
  //   forestCover rises with forestProtection, falls with the Additional Forest Loss slider (s.forest).
  //   forestLoss is the degradation signal that should INCREASE risk.
  const forestCover = clamp(b.forest*100 - s.forest + s.forestProtection, 0, 100)/100;
  const forestLoss  = 1 - forestCover;
  const coastPop= clamp(b.coastPop*100 + s.coastPop,0,100)/100;
  const cape = live?live.cape:900, shear=live?live.shear:20, hum=live?live.humidity:72;
  // industrial pollution can be reduced by an action; also lowers effective AQI stress
  const industry = clamp(b.industry*100 - s.industrialPollution,0,100)/100;
  const aqi  = clamp((live?live.aqi:60) - s.industrialPollution*0.6, 0, 500);
  // coastal protection: buffers reduce effective surge exposure
  const coastExpEff = clamp(b.coastExp*100 - s.coastalBuffer, 0, 100)/100;

  // ---- ENGINE A: Ocean-warming impacts ----
  // Ocean heat risk driven by SST anomaly only (NASA: ~90% excess heat to ocean).
  const oceanHeat = clamp(34 + sstAnom*26 + (b.sstClim>28?10:0));
  // Storm intensification: warm SST is the fuel; atmospheric instability, humidity and
  // LOW-SHEAR FAVORABILITY modulate it. Low vertical wind shear allows storms to organize
  // and intensify; high shear disrupts organization and suppresses intensification, so
  // shear is transformed into a favorability term (higher shear -> lower favorability)
  // rather than added directly. This is a simplified vertical-wind-shear proxy comparing
  // wind-speed magnitudes at two levels, not a full wind-vector shear calculation, and is
  // not operational cyclone forecasting.
  const lowShearFavorability = clamp01(1 - Math.min(Math.max(shear,0),30) / 30);
  const ingredients = clamp((cape/3000)*45 + (hum/100)*25 + lowShearFavorability*20 + 10);
  const stormInt = clamp(0.55*oceanHeat + 0.45*ingredients);
  const biodiv = clamp(28 + sstAnom*22 + industry*18 + aqi*0.12
                          - s.coastalBuffer*0.18);                          // reefs/fisheries; mangroves protect
  // Food & Water rises with forest LOSS (fixed), water stress, SST, warm climatology
  const foodWater = clamp(22 + b.water*40 + forestLoss*30 + sstAnom*10 + (b.sstClim>28?6:0)
                          - s.coastalBuffer*0.12);

  // ---- ENGINE B: Resource-consumption stress ----
  const aiEnergy = clamp(dataCtr*68 + energy*24 + 6);                       // IEA data center growth
  // Resource stress rises with industry, mining, energy, forest LOSS (fixed), pollution, AI load
  const resourceStress = clamp(industry*26 + b.mining*20 + energy*18 + forestLoss*14
                          + aqi*0.09 + aiEnergy*0.16);
  // Displacement: storm consequence + exposure, reduced by grid + evacuation + coastal buffers
  const displacement = clamp(0.5*stormInt + 0.3*(coastPop*100) + 0.2*(coastExpEff*100)
                          - s.gridResilience*0.35 - s.evacuationReadiness*0.30 - s.coastalBuffer*0.12);

  const domains = [
    {k:"ocean",  nm:"Ocean Heat",            v:Math.round(oceanHeat),  c:"--aqua",   eng:"A"},
    {k:"storm",  nm:"Storm Intensification", v:Math.round(stormInt),   c:"--red",    eng:"A"},
    {k:"biodiv", nm:"Biodiversity",          v:Math.round(biodiv),     c:"--green",  eng:"A"},
    {k:"food",   nm:"Food & Water",          v:Math.round(foodWater),  c:"--violet", eng:"A"},
    {k:"disp",   nm:"Human Displacement",    v:Math.round(displacement),c:"--red",   eng:"A"},
    {k:"res",    nm:"Resource Stress",       v:Math.round(resourceStress),c:"--amber",eng:"B"},
    {k:"ai",     nm:"AI Data Center Load",   v:Math.round(aiEnergy),   c:"--amber",  eng:"B"},
  ];

  // ---- Regional Stress Score: weighted, escalation-aware ----
  const w = {ocean:.14, storm:.18, biodiv:.10, food:.12, disp:.18, res:.16, ai:.12};
  let base=0; domains.forEach(d=>base+=d.v*w[d.k]);
  const hi = domains.filter(d=>d.v>=65).length;
  const cascade = clamp(base*(1 + hi*0.035));

  return {domains, cascade:Math.round(cascade), weights:w,
    baseWeighted:base, highCount:hi, escalation:1 + hi*0.035,
    inputs:{sstAnom,energy,dataCtr,forestLoss,forestCover,coastPop,cape,shear,lowShearFavorability,aqi,industry},
    drivers:topDrivers(reg,live,domains)};
}

function topDrivers(reg,live,domains){
  const d=[];
  if(live&&live.sstAnom>=0.3) d.push({t:`Sea temperature +${live.sstAnom}°C above baseline`, c:"--aqua"});
  if(reg.b.dataCtr>=.55) d.push({t:"High data center load", c:"--amber"});
  if(reg.b.coastExp>=.85) d.push({t:"Extreme coastal exposure", c:"--red"});
  if(reg.b.mining>=.6) d.push({t:"Heavy extraction", c:"--amber"});
  if(live&&live.aqi>=90) d.push({t:`Air quality reduced (index ${live.aqi})`, c:"--amber"});
  if(reg.b.coastPop>=.9) d.push({t:"Dense coastal population", c:"--violet"});
  const storm=domains.find(x=>x.k==="storm");
  if(storm&&storm.v>=70) d.push({t:"Storm ingredients elevated", c:"--red"});
  return d.slice(0,5);
}

function band(v){
  if(v>=78) return {t:"Severe", c:"--red", d:"Several major pressures are simultaneously high."};
  if(v>=60) return {t:"Elevated", c:"--amber", d:"Multiple important pressures are elevated."};
  if(v>=40) return {t:"Moderate", c:"--violet", d:"Several pressures deserve attention."};
  return {t:"Guarded", c:"--aqua", d:"Limited combined regional pressure."};
}
function rcolor(v){ return v>=70?"--red":v>=50?"--amber":v>=32?"--violet":"--aqua"; }

/* =========================================================
   VULNERABILITY COEFFICIENTS (documented, deterministic).
   Each links an existing intervention/simulator variable to the
   planetary-graph node(s) it plausibly hardens. Values are small
   linear multipliers calibrated so a typical single intervention
   (e.g. gridResilience:+20) produces a visible but not extreme
   vulnerability shift, never a full reset to zero.
   ========================================================= */
const VULN_COEF = {
  gridResilience_grid: 0.012,     // hardened grid -> less grid vulnerability
  gridResilience_disp: 0.010,     // hardened grid -> fewer displacement-causing outages
  gridResilience_health: 0.006,   // hardened grid -> hospitals/water treatment less exposed
  dataCtr_grid: 0.006,            // higher/lower AI+energy load -> grid pressure moves with it
  dataCtr_digital: 0.010,         // higher/lower AI load -> digital-infra pressure moves with it
  renewableShare_energyIndustry: 0.012,
  renewableShare_grid: 0.004,     // secondary: cleaner generation eases grid strain a little
  industrialPollution_oceanEco: 0.010,      // industrialPollution sim value = amount of REDUCTION
  industrialPollution_energyIndustry: 0.008,
  coastalBuffer_oceanEco: 0.010,
  coastalBuffer_foodWater: 0.010,
  coastalBuffer_ports: 0.010,
  coastalBuffer_disp: 0.008,
  evacuationReadiness_disp: 0.014,
  evacuationReadiness_spillover: 0.012,     // applied where cross-region spillover is computed
  forestProtection_foodWater: 0.012,
};

function nodeVulnerability(reg, sim={}){
  const b=reg.b;
  const s = Object.assign({ gridResilience:0, coastalBuffer:0, evacuationReadiness:0,
    renewableShare:0, industrialPollution:0, forestProtection:0, dataCtr:0 }, sim||{});
  const C = VULN_COEF;
  return {
    ocean_eco: clamp01(b.coastExp
      - s.coastalBuffer*C.coastalBuffer_oceanEco
      - s.industrialPollution*C.industrialPollution_oceanEco),
    food_water: clamp01(b.water
      - s.coastalBuffer*C.coastalBuffer_foodWater
      - s.forestProtection*C.forestProtection_foodWater),
    grid: clamp01(.30 + b.energy*.55
      - s.gridResilience*C.gridResilience_grid
      - s.renewableShare*C.renewableShare_grid
      + s.dataCtr*C.dataCtr_grid),
    energy_industry: clamp01(b.industry
      - s.renewableShare*C.renewableShare_energyIndustry
      - s.industrialPollution*C.industrialPollution_energyIndustry),
    ports_logistics: clamp01(.35 + b.coastExp*.55
      - s.coastalBuffer*C.coastalBuffer_ports),
    digital_infra: clamp01(b.dataCtr
      + s.dataCtr*C.dataCtr_digital),
    public_health: clamp01(.35 + b.coastPop*.55
      - s.gridResilience*C.gridResilience_health),
    displacement: clamp01(b.coastPop
      - s.coastalBuffer*C.coastalBuffer_disp
      - s.evacuationReadiness*C.evacuationReadiness_disp
      - s.gridResilience*C.gridResilience_disp),
  };
}
function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function combineNoisyOr(a,b){ return clamp01(1 - (1-a)*(1-b)); }

const CASCADE_MAX_DEPTH = 3;
const CASCADE_ATTEN = [null, 1.0, 0.7, 0.49];

function propagatePlanetaryCascade(region, regionalResult, scenarioSim){
  const domainScores = {};
  regionalResult.domains.forEach(d=>{ domainScores[d.k]=clamp01(d.v/100); });
  const vulnerability = nodeVulnerability(region, scenarioSim || {});
  const nodeImpact = {};
  const contributions = {};
  const usedEdges = new Set();
  let frontier = Object.keys(domainScores).map(k=>({id:k, impact:domainScores[k]}));
  let depthReached = 0;

  for(let depth=1; depth<=CASCADE_MAX_DEPTH; depth++){
    const thisDepthTargets = {};
    let firedAny=false;
    GRAPH_EDGES.forEach(e=>{
      if(e.target==="cross_region") return;
      if(usedEdges.has(e.id)) return;
      const src = frontier.find(f=>f.id===e.source);
      if(!src) return;
      const vuln = vulnerability[e.target] ?? 0.5;
      const atten = CASCADE_ATTEN[depth];
      const impact = clamp01(src.impact * e.strength * vuln * atten);
      contributions[e.target] = contributions[e.target] || [];
      contributions[e.target].push({ edgeId:e.id, source:e.source,
        sourceLabel: DOMAIN_LABEL[e.source] || (NODE_BY_ID[e.source]&&NODE_BY_ID[e.source].nm) || e.source,
        depth, impact, strength:e.strength, evidenceType:e.evidenceType, confidence:e.confidence,
        explanation:e.explanation, sourceReference:e.sourceReference });
      usedEdges.add(e.id);
      firedAny=true;
      thisDepthTargets[e.target] = combineNoisyOr(thisDepthTargets[e.target]||0, impact);
    });
    if(!firedAny) break;
    Object.entries(thisDepthTargets).forEach(([nid,val])=>{
      nodeImpact[nid] = combineNoisyOr(nodeImpact[nid]||0, val);
    });
    depthReached = depth;
    frontier = Object.entries(thisDepthTargets).map(([id])=>({id, impact: nodeImpact[id]}));
    if(!frontier.length) break;
  }

  const dispEdge = edgeById("e13");
  const affectedRegions = [];
  // spilloverStatus: "documented" = a named destination with a documented connection;
  // "possible" = displacement pressure is elevated but EarthShield has no documented
  // connection dataset entry for this origin, so no destination is asserted;
  // "none" = displacement pressure is not elevated enough to model spillover at all.
  // Each documented REGION_CONNECTION carries its own sourceDomain (the regional risk
  // domain that actually drives that specific channel, e.g. "storm" for a shared storm
  // basin, "res" for a shared energy corridor, "disp" for a migration corridor). Using
  // the connection's real sourceDomain, rather than always Human Displacement, means the
  // "Source pressure" shown for a documented spillover reflects what actually drives it.
  // The transfer factor (dispEdge.strength = 0.40) is reused as a common, transparent
  // cross-region transfer factor for every connection type so this does not change the
  // overall GCP scale.
  let spilloverStatus = "none";
  if(dispEdge){
    const conns = regionConnectionsFor(region.id);
    conns.forEach(cn=>{
      const target = REGIONS.find(r=>r.id===cn.target);
      if(!target) return;
      const sourceScore = domainScores[cn.sourceDomain] ?? 0;
      const impact = clamp01(sourceScore * dispEdge.strength * CASCADE_ATTEN[1] * cn.strength);
      if(impact>0.02){
        affectedRegions.push({ id:target.id, name:target.name, impact:+impact.toFixed(3),
          connectionType:cn.connectionType, confidence:cn.confidence, evidenceType:cn.evidenceType,
          explanation:cn.explanation, sourceReference:cn.sourceReference,
          sourceDomain:cn.sourceDomain, sourceDomainLabel: DOMAIN_LABEL[cn.sourceDomain] || cn.sourceDomain });
      }
    });
    if(affectedRegions.length){
      spilloverStatus = "documented";
    } else if(domainScores.disp!=null && domainScores.disp>=0.45){
      spilloverStatus = "possible";
    }
  }

  const paths = [];
  function dfs(nodeOrDomainId, sourceImpact, chain, depth, usedInPath){
    if(depth>CASCADE_MAX_DEPTH){ paths.push(chain); return; }
    const outgoing = GRAPH_EDGES.filter(e=>e.source===nodeOrDomainId && e.target!=="cross_region" && !usedInPath.has(e.id));
    if(!outgoing.length){ paths.push(chain); return; }
    outgoing.forEach(e=>{
      const vuln = vulnerability[e.target] ?? 0.5;
      const val = clamp01(sourceImpact * e.strength * vuln * CASCADE_ATTEN[depth]);
      dfs(e.target, val, [...chain, {edgeId:e.id, from:e.source, to:e.target, value:val}], depth+1, new Set([...usedInPath, e.id]));
    });
  }
  Object.keys(domainScores).forEach(k=>{ if(domainScores[k]>0) dfs(k, domainScores[k], [], 1, new Set()); });
  let strongestPath = null, strongestVal = -1;
  paths.forEach(chain=>{
    if(!chain.length) return;
    const endVal = chain[chain.length-1].value;
    if(endVal>strongestVal){ strongestVal=endVal; strongestPath=chain; }
  });
  const strongestPathLabels = strongestPath ? [
    DOMAIN_LABEL[strongestPath[0].from] || strongestPath[0].from,
    ...strongestPath.map(h=> (NODE_BY_ID[h.to]&&NODE_BY_ID[h.to].nm) || h.to)
  ] : [];

  // Material-impact threshold: calibrated against baseline propagation output across
  // all 8 regions. A low threshold (~0.05-0.10) left 6-8 of 8 nodes "affected" for most
  // regions, which failed to differentiate regions and made the cascade view noisy.
  // 0.20 yields a realistic 4-6 material systems per region while still surfacing every
  // node that clears a "secondary modeled signal" floor of 0.08 for transparency.
  const MATERIAL_IMPACT_THRESHOLD = 0.20;
  const SECONDARY_IMPACT_THRESHOLD = 0.08;
  const nodeImpactSorted = Object.entries(nodeImpact)
    .map(([id,v])=>({ id, nm:NODE_BY_ID[id].nm, category:NODE_BY_ID[id].category,
      criticality:NODE_BY_ID[id].criticality, impact:+ (v*100).toFixed(1), raw:v }))
    .sort((a,b)=>b.impact-a.impact);
  const affectedNodes = nodeImpactSorted.filter(n=>n.raw>MATERIAL_IMPACT_THRESHOLD);
  const secondaryNodes = nodeImpactSorted.filter(n=>n.raw>SECONDARY_IMPACT_THRESHOLD && n.raw<=MATERIAL_IMPACT_THRESHOLD);

  const intensityNum = affectedNodes.reduce((s,n)=> s + (n.impact/100)*n.criticality, 0);
  const intensityDen = affectedNodes.reduce((s,n)=> s + n.criticality, 0);
  const intensityScore = intensityDen>0 ? intensityNum/intensityDen : 0;
  const systemsScore = affectedNodes.length / GRAPH_NODES.length;
  const criticalityScore = affectedNodes.length ? affectedNodes.reduce((s,n)=>s+n.criticality,0)/affectedNodes.length : 0;
  const regionsScore = Math.min(1, affectedRegions.length / (REGIONS.length-1));
  const strongestPathValue = clamp01(strongestVal<0?0:strongestVal);
  let confNum=0, confDen=0;
  const confWeight = {"evidence-based":1.0, "modeled-proxy":0.6, "scenario-assumption":0.25};
  Object.values(contributions).flat().forEach(c=>{ confNum += c.impact*confWeight[c.evidenceType]; confDen += c.impact; });
  const confidenceScore = confDen>0 ? clamp01(confNum/confDen) : 0.5;
  const confidenceFactor = 0.85 + 0.15*confidenceScore;

  const W = { intensity:.30, systems:.20, criticality:.15, regions:.15, strongestPath:.20 };
  const rawWeighted = W.intensity*intensityScore + W.systems*systemsScore + W.criticality*criticalityScore
    + W.regions*regionsScore + W.strongestPath*strongestPathValue;
  const gcp = Math.round(clamp01(rawWeighted) * confidenceFactor * 100);

  const assumptions = [];
  Object.values(contributions).flat().forEach(c=>{
    if(c.evidenceType!=="evidence-based") assumptions.push(c.sourceLabel+" -> "+c.explanation);
  });
  if(affectedRegions.length) assumptions.push("Cross-region spillover is limited to EarthShield's documented connection dataset (REGION_CONNECTIONS); it is a modeled proxy, not a measured regional transmission channel.");

  return {
    gcp: clamp(gcp,0,100),
    band: gcpBand(gcp),
    depthReached,
    affectedNodes,
    secondaryNodes,
    affectedRegions,
    spilloverStatus,
    strongestPath: strongestPath ? { chain:strongestPath, labels:strongestPathLabels, value:+(strongestPathValue*100).toFixed(1) } : null,
    contributions,
    confidence: confidenceScore>=0.75?"High":confidenceScore>=0.45?"Moderate":"Low",
    confidenceScore:+confidenceScore.toFixed(2),
    formula:{ weights:W, intensityScore:+intensityScore.toFixed(3), systemsScore:+systemsScore.toFixed(3),
      criticalityScore:+criticalityScore.toFixed(3), regionsScore:+regionsScore.toFixed(3),
      strongestPathValue:+strongestPathValue.toFixed(3), rawWeighted:+rawWeighted.toFixed(3), confidenceFactor:+confidenceFactor.toFixed(3) },
    assumptions:[...new Set(assumptions)].slice(0,6),
  };
}
function gcpBand(v){
  if(v>=75) return {t:"Systemic", c:"--red", d:"Model shows broad propagation across highly connected systems."};
  if(v>=55) return {t:"Spreading", c:"--amber", d:"Model shows propagation across several connected systems."};
  if(v>=30) return {t:"Emerging", c:"--violet", d:"Model shows initial propagation into connected systems."};
  return {t:"Contained", c:"--aqua", d:"Model shows limited propagation beyond the region."};
}

/* =========================================================
   SHARED VALIDATOR for the AI Cascade Strategist's structured
   output. The SAME logic runs server-side (netlify/functions/
   ai-strategist.js, authoritative) and client-side (Validation
   tab, so the rule can be exercised and shown passing/failing
   against synthetic fixtures without a network call). Pure
   function, no dependencies, deliberately duplicated rather
   than imported so the Netlify function has no build step.
   ========================================================= */
function validateStrategistResponse(candidates, resp, requiredActionKeys){
  const errors = [];
  const push = (m)=>errors.push(m);
  if(!resp || typeof resp!=="object") return {valid:false, errors:["response is not an object"]};

  const NUMERIC_BAN_KEYS = ["score","regionalstress","cascadescore","globalcascade","gcp","confidencescore","regionalstressscore"];
  const scanForBannedNumbers = (obj, path)=>{
    if(obj==null) return;
    if(typeof obj==="number"){
      const leaf = path.split(".").pop().toLowerCase();
      if(NUMERIC_BAN_KEYS.some(k=>leaf.includes(k))) push(`numeric score field not allowed from AI: ${path}`);
      return;
    }
    if(Array.isArray(obj)){ obj.forEach((v,i)=>scanForBannedNumbers(v, `${path}[${i}]`)); return; }
    if(typeof obj==="object"){ Object.entries(obj).forEach(([k,v])=>scanForBannedNumbers(v, path?`${path}.${k}`:k)); }
  };
  scanForBannedNumbers(resp, "");

  const cand = (candidates||[]).find(c=>c.id===resp.selectedCandidateId);
  if(!cand) push(`selectedCandidateId "${resp.selectedCandidateId}" is not an approved candidate`);
  // Defense in depth: required interventions are HARD requirements. Approved candidates are
  // already filtered to satisfy them (generateInterventionCandidates), but this check is
  // kept so the rule is never enforced by candidate-list construction alone.
  if(cand && Array.isArray(requiredActionKeys) && requiredActionKeys.length){
    const missing = requiredActionKeys.filter(k=>!cand.interventionKeys.includes(k));
    if(missing.length) push(`selected candidate is missing required intervention(s): ${missing.join(", ")}`);
  }

  if(!Array.isArray(resp.interventions) || resp.interventions.length!==3){
    push("interventions must contain exactly 3 items");
  } else {
    const ids = resp.interventions.map(i=>i.actionId).slice().sort();
    if(cand){
      const candIds = cand.interventionKeys.slice().sort();
      if(JSON.stringify(ids)!==JSON.stringify(candIds)) push("intervention ids do not match the selected candidate");
    }
    const priorities = resp.interventions.map(i=>i.priority).slice().sort();
    if(JSON.stringify(priorities)!==JSON.stringify([1,2,3])) push("priorities must be exactly 1, 2 and 3");
    resp.interventions.forEach((iv,idx)=>{
      ["whySelected","firstStep","responsibleStakeholder","localBenefit","planetaryBenefit","tradeoff"].forEach(f=>{
        if(iv[f]!=null && String(iv[f]).length>320) push(`interventions[${idx}].${f} exceeds length limit`);
      });
    });
  }

  if(resp.strategySummary!=null && String(resp.strategySummary).length>800) push("strategySummary exceeds length limit");
  if(resp.limitations){
    if(!Array.isArray(resp.limitations)) push("limitations must be an array");
    else resp.limitations.forEach((l,i)=>{ if(String(l).length>250) push(`limitations[${i}] exceeds length limit`); });
  }
  if(resp.roadmap){
    ["immediate","shortTerm","longTerm"].forEach(k=>{
      const arr = resp.roadmap[k];
      if(arr && !Array.isArray(arr)) push(`roadmap.${k} must be an array`);
      else if(arr) arr.forEach((s,i)=>{ if(String(s).length>200) push(`roadmap.${k}[${i}] exceeds length limit`); });
    });
  }
  if(resp.confidence!=null && !["high","moderate","low"].includes(String(resp.confidence).toLowerCase())){
    push("confidence must be high, moderate or low");
  }
  if(Array.isArray(resp.monitoringIndicators)){
    resp.monitoringIndicators.forEach((m,i)=>{
      if(m.name && String(m.name).length>80) push(`monitoringIndicators[${i}].name exceeds length limit`);
      if(m.availability && !["available","unavailable","partial"].includes(String(m.availability).toLowerCase())){
        push(`monitoringIndicators[${i}].availability is not a recognized value`);
      }
    });
  }
  if(resp.criticalInterventionPoint){
    if(resp.criticalInterventionPoint.reason!=null && String(resp.criticalInterventionPoint.reason).length>400){
      push("criticalInterventionPoint.reason exceeds length limit");
    }
  }

  return { valid: errors.length===0, errors };
}

/* Rerun BOTH models for a single intervention: regional (computeRisks) and planetary
   (propagatePlanetaryCascade). The planetary reduction is never assigned without this
   rerun, and pathwaysInterrupted is derived from actual edge-contribution deltas, not
   asserted. */
function pathwaysInterrupted(baseProp, afterProp){
  const baseByEdge = {}; Object.values(baseProp.contributions).flat().forEach(c=>{ baseByEdge[c.edgeId]=c; });
  const afterByEdge = {}; Object.values(afterProp.contributions).flat().forEach(c=>{ afterByEdge[c.edgeId]=c; });
  const interrupted = [];
  Object.entries(baseByEdge).forEach(([eid,c])=>{
    if(c.impact<0.03) return;
    const afterC = afterByEdge[eid];
    const afterImpact = afterC ? afterC.impact : 0;
    if(afterImpact <= c.impact*0.85){
      const e = edgeById(eid);
      const targetNm = NODE_BY_ID[e.target] ? NODE_BY_ID[e.target].nm : e.target;
      interrupted.push(`${c.sourceLabel} → ${targetNm}`);
    }
  });
  return interrupted;
}

function mitigations(reg, live, scenarioSim=null){
  // Scenario-aware: when a Simulator scenario is active, every intervention is merged ON
  // TOP OF the scenario's counterfactual (not in place of it), then the full model is
  // rerun, so reductions are always relative to the scenario state, matching the exact
  // merge pattern used in generateInterventionCandidates().
  const base = computeRisks(reg, live, scenarioSim);
  const baseR = base.cascade;
  const baseProp = propagatePlanetaryCascade(reg, base, scenarioSim);
  const acts = mitigationActions();
  const scored = acts.map(a=>{
    const merged = { ...(scenarioSim||{}) };
    Object.entries(a.sim).forEach(([k,v])=>{ merged[k]=(merged[k]||0)+v; });
    const after = computeRisks(reg, live, merged);
    const afterProp = propagatePlanetaryCascade(reg, after, merged);
    const red = Math.max(0, Math.round(baseR - after.cascade));
    const gcpRed = Math.max(0, Math.round(baseProp.gcp - afterProp.gcp));
    return { ...a, baseR, afterR:after.cascade, red,
      baseGcp:baseProp.gcp, afterGcp:afterProp.gcp, gcpRed,
      pathwaysInterruptedList: pathwaysInterrupted(baseProp, afterProp),
      relevanceTxt:a.relevance(reg),
      planetaryRelevanceTxt: afterProp.affectedNodes.length < baseProp.affectedNodes.length ? "High" : (gcpRed>0?"Moderate":"Low") };
  }).sort((x,y)=>y.red-x.red);
  return {baseR, baseGcp:baseProp.gcp, list:scored};
}


/* =========================================================
   VERIFIED DETERMINISTIC INTERVENTION CANDIDATES.
   Deterministic optimization, NOT AI, NOT an agentic search,
   NOT machine learning. A constrained combinatorial ranking
   over the 35 possible exactly-3-intervention bundles: filter
   by budget, score by objective/location/horizon fit and by
   the REAL rerun regional + planetary reduction, then return
   up to five diverse, fully verified candidates. Every number
   attached to a candidate comes from computeRisks() and
   propagatePlanetaryCascade() run on the MERGED bundle, never
   from summing each intervention's individual effect.
   ========================================================= */
const BUDGET_CAP = { "Limited":5, "Moderate":8, "Significant":9 };
const OBJECTIVE_TAG = {
  "Reduce Global Cascade Potential": "reduce_gcp",
  "Protect vulnerable populations": "protect_vulnerable",
  "Protect food and water systems": "protect_food_water",
  "Protect critical infrastructure": "protect_infrastructure",
  "Protect ecosystems": "protect_ecosystems",
  "Reduce energy and resource pressure": "reduce_resource",
  "Balanced strategy": null,
};
const LOCATION_TAG = {
  "Origin region": "origin", "Downstream system": "downstream",
  "Cross-region coordination": "cross-region", "No preference": null,
};
const HORIZON_FIT = {
  "Immediate":  { Months:1.0, Years:0.25 },
  "Short term": { Months:1.0, Years:0.55 },
  "Medium term":{ Months:0.80, Years:1.0 },
  "Long term":  { Months:0.55, Years:1.0 },
};

function combos3(arr){
  const out=[];
  for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++) for(let k=j+1;k<arr.length;k++)
    out.push([arr[i],arr[j],arr[k]]);
  return out;
}

function generateInterventionCandidates(opts){
  const { region, live, budget="Moderate", objective="Balanced strategy",
    horizon="Medium term", location="No preference", scenarioSim=null, requiredActionKeys=[] } = opts||{};
  const acts = mitigationActions();
  const validKeys = new Set(acts.map(a=>a.key));
  // Sanitize: unique, valid, max 3. Required actions are HARD requirements, not soft
  // ranking preferences -- a combo that does not contain every required key is dropped
  // before scoring, never merely down-ranked.
  const reqKeys = [...new Set((requiredActionKeys||[]).filter(k=>validKeys.has(k)))].slice(0,3);
  const base = computeRisks(region, live, scenarioSim);
  const baseR = base.cascade;
  const baseProp = propagatePlanetaryCascade(region, base, scenarioSim);
  const budgetCap = BUDGET_CAP[budget] ?? BUDGET_CAP.Moderate;
  const objTag = OBJECTIVE_TAG[objective] ?? null;
  const locTag = LOCATION_TAG[location] ?? null;
  const horizonMap = HORIZON_FIT[horizon] || HORIZON_FIT["Medium term"];

  const raw = combos3(acts).map((combo, idx)=>{
    if(reqKeys.length && !reqKeys.every(key=>combo.some(a=>a.key===key))) return null;
    const cost = combo.reduce((s,a)=>s+a.costW,0);
    if(cost>budgetCap) return null;
    const merged={ ...(scenarioSim||{}) };
    combo.forEach(a=>{ Object.entries(a.sim).forEach(([k,v])=>{ merged[k]=(merged[k]||0)+v; }); });
    const after = computeRisks(region, live, merged);
    const afterProp = propagatePlanetaryCascade(region, after, merged);
    const regionalRed = Math.max(0, baseR - after.cascade);
    const gcpRed = Math.max(0, baseProp.gcp - afterProp.gcp);
    const regionalRedNorm = clamp01(regionalRed/40);
    const gcpRedNorm = clamp01(gcpRed/40);
    const objMatch = objTag ? combo.filter(a=>a.objectiveTags.includes(objTag)).length : 0;
    const objBoost = objTag ? (objMatch/3)*0.35 : 0;
    const locMatch = locTag ? combo.filter(a=>a.locationTags.includes(locTag)).length : 0;
    const locBoost = locTag ? (locMatch/3)*0.15 : 0;
    const horizonFitAvg = combo.reduce((s,a)=>s+(horizonMap[a.time]??0.5),0)/3;
    // redundancy: fraction of domain-name overlap across the 3 actions (encourages diverse coverage)
    const allDomains = combo.flatMap(a=>a.domains);
    const uniqueDomains = new Set(allDomains);
    const redundancy = 1 - (uniqueDomains.size/allDomains.length);
    // relevanceScore: ties each action's existing region-specific relevance() rating
    // (already derived from this region's baseline indices, e.g. b.coastExp, b.forest)
    // into the ranking itself, not just the display text. High relevance = 1.0,
    // Moderate = 0.5, averaged across the 3 actions in the bundle. Without this term
    // the ranking ignored regional baseline differences entirely and could surface the
    // same top bundle for every region regardless of that region's actual exposure profile.
    const relevanceScore = combo.reduce((s,a)=>s+(a.relevance(region)==="High"?1.0:0.5),0)/3;
    const compositeScore = 0.25*regionalRedNorm + 0.25*gcpRedNorm + objBoost + locBoost
      + 0.15*horizonFitAvg + 0.20*relevanceScore - 0.15*redundancy;
    const pathways = pathwaysInterrupted(baseProp, afterProp);
    return {
      id: `portfolio_${String(idx).padStart(2,"0")}`,
      interventionKeys: combo.map(a=>a.key),
      interventionNames: combo.map(a=>a.nm),
      cost, compositeScore:+compositeScore.toFixed(4), relevanceScore:+relevanceScore.toFixed(2),
      regionalStressBefore: baseR, regionalStressAfter: after.cascade, regionalReduction: Math.round(regionalRed),
      gcpBefore: baseProp.gcp, gcpAfter: afterProp.gcp, gcpReduction: Math.round(gcpRed),
      systemsImprovedCount: Math.max(0, baseProp.affectedNodes.length - afterProp.affectedNodes.length),
      pathwaysInterrupted: pathways,
      objectiveMatch: objMatch, locationMatch: locMatch, horizonFitAvg:+horizonFitAvg.toFixed(2),
      domainsImproved: [...uniqueDomains],
    };
  }).filter(Boolean);

  raw.sort((a,b)=>b.compositeScore-a.compositeScore);

  // greedy diversity pick: skip near-duplicate combos (2+ shared interventions with an already-picked one)
  const picked = [];
  for(const cand of raw){
    const tooSimilar = picked.some(p=>{
      const overlap = p.interventionKeys.filter(k=>cand.interventionKeys.includes(k)).length;
      return overlap>=2;
    });
    if(!tooSimilar) picked.push(cand);
    if(picked.length>=5) break;
  }
  // if diversity filtering left us short, top up from the remaining ranked list
  if(picked.length<5){
    for(const cand of raw){
      if(picked.length>=5) break;
      if(!picked.includes(cand)) picked.push(cand);
    }
  }

  return { baseR, baseGcp: baseProp.gcp, budgetCap, objTag, locTag, requiredActionKeys: reqKeys, candidates: picked };
}

/* ---------------------------------------------------------
   NON-AI FALLBACK. Same verified candidates, template text.
   Works with zero network calls, used automatically whenever
   the Gemini path is unavailable or fails validation.
   --------------------------------------------------------- */
function generateInstantCascadeStrategy(candResult, prefs){
  const { candidates } = candResult;
  if(!candidates || !candidates.length) return null;
  // Highest-ranked feasible portfolio by compositeScore, for the currently selected region.
  const chosen = candidates[0];
  const acts = mitigationActions();
  const byKey = Object.fromEntries(acts.map(a=>[a.key,a]));
  const interventions = chosen.interventionKeys.map((key,i)=>{
    const a = byKey[key];
    return {
      actionId:key, priority:i+1,
      whySelected:`Ranked by verified regional and planetary reduction under the ${prefs.budget||"selected"} budget and ${prefs.horizon||"selected"} horizon.`,
      firstStep:a.method,
      responsibleStakeholder: prefs.decisionMaker || "Regional government",
      localBenefit:a.why,
      planetaryBenefit:a.planetaryNarrative,
      tradeoff:a.limits,
    };
  });
  const roadmap = {immediate:[], shortTerm:[], longTerm:[]};
  chosen.interventionKeys.forEach(key=>{
    const a=byKey[key];
    if(a.time==="Months") roadmap.immediate.push(a.nm); else roadmap.longTerm.push(a.nm);
  });
  if(!roadmap.shortTerm.length) roadmap.shortTerm.push("Monitor verified Regional Stress Score and Global Cascade Potential after the immediate steps land.");
  const pathwayReason = chosen.pathwaysInterrupted.length
    ? `This bundle interrupts ${chosen.pathwaysInterrupted.length} planetary pathway(s), most notably ${chosen.pathwaysInterrupted[0]}.`
    : (chosen.gcpReduction>0
        ? `This bundle lowers Global Cascade Potential by ${chosen.gcpReduction} points primarily by reducing regional vulnerability, not by fully interrupting a specific planetary pathway.`
        : `This bundle is the highest-ranked feasible option under your current constraints, but at this pressure level it does not measurably interrupt a planetary pathway or reduce Global Cascade Potential.`);
  return {
    selectedCandidateId: chosen.id,
    strategySummary:`Instant Rule-Based Strategy: this bundle was the highest-ranked feasible portfolio under your constraints, verified to reduce the Regional Stress Score by ${chosen.regionalReduction} points and Global Cascade Potential by ${chosen.gcpReduction} points.`,
    criticalInterventionPoint:{ nodeId: chosen.pathwaysInterrupted[0]||"n/a", reason: pathwayReason },
    interventions,
    roadmap,
    monitoringIndicators:[
      {name:"Regional Stress Score", availability:"available"},
      {name:"Global Cascade Potential", availability:"available"},
      {name:"Affected planetary systems count", availability:"available"},
    ],
    confidence: chosen.gcpReduction>0 ? "moderate" : "low",
    limitations:[
      "Generated by EarthShield's deterministic ranking rules, not a generative model.",
      "Sequencing follows the fixed order returned by the optimizer, not a context-aware judgment.",
      "Does not account for local political, budgetary or permitting constraints beyond the selected budget tier.",
    ],
    isInstant:true,
  };
}

/* =========================================================
   UNCERTAINTY, model-disagreement early warning.
   We perturb key inputs (±) and measure cascade spread.
   ========================================================= */
function uncertainty(reg, live){
  const baseline = computeRisks(reg, live, null).cascade;
  // Test each assumption independently, in both directions where appropriate.
  // Impact = max score change that assumption produces vs baseline.
  const tests = [
    { key:"sst",      label:"Sea temperature difference from baseline", glossaryKey:"sstAnomaly", deltas:[{sst:0.4},{sst:-0.4}] },
    { key:"energy",   label:"Energy demand",            glossaryKey:null, deltas:[{energy:10},{energy:-10}] },
    { key:"dataCtr",  label:"AI data center load",      glossaryKey:"dataCenterLoad", deltas:[{dataCtr:12},{dataCtr:-12}] },
    { key:"forest",   label:"Additional forest loss",              glossaryKey:null, deltas:[{forest:8},{forest:-8}] },
    { key:"coastPop", label:"Coastal population",       glossaryKey:null, deltas:[{coastPop:8},{coastPop:-8}] },
    { key:"industry", label:"Regional resource pressure", glossaryKey:"resourceStress", deltas:[{industrialPollution:10},{industrialPollution:-10}] },
  ];
  let minimum=baseline, maximum=baseline;
  const driverImpacts = tests.map(t=>{
    let lo=baseline, hi=baseline;
    t.deltas.forEach(d=>{
      const v=computeRisks(reg, live, d).cascade;
      lo=Math.min(lo,v); hi=Math.max(hi,v);
    });
    minimum=Math.min(minimum,lo); maximum=Math.max(maximum,hi);
    return { key:t.key, label:t.label, glossaryKey:t.glossaryKey, impact:Math.max(hi-baseline, baseline-lo), lo, hi };
  }).sort((a,b)=>b.impact-a.impact);

  const spread = maximum - minimum;
  const confidence = spread<=4 ? "High confidence"
                   : spread<=9 ? "Moderate confidence"
                   : "Assumption-sensitive";
  const largest = driverImpacts[0];
  return {
    baseline, minimum, maximum, spread, confidence,
    largestUncertaintyDriver: largest.label,
    largestUncertaintyGlossaryKey: largest.glossaryKey,
    largestImpact: largest.impact,
    driverImpacts,
    // legacy flag kept for the overview card: sensitive when spread >= 10
    disagree: spread>=10
  };
}

function ringSVG(score, opts){
  opts = opts || {};
  const bandFn = opts.bandFn || band;
  const label = opts.label || "Regional Stress";
  const size = opts.size || 132, r = size/2 - 14;
  const band_=bandFn(score), C=2*Math.PI*r, off=C*(1-score/100);
  return `<div class="cascade-ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${cv('--line')}" stroke-width="9" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${cv(band_.c)}" stroke-width="9" fill="none"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
        style="transition:stroke-dashoffset 1s cubic-bezier(.4,1.2,.5,1)"/>
    </svg>
    <div class="ctr"><div class="num" style="color:${cv(band_.c)}">${score}</div>
      <div class="lbl">${label}</div></div>

}

function scoreDeltaInterpretation(metricLabel, delta, context){
  // context: "scenario" (Simulator) or "strategy" (AI Strategist). Shared wording so the same
  // metric change reads the same way everywhere it appears (Simulator, AI Strategist, Cascade
  // scenario-impact panel).
  const under = context==="strategy" ? "the selected strategy" : "this scenario";
  if(delta===0) return `No meaningful change in ${metricLabel} under ${under}.`;
  const verb = context==="strategy" ? (delta>0?"increases":"decreases") : (delta>0?"increased":"decreased");
  const prefix = context==="strategy" ? "Verified " : "";
  const label = prefix ? metricLabel : (metricLabel.charAt(0).toUpperCase()+metricLabel.slice(1));
  return `${prefix}${label} ${verb} under ${under}.`;
}

function scoreCompareCard(opts){
  // The single shared "result" score component used by Overview, Simulator, and AI Strategist:
  // one ring for the RESULTING score (never two rings for the same metric), plus a compact
  // baseline -> result -> delta row underneath, using the same semantic delta colors everywhere
  // (reduction/improvement = aqua, increase/worsening = amber or red by severity, no change =
  // muted). Always shows the numeric +/- delta, never relies on color alone.
  const bandFn = opts.bandFn || band;
  const b = bandFn(opts.resultScore);
  const delta = opts.resultScore - opts.baselineScore;
  const magnitude = Math.abs(delta);
  const deltaCol = delta===0 ? "var(--muted)" : delta<0 ? "var(--aqua)" : (magnitude>=10 ? "var(--red)" : "var(--amber)");
  const deltaTxt = delta===0 ? "\u00B10" : (delta>0?`+${delta}`:`${delta}`);
  return `<div class="score-block">
    ${ringSVG(opts.resultScore, {label:opts.label, bandFn, size:opts.size||96})}
    <div style="min-width:0;flex:1">
      <div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">${opts.label}${opts.help?opts.help:""}</div>
      <div style="font-family:'Space Grotesk';font-size:13.5px;font-weight:600;color:${cv(b.c)};margin-top:5px">${b.t}</div>
      <div class="score-sub mono" style="margin-top:4px;font-size:11.5px">
        ${opts.baselineLabel||"Baseline"} ${opts.baselineScore} <span style="color:var(--muted2)">\u2192</span>
        ${opts.resultLabel||"Result"} ${opts.resultScore}
        <b style="color:${deltaCol};margin-left:6px">${deltaTxt}</b>
      </div>
      ${opts.interpretation?`<div class="score-sub" style="margin-top:4px">${opts.interpretation}</div>`:""}
    </div>
  </div>`;
}

/* ---- the signature cascade chain diagram ---- */
function cascadeGraphData(R){
  // Shared node/link definitions for the regional cascade diagram (cascadeDiagram) and its
  // plain-language summary (cascadeWhatThisMeans), so the two views can never drift apart.
  // Column 1: drivers/inputs.  Column 2: system stress.  Column 3: outcomes.
  const g=k=>R.domains.find(d=>d.k===k).v;
  const drivers=[
    {id:"sst",     nm:"Ocean Warming", v:Math.round(clamp(34+R.inputs.sstAnom*26)), c:"--aqua"},
    {id:"aien",    nm:"AI + Energy",   v:g("ai"),  c:"--amber"},
    {id:"forest",  nm:"Forest-Cover Pressure",   v:Math.round(R.inputs.forestLoss*100), c:"--green"},
    {id:"industry",nm:"Industry",      v:Math.round(R.inputs.industry*100), c:"--amber"},
  ];
  const mid=[
    {id:"ocean", nm:"Ocean Heat",    v:g("ocean"), c:"--aqua"},
    {id:"res",   nm:"Resource Stress",v:g("res"),  c:"--amber"},
  ];
  const out=[
    {id:"storm", nm:"Storm Intensity",v:g("storm"), c:"--red"},
    {id:"food",  nm:"Food & Water",   v:g("food"),  c:"--violet"},
    {id:"biodiv",nm:"Biodiversity",   v:g("biodiv"),c:"--green"},
    {id:"disp",  nm:"Displacement",   v:g("disp"),  c:"--red"},
  ];
  // LINKS: each corresponds to a term actually present in computeRisks().
  //  sst->ocean (oceanHeat=f(sstAnom)); sst->storm & ocean->storm (stormInt=f(oceanHeat,ingredients));
  //  sst->food & forest->food (foodWater=f(sstAnom,forestLoss)); sst->biodiv & industry->biodiv;
  //  aien->res, forest->res, industry->res (resourceStress); storm->disp (displacement=f(stormInt)).
  const links=[
    ["sst","ocean"],["sst","storm"],["sst","food"],["sst","biodiv"],
    ["ocean","storm"],
    ["forest","food"],["forest","res"],
    ["industry","biodiv"],["industry","res"],
    ["aien","res"],
    ["storm","disp"],
  ];
  const byId={}; [...drivers,...mid,...out].forEach(n=>byId[n.id]=n);
  return {drivers, mid, out, links, byId};
}

function cascadeDiagram(R){
  const {drivers, mid, out, links, byId} = cascadeGraphData(R);
  const narrow = (typeof window!=="undefined" && window.innerWidth<=560);
  const W = narrow?440:680, H = narrow?420:340;
  const x1 = narrow?62:74, x2 = narrow?220:320, x3 = narrow?378:600;
  const yPos=(arr,i)=>{ const gap=H/(arr.length+1); return gap*(i+1); };
  const pos={};
  drivers.forEach((n,i)=>pos[n.id]={x:x1,y:yPos(drivers,i),...n});
  mid.forEach((n,i)=>pos[n.id]={x:x2,y:yPos(mid,i),...n});
  out.forEach((n,i)=>pos[n.id]={x:x3,y:yPos(out,i),...n});

  let path="";
  links.forEach(([a,b])=>{
    const A=pos[a],B=pos[b]; if(!A||!B) return;
    const inten=(A.v+B.v)/2;
    const wd=1+inten/22, op=.18+inten/180;
    const col=inten>=66?"--red":inten>=48?"--amber":"--aqua";
    const marker=col==="--red"?"cascArrowRed":col==="--amber"?"cascArrowAmber":"cascArrowAqua";
    const mx=(A.x+B.x)/2;
    path+=`<path d="M${A.x+8} ${A.y} C ${mx} ${A.y}, ${mx} ${B.y}, ${B.x-14} ${B.y}"
      stroke="${cv(col)}" stroke-width="${wd.toFixed(1)}" fill="none" opacity="${op.toFixed(2)}"
      stroke-linecap="round" marker-end="url(#${marker})"/>`;
  });
  let nodes="";
  const rMax = narrow?10:14, rDiv = narrow?13:10, fNode = narrow?9:10.5;
  [...drivers,...mid,...out].forEach(n=>{
    const p=pos[n.id], col=cv(n.c), r=rMax+n.v/rDiv;
    nodes+=`<g>
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${col}1a" stroke="${col}" stroke-width="1.6"/>
      <circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${col}"/>
      <text x="${p.x}" y="${p.y-r-7}" text-anchor="middle" fill="${cv('--txt')}"
        font-size="${fNode}" font-weight="600" font-family="Space Grotesk">${n.nm}</text>
      <text x="${p.x}" y="${p.y+r+15}" text-anchor="middle" fill="${col}"
        font-size="${fNode}" font-weight="700" font-family="JetBrains Mono">${n.v}</text>
    </g>`;
  });
  const colLbl=(x,t)=>`<text x="${x}" y="20" text-anchor="middle" fill="${cv('--muted')}"
    font-size="${narrow?8.5:10}" font-weight="600" letter-spacing="${narrow?.6:1.4}" font-family="Space Grotesk">${t}</text>`;
  const arrowDefs=`<defs>
    <marker id="cascArrowAqua" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${cv('--aqua')}"/></marker>
    <marker id="cascArrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${cv('--amber')}"/></marker>
    <marker id="cascArrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${cv('--red')}"/></marker>
  </defs>`;
  return `<svg id="cascadeSVG" viewBox="0 0 ${W} ${H}" width="100%">
    ${arrowDefs}
    ${colLbl(x1,"DRIVERS")}${colLbl(x2,"SYSTEM STRESS")}${colLbl(x3,"CASCADING OUTCOME")}
    ${path}${nodes}</svg>`;
}

function cascadeWhatThisMeans(R){
  // Plain-language read-out of the same drivers/links/outcomes cascadeDiagram renders (via the
  // shared cascadeGraphData(R)), so the three summary values below always match the diagram.
  const {drivers, out, links, byId} = cascadeGraphData(R);
  const topDriver = [...drivers].sort((a,b)=>b.v-a.v)[0];
  const topOutcome = [...out].sort((a,b)=>b.v-a.v)[0];
  let bestLink=null, bestInten=-1;
  links.forEach(([a,b])=>{
    const A=byId[a], B=byId[b]; if(!A||!B) return;
    const inten=(A.v+B.v)/2;
    if(inten>bestInten){ bestInten=inten; bestLink={A,B}; }
  });
  const strength = bestInten>=66?"High":bestInten>=48?"Moderate":"Lower";
  const strengthCol = bestInten>=66?"--red":bestInten>=48?"--amber":"--aqua";
  const ICON_BG = {"--aqua":"rgba(72,208,174,.16)", "--violet":"rgba(156,167,232,.16)",

  const icLink = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 15l6-6M8 17l-3-3a4 4 0 010-5.7l2-2a4 4 0 015.7 0M16 7l3 3a4 4 0 010 5.7l-2 2a4 4 0 01-5.7 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  const icPeople = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="9" r="2.6" stroke="currentColor" stroke-width="1.8"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14 20c0-2.4 1-4.5 2.6-5.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  const item=(ic,col,label,value,sub,tip)=>`
    <div style="display:flex;gap:9px;align-items:flex-start">
      <div class="insight-ic" style="background:${ICON_BG[col]};color:${cv(col)}">${ic}</div>
      <div style="min-width:0">
        <div class="ik">${label}${tip?`<span class="tip" tabindex="0">\u24D8<span class="tip-box">${tip}</span></span>`:""}</div>
        <div class="iv" style="font-size:14px">${value}</div>
        ${sub?`<div class="score-sub">${sub}</div>`:""}

  return `
    <div class="panel">
      <div class="phead"><span class="dot" style="background:var(--aqua)"></span>
        <h2>What this means for ${ST.region.name.split('(')[0].trim()}</h2></div>
      <div class="grid cols3" style="margin-bottom:12px">
        ${item(icBolt,"--red","Primary regional pressure", topDriver.nm, `Score: ${topDriver.v}`)}
        ${item(icLink,strengthCol,"Strongest modeled link", `${bestLink.A.nm} \u2192 ${bestLink.B.nm}`, `Strength: ${strength}`, "Highest current modeled link intensity based on the connected risk scores.")}
        ${item(icPeople,"--violet","Highest downstream outcome", topOutcome.nm, `Score: ${topOutcome.v}`)}
      </div>
      <p style="font-size:12.5px;color:#B7D3BF;line-height:1.6;margin:0">
        <b style="color:var(--txt)">${topDriver.nm}</b> is the strongest current regional pressure. The strongest
        modeled relationship overall is <b style="color:var(--txt)">${bestLink.A.nm} \u2192 ${bestLink.B.nm}</b>.
        <b style="color:var(--txt)">${topOutcome.nm}</b> is currently the highest downstream outcome.</p>
    </div>`;
}
