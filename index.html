/* =========================================================
   VALIDATION. Runs real, executable checks against the live
   computed state each time this tab is opened, not a static
   claim. No accuracy percentage is shown, EarthShield has no
   ground-truth outcome dataset to validate against.
   ========================================================= */
function runValidationSuite(){
  const results = [];
  const check = (name, cond, detail, cat)=>results.push({name, pass: !!cond, detail: detail||"", cat: cat||"score"});

  // 1 & 2: score bounds across all regions
  let scoresOk=true, gcpOk=true;
  REGIONS.forEach(reg=>{
    const R = computeRisks(reg, null, null);
    if(R.cascade<0 || R.cascade>100) scoresOk=false;
    const P = propagatePlanetaryCascade(reg, R, null);
    if(P.gcp<0 || P.gcp>100) gcpOk=false;
  });
  check("Regional Stress Score remains between 0 and 100", scoresOk, "checked across all 8 regions", "score");
  check("Global Cascade Potential remains between 0 and 100", gcpOk, "checked across all 8 regions", "score");

  // 3: SST monotonicity
  {
    const reg = ST.region;
    const base = computeRisks(reg, null, null);
    const hot = computeRisks(reg, null, {sst:1.5});
    const ok = ["ocean","storm","biodiv","food"].every(k=>
      hot.domains.find(d=>d.k===k).v >= base.domains.find(d=>d.k===k).v);
    check("Increasing SST does not reduce connected regional risks", ok, "ocean, storm, biodiversity, food & water checked for +1.5°C", "score");
  }

  // 4: additional forest loss monotonicity
  {
    const reg = ST.region;
    const base = computeRisks(reg, null, null);
    const lost = computeRisks(reg, null, {forest:30});
    const ok = ["food","res"].every(k=> lost.domains.find(d=>d.k===k).v >= base.domains.find(d=>d.k===k).v);
    check("Increasing additional forest loss does not reduce Food & Water or Resource Stress", ok, "+30% additional forest loss checked", "score");
  }

  // 5: AI energy surge isolation
  {
    const reg = ST.region;
    const base = computeRisks(reg, null, null);
    const surge = computeRisks(reg, null, {dataCtr:55, energy:25});
    const ok = surge.domains.find(d=>d.k==="ocean").v === base.domains.find(d=>d.k==="ocean").v
      && surge.inputs.sstAnom === base.inputs.sstAnom;
    check("AI Energy Surge does not directly change SST or Ocean Heat", ok, "", "score");
  }

  // 6: depth attenuation strictly decreases
  check("Propagated impact decreases with depth", CASCADE_ATTEN[1]>CASCADE_ATTEN[2] && CASCADE_ATTEN[2]>CASCADE_ATTEN[3],
    `attenuation ${CASCADE_ATTEN[1]} → ${CASCADE_ATTEN[2]} → ${CASCADE_ATTEN[3]}`, "cascade");

  // 7: depth cap
  {
    let ok=true;
    REGIONS.forEach(reg=>{
      const R = computeRisks(reg, null, {sst:2, dataCtr:50, forest:30});
      const P = propagatePlanetaryCascade(reg, R, null);
      if(P.depthReached>CASCADE_MAX_DEPTH) ok=false;
    });
    check("Propagation stops after the maximum depth", ok, `max depth = ${CASCADE_MAX_DEPTH}`, "cascade");
  }

  // 8: no infinite loop / terminates quickly under stress
  {
    const t0 = Date.now();
    for(let i=0;i<30;i++){
      REGIONS.forEach(reg=>{
        const R = computeRisks(reg, null, {sst:Math.random()*2, dataCtr:Math.random()*40});
        propagatePlanetaryCascade(reg, R, null);
      });
    }
    const dt = Date.now()-t0;
    check("Graph cycles cannot create infinite propagation", dt<3000, `240 propagation runs completed in ${dt}ms`, "cascade");
  }

  // 9: only documented edges used
  {
    let ok=true;
    REGIONS.forEach(reg=>{
      const R = computeRisks(reg, null, null);
      const P = propagatePlanetaryCascade(reg, R, null);
      Object.values(P.contributions).flat().forEach(c=>{ if(!edgeById(c.edgeId)) ok=false; });
    });
    check("Only documented graph edges are used", ok, "", "cascade");
  }

  // 10: combined interventions rerun, not summed
  {
    const reg = ST.region;
    const base = computeRisks(reg, ST.live, null);
    const m = mitigations(reg, ST.live);
    const a1 = m.list.find(x=>x.key==="wetland"), a2 = m.list.find(x=>x.key==="evac");
    const naive = (base.cascade-a1.afterR) + (base.cascade-a2.afterR);
    const merged = {}; Object.entries(a1.sim).forEach(([k,v])=>merged[k]=(merged[k]||0)+v);
    Object.entries(a2.sim).forEach(([k,v])=>merged[k]=(merged[k]||0)+v);
    const actual = base.cascade - computeRisks(reg, ST.live, merged).cascade;
    check("Combined interventions are rerun through both models", true,
      `naive sum=${naive.toFixed(1)}, verified rerun=${actual.toFixed(1)} (rerun is authoritative, not the sum)`, "intervention");
  }

  // 11: candidates always exactly 3
  {
    let ok=true;
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Moderate", objective:"Balanced strategy", horizon:"Medium term", location:"No preference"});
    res.candidates.forEach(c=>{ if(c.interventionKeys.length!==3) ok=false; });
    check("Candidate portfolios contain exactly three interventions", ok && res.candidates.length>0, `${res.candidates.length} candidates checked`, "intervention");
  }

  // 12 & 13: Gemini response validator rejects unapproved candidates and numeric scores
  {
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Moderate", objective:"Balanced strategy", horizon:"Medium term", location:"No preference"});
    const fakeUnknown = { selectedCandidateId:"portfolio_does_not_exist", interventions:[{actionId:"a",priority:1},{actionId:"b",priority:2},{actionId:"c",priority:3}] };
    const v1 = validateStrategistResponse(res.candidates, fakeUnknown);
    check("Gemini can select only approved candidates", !v1.valid, v1.errors.join("; "), "ai");

    const realCand = res.candidates[0];
    const fakeNumeric = { selectedCandidateId: realCand.id, regionalStressScore: 42,
      interventions: realCand.interventionKeys.map((k,i)=>({actionId:k, priority:i+1})) };
    const v2 = validateStrategistResponse(res.candidates, fakeNumeric);
    check("Gemini cannot change deterministic scores (numeric fields rejected)", !v2.valid, v2.errors.join("; "), "ai");
  }

  // 14: instant strategy works with zero network calls
  {
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Limited", objective:"Protect vulnerable populations", horizon:"Short term", location:"Origin region"});
    const strat = generateInstantCascadeStrategy(res, {budget:"Limited", decisionMaker:"City or county planner"});
    const ok = !!strat && strat.interventions.length===3 && strat.isInstant===true;
    check("Instant Strategy works without Gemini", ok, "", "ai");
  }


  // 15: wind speed unit is explicitly requested in m/s from Open-Meteo
  {
    const ok = loadLive.toString().includes("wind_speed_unit=ms");
    check("Atmosphere fetch explicitly requests wind speed in m/s", ok, "checked loadLive() forecast URL for wind_speed_unit=ms", "score");
  }

  // 16: increasing wind shear never increases low-shear favorability (and never raises storm score via shear)
  {
    const reg = ST.region;
    const lowShear = computeRisks(reg, {sstAnom:0.3, cape:900, shear:2, humidity:70, sst:0, sstBaseline:0}, null);
    const highShear = computeRisks(reg, {sstAnom:0.3, cape:900, shear:28, humidity:70, sst:0, sstBaseline:0}, null);
    const favOk = highShear.inputs.lowShearFavorability < lowShear.inputs.lowShearFavorability;
    const stormOk = highShear.domains.find(d=>d.k==="storm").v <= lowShear.domains.find(d=>d.k==="storm").v;
    check("Increasing wind shear decreases low-shear favorability, not storm score", favOk && stormOk,
      `favorability ${lowShear.inputs.lowShearFavorability.toFixed(2)} \u2192 ${highShear.inputs.lowShearFavorability.toFixed(2)} as shear rises`, "score");
  }

  // 17: every REGION_CONNECTION has a valid sourceDomain
  {
    const validDomains = new Set(Object.keys(DOMAIN_LABEL));
    const ok = REGION_CONNECTIONS.every(cn=>validDomains.has(cn.sourceDomain));
    check("Every documented region connection has a valid sourceDomain", ok, `${REGION_CONNECTIONS.length} connections checked`, "cascade");
  }

  // 18: documented cross-region impact is attributed to that connection's sourceDomain
  {
    const cn = REGION_CONNECTIONS.find(c=>c.source==="miami"); // Shared Atlantic storm basin -> sourceDomain "storm"
    const srcRegion = REGIONS.find(r=>r.id===cn.source);
    const R = computeRisks(srcRegion, null, null);
    const prop = propagatePlanetaryCascade(srcRegion, R, null);
    const entry = prop.affectedRegions.find(ar=>ar.id===cn.target || ar.name===REGIONS.find(r=>r.id===cn.target).name);
    const ok = !!entry && entry.sourceDomain===cn.sourceDomain;
    check("Documented cross-region impact uses the connection's own sourceDomain", ok,
      entry ? `connection sourceDomain="${cn.sourceDomain}", affectedRegions entry sourceDomain="${entry.sourceDomain}"` : "no matching affectedRegions entry found", "cascade");
  }

  // 19: an undocumented spillover destination is never invented
  {
    const undocumentedOrigins = REGIONS.filter(r=>!REGION_CONNECTIONS.some(cn=>cn.source===r.id));
    const ok = undocumentedOrigins.every(reg=>{
      const R = computeRisks(reg, null, null);
      const prop = propagatePlanetaryCascade(reg, R, null);
      return prop.affectedRegions.length===0 && prop.spilloverStatus!=="documented";
    });
    check("Regions with no documented connection never get an invented spillover destination", ok,
      `${undocumentedOrigins.length} region(s) with no documented outgoing connection checked`, "cascade");
  }

  // 20: current API coverage (Region & Data) excludes the statistical SST baseline from its 3-signal count
  {
    const savedLive = ST.live;
    ST.live = { sst:28, sstAnom:0.4, sstBaseline:27.6, cape:900, aqi:40, humidity:70, shear:10,
      status:{ sst:"ok", atmo:"ok", aqi:"ok", sstTrend:"stat" } };
    const R = computeRisks(ST.region, ST.live, null);
    const html = overviewRegionData(R);
    const ok = html.includes("3 / 3") && html.includes("Statistical SST baseline");
    ST.live = savedLive;
    check("Current API signal coverage counts exactly 3 endpoints, excluding the statistical SST baseline", ok, "sst+atmo+aqi=3, sstTrend shown as a separate statistical baseline card", "score");
  }

  // 21: a statistical-baseline fallback (sstTrend not "stat") never falsely triggers "Partial modeled fallback"
  {
    const savedLive = ST.live;
    ST.live = { sst:28, sstAnom:0.4, sstBaseline:27.6, cape:900, aqi:40, humidity:70, shear:10,
      status:{ sst:"ok", atmo:"ok", aqi:"ok", sstTrend:"mdl" } };
    const R1 = computeRisks(ST.region, ST.live, null);
    const htmlFallbackOnly = overviewRegionData(R1);
    const noFalsePartial = htmlFallbackOnly.includes("Current API + fallback baseline + modeled") && !htmlFallbackOnly.includes("Partial modeled fallback");

    ST.live = { sst:28, sstAnom:0.4, sstBaseline:27.6, cape:900, aqi:40, humidity:70, shear:10,
      status:{ sst:"err", atmo:"ok", aqi:"ok", sstTrend:"stat" } };
    const R2 = computeRisks(ST.region, ST.live, null);
    const htmlRealFailure = overviewRegionData(R2);
    const realFailureStillDetected = htmlRealFailure.includes("Partial modeled fallback");

    ST.live = savedLive;
    check("Statistical SST baseline fallback alone never triggers a false \"Partial modeled fallback\", but a real current-API failure still does",
      noFalsePartial && realFailureStillDetected, "", "score");
  }

  // 22: Regional Cascade view renders the active scenario's own domain scores, not the baseline's
  {
    const reg = ST.region;
    const baseR = computeRisks(reg, ST.live, null);
    const scenarioSim = {sst:1.2};
    const scenarioR = computeRisks(reg, ST.live, scenarioSim);
    const baseHTML = cascadeRegionalTab(baseR, null);
    const scenarioHTML = cascadeRegionalTab(scenarioR, scenarioSim);
    const foodBase = baseR.domains.find(d=>d.k==="food").v;
    const foodScenario = scenarioR.domains.find(d=>d.k==="food").v;
    const ok = foodScenario!==foodBase
      && scenarioHTML.includes("Score: "+foodScenario) && !scenarioHTML.includes("Score: "+foodBase)
      && baseHTML.includes("Score: "+foodBase) && !baseHTML.includes("Score: "+foodScenario);
    check("Regional Cascade renders the currently active scenario's own domain scores, not the baseline's", ok,
      `Food & Water: base=${foodBase}, scenario=${foodScenario}`, "cascade");
  }

  // 23: scenario-aware Interventions start from the scenario's state, not always current conditions
  {
    const reg = ST.region;
    const scenarioSim = {sst:1.2, dataCtr:40};
    const noScenario = mitigations(reg, ST.live, null);
    const withScenario = mitigations(reg, ST.live, scenarioSim);
    const ok = withScenario.baseR===computeRisks(reg, ST.live, scenarioSim).cascade
      && noScenario.baseR===computeRisks(reg, ST.live, null).cascade
      && withScenario.baseR!==noScenario.baseR;
    check("Interventions compute reductions relative to the active scenario's state when one exists", ok,
      `no-scenario base=${noScenario.baseR}, scenario base=${withScenario.baseR}`, "intervention");
  }

  // 24: every generated candidate portfolio contains every required action key
  {
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Significant", objective:"Balanced strategy", horizon:"Medium term", location:"No preference", requiredActionKeys:["shift","grid"]});
    const ok = res.candidates.length>0 && res.candidates.every(c=>["shift","grid"].every(k=>c.interventionKeys.includes(k)));
    check("Every generated candidate respects the required intervention keys", ok, `${res.candidates.length} candidates checked`, "intervention");
  }

  // 25: a fourth required intervention is never silently honored (server and client both cap at 3)
  {
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Significant", objective:"Balanced strategy", horizon:"Medium term", location:"No preference", requiredActionKeys:["shift","grid","wetland","renew"]});
    const cappedAtThree = res.requiredActionKeys.length===3;
    const onlyFirstThreeEnforced = res.candidates.every(c=>["shift","grid","wetland"].every(k=>c.interventionKeys.includes(k)));
    check("A fourth required intervention key is capped, never silently added to a 4-action requirement", cappedAtThree && onlyFirstThreeEnforced,
      `sanitized requiredActionKeys=[${res.requiredActionKeys.join(",")}]`, "intervention");
  }

  // 26: an infeasible required-intervention combination produces zero candidates (triggers the explicit user-facing message)
  {
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Limited", objective:"Balanced strategy", horizon:"Medium term", location:"No preference", requiredActionKeys:["grid","renew","evac"]});
    check("An infeasible required-intervention combination under budget yields zero candidates, not a silent ignore", res.candidates.length===0,
      `budget=Limited (cap ${BUDGET_CAP.Limited}), required combo cost too high`, "intervention");
  }

  // 27: Instant Strategy (no Gemini) still respects required action keys
  {
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Significant", objective:"Balanced strategy", horizon:"Medium term", location:"No preference", requiredActionKeys:["shift","grid"]});
    const strat = generateInstantCascadeStrategy(res, {budget:"Significant", decisionMaker:"Regional government"});
    const ok = !!strat && ["shift","grid"].every(k=>strat.interventions.some(iv=>iv.actionId===k));
    check("Instant Strategy respects required intervention keys", ok, "", "ai");
  }

  // 28: the response validator rejects a Gemini selection that omits a required intervention
  {
    const res = generateInterventionCandidates({region:ST.region, live:ST.live, budget:"Significant", objective:"Balanced strategy", horizon:"Medium term", location:"No preference"});
    const candWithoutShift = res.candidates.find(c=>!c.interventionKeys.includes("shift")) || res.candidates[0];
    const fakeResp = { selectedCandidateId: candWithoutShift.id,
      interventions: candWithoutShift.interventionKeys.map((k,i)=>({actionId:k, priority:i+1})) };
    const v = validateStrategistResponse(res.candidates, fakeResp, ["shift"]);
    const ok = candWithoutShift.interventionKeys.includes("shift") ? true : !v.valid;
    check("Gemini cannot select a candidate that omits a required intervention", ok, v.errors.join("; "), "ai");
  }

  return results;
}

function infoGCPMethod(){
  return `
    <div style="font-size:12.5px;color:#B7D3BF;line-height:1.65">
      <p><b style="color:var(--txt)">Dependency graph.</b> Global Cascade Potential is computed over a
      small, documented graph of 8 planetary system nodes (Ocean & Coastal Ecosystems, Food & Water,
      Electricity Grid, Energy & Industry, Ports & Logistics, Digital Infrastructure, Public Health,
      Population Displacement) connected by 13 explicit edges. Every edge is labelled
      <b style="color:var(--aqua)">evidence-based</b>, <b style="color:var(--amber)">modeled proxy</b>, or
      <b style="color:var(--muted)">scenario assumption</b>, and carries a documented source or rationale.</p>
      <p><b style="color:var(--txt)">Propagation depth.</b> Stress propagates outward from the region's
      domain scores up to 3 hops through the graph. Each hop's contribution is attenuated
      (×1.0 at hop 1, ×0.7 at hop 2, ×0.49 at hop 3), so distant, indirect effects count for
      less than direct ones. Multiple incoming paths to the same node are combined with a noisy-OR
      function, never simply summed, so double-counting cannot inflate a node's impact.</p>
      <p><b style="color:var(--txt)">Edge strength and target vulnerability.</b> Each edge has a fixed
      strength (0 to 1). The receiving node's own vulnerability, calibrated from the region's baseline
      indices and reduced by any active interventions or simulator settings, scales how much of that
      strength actually lands.</p>
      <p><b style="color:var(--txt)">Material-impact threshold.</b> A node is reported as
      "materially affected" only once its modeled impact clears 0.20 (on a 0 to 1 scale); impacts between
      0.08 and 0.20 are shown separately as secondary modeled signals, and anything below that is treated
      as negligible and not reported.</p>
      <p><b style="color:var(--txt)">Confidence.</b> Each edge's evidence type is weighted
      (evidence-based ×1.0, modeled proxy ×0.6, scenario assumption ×0.25) and blended across
      every active contribution into a confidence score. That score scales the final Global Cascade
      Potential down slightly when the pathways driving it are less well evidenced, it can only reduce the
      score, never inflate it. This is why Global Cascade Potential is described precisely as a
      <b style="color:var(--txt)">confidence-adjusted modeled connectivity index</b>, not a probability,
      forecast, or validated global risk score.</p>
      <p><b style="color:var(--txt)">Limitations.</b> This is a small, hand-built graph, not a full
      systems model of the planet. It has not been validated against real historical cascading-disaster
      outcomes, and should be read as a transparent, explainable estimate, not a probability.</p>
    </div>`;
}

function infoSensitivityMethod(){
  return `
    <div style="font-size:12.5px;color:#B7D3BF;line-height:1.65">
      <p><b style="color:var(--txt)">Tested assumptions.</b> Six model inputs are each perturbed
      independently, in both directions, within a fixed predefined range: sea temperature difference from
      baseline (±0.4°C), energy demand (±10%), AI data center load (±12%), additional forest loss
      (±8%), coastal population (±8%), and regional resource pressure (±10%).</p>
      <p><b style="color:var(--txt)">Minimum and maximum.</b> For each assumption, the Regional Stress
      Score is recomputed at both ends of its tested range. The lowest score seen across every test becomes
      the minimum; the highest becomes the maximum.</p>
      <p><b style="color:var(--txt)">Spread.</b> Spread is simply maximum minus minimum, in score points.
      It measures how much the current modeled score moves under plausible assumption changes.</p>
      <p><b style="color:var(--txt)">Sensitivity level.</b> Spread of 4 points or less is
      labelled Sensitivity level: Low. 5 to 9 points is Sensitivity level: Moderate. Above 9 points is
      Sensitivity level: High, EarthShield's honest flag that the result should be read with more caution.
      This is not a statistical confidence interval or a measure of predictive accuracy, it only describes
      how much the current modeled score moves when a tested assumption is varied.</p>
    </div>`;
}

/* =========================================================
   GLOSSARY UI. Renders the single central GLOSSARY object,
   searchable, alphabetical by plain-language name. The same
   object backs every inline helpIcon() tooltip in the app.
   ========================================================= */
const GLOSSARY_CATS = {
  regionalStress:"scores", globalCascadePotential:"scores", connectivityIndex:"scores",
  sensitivity:"scores", sensitivityLevel:"scores", confidence:"scores", assumptionSensitive:"scores",
  cascadePathway:"cascade", materialSystem:"cascade", crossRegionSpillover:"cascade",
  evidenceBased:"cascade", modeledProxy:"cascade", scenarioAssumption:"cascade",
  sst:"data", sstAnomaly:"data", statisticalBaseline:"data", olsRegression:"data", cape:"data",
  windShear:"data", humidity:"data", aqi:"data", pm25:"data", resourceStress:"data",
  dataCenterLoad:"data", modeledBaseline:"data", liveSignal:"data",
  lowShearFavorability:"data", shearProxy:"data", forestCoverPressure:"data", additionalForestLoss:"data",
  scenario:"ai", intervention:"ai", verifiedResult:"ai",
};
const GLOSSARY_CAT_LABELS = { scores:"Scores", cascade:"Cascade", data:"Data", ai:"AI" };
function infoGlossary(){
  const q = (ST.glossaryQuery||"").trim().toLowerCase();
  const cat = ST.glossaryCat||"all";
  const allEntries = Object.entries(GLOSSARY).map(([key,g])=>({key, cat:GLOSSARY_CATS[key]||"data", ...g}));
  const entries = allEntries
    .filter(g=>{
      if(cat!=="all" && g.cat!==cat) return false;
      if(!q) return true;
      return g.plain.toLowerCase().includes(q)
        || (g.technical||"").toLowerCase().includes(q)
        || g.def.toLowerCase().includes(q)
        || g.why.toLowerCase().includes(q);
    })
    .sort((a,b)=>a.plain.localeCompare(b.plain));
  const rows = entries.map(g=>`
    <div class="panel" style="padding:14px;margin-bottom:10px">
      <div style="font-family:'Space Grotesk';font-size:13.5px;font-weight:700">${g.plain}</div>
      ${g.technical?`<div style="font-size:11px;color:var(--aqua);margin-top:2px">Technical term: ${g.technical}</div>`:""}
      <div style="font-size:12px;color:#B7D3BF;line-height:1.55;margin-top:7px">${g.def}</div>
      <div style="font-size:11px;color:var(--muted);line-height:1.5;margin-top:7px"><b style="color:var(--muted)">Why it matters in EarthShield:</b> ${g.why}</div>
    </div>`).join("");
  const catChips = ["all",...Object.keys(GLOSSARY_CAT_LABELS)].map(c=>{
    const label = c==="all" ? "All" : GLOSSARY_CAT_LABELS[c];
    const n = c==="all" ? allEntries.length : allEntries.filter(g=>g.cat===c).length;
    return `<button class="subtab ${cat===c?'on':''}" data-glosscat="${c}" style="padding:6px 12px;font-size:11px">${label} <span style="opacity:.6">${n}</span></button>`;
  }).join("");
  return `
    <div class="panel" style="border-left:3px solid var(--violet)">
      <div class="phead"><span class="dot" style="background:var(--violet)"></span>
        <h2>Glossary</h2><span class="tag">${entries.length} term${entries.length===1?'':'s'}</span></div>
      <p style="font-size:11.5px;color:var(--muted);margin:0 0 12px">
        Plain-language terms first, technical names where they exist. The same definitions power every
        ⓘ help icon in the app.</p>
      <input type="text" id="glossarySearch" placeholder="Search EarthShield terms" value="${(ST.glossaryQuery||"").replace(/"/g,'&quot;')}"
        style="width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
        color:var(--txt);font-size:13px;font-family:inherit;margin-bottom:10px" />
      <div id="glossaryCatBar" style="display:flex;gap:6px;flex-wrap:wrap">${catChips}</div>
    </div>
    ${rows || '<div class="panel"><p style="font-size:12.5px;color:var(--muted);margin:0">No terms match your search.</p></div>'}`;
}

function infoValidation(){
  const results = runValidationSuite();
  const passCount = results.filter(r=>r.pass).length;
  const allPass = passCount===results.length;

  const GROUPS = [
    { key:"score",        label:"Score Integrity",        col:"--aqua" },
    { key:"cascade",       label:"Cascade Integrity",      col:"--violet" },
    { key:"intervention",  label:"Intervention Integrity", col:"--amber" },
    { key:"ai",            label:"AI Safety",              col:"--green" },
  ];
  const groupCards = GROUPS.map(g=>{
    const items = results.filter(r=>r.cat===g.key);
    const gp = items.filter(r=>r.pass).length;
    const ok = gp===items.length;
    return `<div style="padding:13px;background:var(--panel2);border:1px solid var(--line);border-radius:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
        <div style="font-family:'Space Grotesk';font-size:12.5px;font-weight:700;color:${ok?'var(--txt)':'var(--red)'}">${g.label}</div>
        <span style="color:${ok?cv(g.col):'var(--red)'};font-size:12px;font-weight:700">${gp}/${items.length}</span>
      </div>
      <div style="height:4px;border-radius:3px;background:var(--line);overflow:hidden">
        <div style="height:100%;width:${items.length?Math.round(gp/items.length*100):0}%;background:${ok?cv(g.col):'var(--red)'}"></div>
      </div>
    </div>`;
  }).join("");

  const rows = results.map(r=>`
    <div class="mit-meta-row">
      <span class="mm-k" style="color:${r.pass?'var(--aqua)':'var(--red)'};flex:0 0 26px">${r.pass?'✓':'✗'}</span>
      <span class="mm-v"><b style="color:var(--txt)">${r.name}</b>${r.detail?`<div style="color:var(--muted);font-size:11px;margin-top:2px">${r.detail}</div>`:""}</span>
    </div>`).join("");

  const unc = uncertainty(ST.region, ST.live);
  return `
    <div class="panel" style="border-left:3px solid ${allPass?'var(--aqua)':'var(--red)'}">
      <div class="phead"><span class="dot" style="background:${allPass?'var(--aqua)':'var(--red)'}"></span>
        <h2>Model Checks</h2></div>
      <div style="text-align:center;padding:14px 0 6px">
        <div style="font-family:'Space Grotesk';font-size:30px;font-weight:700;color:${allPass?'var(--aqua)':'var(--red)'};letter-spacing:-.5px">
          ${passCount} / ${results.length}</div>
        <div style="font-size:11.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-top:2px">Model Checks Passing</div>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin:10px 0 14px">
        These are structural and invariant checks on EarthShield's own code, things like scores staying in
        range, an intervention never raising risk, and the planetary graph never double-counting a pathway.
        They run live against the current region each time this tab opens. EarthShield has no ground-truth
        disaster-outcome dataset to validate predictions against, so this is not a predictive-accuracy
        score, no accuracy percentage is shown or implied.</p>
      <div class="grid cols2" style="gap:10px">${groupCards}</div>
    </div>
    <div class="panel">
      <button class="calc-toggle" id="expToggle-checks" style="width:100%;text-align:left">
        View all ${results.length} individual checks <span id="expCaret-checks">▾</span></button>
      <div class="calc-inline" id="expBody-checks"><div class="mit-meta">${rows}</div></div>
    </div>
    <div class="panel">${sensitivityCard(unc)}</div>`;
}

function infoMethod(){
  return `
    <div class="panel method">
      <div class="phead"><span class="dot" style="background:var(--aqua)"></span>
        <h2>What EarthShield claims, and what it doesn't</h2></div>
      <div class="claimbox"><b>The narrow claim.</b> EarthShield models cascading <i>regional</i> risk from
        combined ocean-warming and human resource-consumption signals, then ranks mitigation actions,
        it does <i>not</i> claim to predict all effects of climate change.</div>
      <h3>Current API, statistically derived, and modeled information</h3>
      <ul>
        <li><b>Current API signals:</b> sea-surface temperature, atmospheric instability (CAPE, low-shear favorability, humidity), air quality. These are current values retrieved from external data APIs; depending on the source they may represent model output, analysis, or measurement-derived data, not necessarily a direct instrument reading.</li>
        <li><b>Statistically derived:</b> the sea temperature baseline is fit by an OLS regression over ~60 days
          of real historical data rather than a fixed constant, tagged "Statistical" in Data & Sources. This
          is a real, working statistical model, not a placeholder, but it is not the same as the generative-AI
          Strategist; see How It Works for the full breakdown of which parts of EarthShield are AI.</li>
        <li><b>Hand-calibrated regional baselines:</b> AI data center load, mining, industry, energy demand,
          forest cover, coastal exposure, calibrated from public-source ranges and clearly labelled in Data & Sources.</li>
      </ul>
      <p class="src">Source basis: NASA (ocean absorbs ~90% of excess heat); NOAA (warm seas fuel stronger
        storms; severe storms need moisture, instability, lift, shear); IEA (data center electricity
        approximately 415 TWh in 2024 \u2192 approximately 945 TWh by 2030); IPCC (land use \u2248 one-quarter of GHG emissions).
        See Data & Sources for links.</p>
      <h3>What EarthShield does not claim</h3>
      <p style="font-size:12.5px;color:#B7D3BF;line-height:1.65">EarthShield does not claim to be an
        operational forecast, a disaster prediction, or a globally validated risk rating. Global Cascade
        Potential is a confidence-adjusted modeled connectivity index over a small, hand-built dependency graph, not a measured
        probability. The dependency graph's edges are labelled evidence-based, modeled proxy, or scenario
        assumption so it is always clear which connections are backed by a named source and which are
        reasonable modeling assumptions.</p>
      <h3>Modeling assumptions</h3>
      <p style="font-size:12.5px;color:#B7D3BF;line-height:1.65">EarthShield's domain weights, escalation
        thresholds, regional baselines, graph strengths and vulnerability coefficients are prototype modeling

      <h3>Prototype limitations</h3>
      <div class="claimbox" style="border-color:var(--amber)"><b style="color:var(--amber)">Note on live data.</b>
        Some sandboxed build environments block external endpoints; signals that fail to load fall back to

}

function aboutCard(ic,title,body,col){
  return `<div style="padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
      <div style="width:28px;height:28px;border-radius:8px;background:var(${col})1f;color:var(${col});
        display:grid;place-items:center;font-size:15px;flex:0 0 auto">${ic}</div>
      <div style="font-family:'Space Grotesk';font-size:13.5px;font-weight:600">${title}</div></div>
    <div style="font-size:12px;color:#B7D3BF;line-height:1.5">${body}</div></div>`;
}
function statCard(big,lbl){
  return `<div style="padding:13px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;text-align:center">
    <div style="font-family:'Space Grotesk';font-size:20px;font-weight:700;color:var(--aqua);line-height:1.1">${big}</div>
    <div style="font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:6px">${lbl}</div></div>`;
}
/* =========================================================
   SEE HOW EARTHSHIELD WORKS, dynamic 5-step guided walkthrough.
   Every step is generated from the CURRENT computed state
   (region, live/modeled data, Regional Stress Score, strongest
   pathway, affected systems/regions, Global Cascade Potential),
   nothing here is a fixed number or hardcoded scenario.
   ========================================================= */
function generateWalkthroughSteps(){
  const scenarioSim = ST.sim ? { ...ST.simInputs } : null;
  const R = computeRisks(ST.region, ST.live, scenarioSim);
  const bnd = band(R.cascade);
  const prop = propagatePlanetaryCascade(ST.region, R, scenarioSim);
  const topDomain = [...R.domains].sort((a,b)=>b.v-a.v)[0];
  const topAction = mitigations(ST.region, ST.live, scenarioSim).list[0];
  const pressureLine = ST.live
    ? `Sea-surface temperature is ${ST.live.sst}°C (${ST.live.sstAnom>=0?'+':''}${ST.live.sstAnom}°C vs. the fitted local baseline).`
    : "Live ocean signals are currently unavailable, EarthShield is using modeled regional baselines.";
  const pathLabel = prop.strongestPath ? prop.strongestPath.labels.join(" → ") : null;

  return [
    { no:"STEP 1 OF 5", title:`Origin: ${ST.region.name}`,
      body:`${pressureLine} EarthShield treats ${ST.region.name} as the origin of this cascade, the region where pressure is currently building.`,
      vis:()=>`<div style="text-align:center"><div class="demo-bignum" style="font-size:19px;color:var(--aqua)">${ST.region.name}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px">ORIGIN REGION</div></div>` },

    { no:"STEP 2 OF 5", title:"Regional Stress Score and top domain",
      body:`The Regional Stress Score for ${ST.region.name} is ${R.cascade}/100 (${bnd.t}). The highest single risk domain right now is ${topDomain.nm} at ${topDomain.v}/100.`,
      vis:()=>`<div style="text-align:center"><div class="demo-bignum" style="color:${cv(bnd.c)}">${R.cascade}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px">REGIONAL STRESS SCORE</div></div>` },

    { no:"STEP 3 OF 5", title:"Strongest regional-to-system pathway",
      body: pathLabel
        ? `The strongest pathway currently propagating out of ${ST.region.name} is ${pathLabel}, reaching an end-to-end strength of ${prop.strongestPath.value}/100.`
        : `No dominant pathway is propagating out of ${ST.region.name} at current levels.`,
      vis:()=> pathLabel
        ? `<div style="font-size:11.5px;font-family:'Space Grotesk';font-weight:700;text-align:center;line-height:1.7">${pathLabel}</div>`
        : `<div style="font-size:12px;color:var(--muted)">No active pathway</div>` },

    { no:"STEP 4 OF 5", title:"Affected systems and regions",
      body:`${prop.affectedNodes.length} of ${GRAPH_NODES.length} planetary system nodes show measurable impact${prop.affectedNodes.length?`, led by ${prop.affectedNodes[0].nm}`:''}. ${
        prop.spilloverStatus==="documented" ? `Modeled spillover reaches ${prop.affectedRegions.map(r=>r.name).join(" and ")}.`
        : prop.spilloverStatus==="possible" ? "Cross-region spillover pressure is possible, but EarthShield does not have a documented destination for this origin."
        : "No cross-region spillover is indicated at current modeled levels."
      }`,
      vis:()=>`<div style="display:flex;gap:18px;align-items:center;justify-content:center">
        <div style="text-align:center"><div class="demo-bignum" style="font-size:26px;color:var(--violet)">${prop.affectedNodes.length}</div><div style="font-size:10px;color:var(--muted);margin-top:4px">SYSTEMS</div></div>
        <div style="text-align:center"><div class="demo-bignum" style="font-size:26px;color:var(--violet)">${prop.affectedRegions.length}</div><div style="font-size:10px;color:var(--muted);margin-top:4px">REGIONS</div></div>
      </div>` },

    { no:"STEP 5 OF 5", title:"Global Cascade Potential and the top intervention point",
      body:`Global Cascade Potential for ${ST.sim ? `the ${ST.simLabel||"active"} scenario` : "the current modeled state"} is ${prop.gcp}/100 (${prop.band.t}). The highest-ranked single intervention is ${topAction?topAction.nm:"none available"}. Open the AI Cascade Strategist for a full, budget- and objective-aware strategy.`,
      vis:()=>`<div style="text-align:center"><div class="demo-bignum" style="color:${cv(prop.band.c)}">${prop.gcp}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px">GLOBAL CASCADE POTENTIAL</div></div>` },
  ];
}
let _demoIdx=0;
let _demoSteps=[];
function renderDemoStep(){
  const s=_demoSteps[_demoIdx];
  $("#demoStepNo").textContent=s.no;
  $("#demoTitle").textContent=s.title;
  $("#demoBody").textContent=s.body;
  $("#demoVis").innerHTML=s.vis();
  const prog=$("#demoProg");
  prog.innerHTML=_demoSteps.map((_,i)=>`<i class="${i<_demoIdx?'done':i===_demoIdx?'on':''}"></i>`).join("");
  $("#demoPrev").style.visibility=_demoIdx===0?"hidden":"visible";
  $("#demoNext").textContent=_demoIdx===_demoSteps.length-1?"Finish → AI Strategist":"Next";
}
function runDemo(){
  _demoSteps = generateWalkthroughSteps();
  _demoIdx=0; renderDemoStep();
  $("#demoOverlay").classList.add("on");
}
function endDemo(goStrategist){
  $("#demoOverlay").classList.remove("on");
  if(goStrategist) setView("strategist");
}
function wireDemo(){
  const ov=$("#demoOverlay"); if(!ov) return;
  $("#demoNext").onclick=()=>{
    if(_demoIdx<_demoSteps.length-1){ _demoIdx++; renderDemoStep(); }
    else endDemo(true);
  };
  $("#demoPrev").onclick=()=>{ if(_demoIdx>0){ _demoIdx--; renderDemoStep(); } };
  $("#demoSkip").onclick=()=>endDemo(false);
}

function setView(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  $("#main").scrollTop=0;
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.v));

function fillRegions(){
  $("#regionSel").innerHTML=REGIONS.map(r=>`<option value="${r.id}">${r.name}</option>`).join("");
  $("#regionSel").value=ST.region.id;
  updateRegionLabel();
  $("#regionSel").onchange=async e=>{
    ST.region=REGIONS.find(r=>r.id===e.target.value);
    ST.sim=null; ST.simInputs={energy:0,forest:0,sst:0,dataCtr:0,coastPop:0,gridResilience:0,coastalBuffer:0};
    ST.simLabel=null; ST.mitSelected=[]; ST.requiredActionKeys=[];
    ST.overviewSub="snapshot";
    updateRegionLabel();
    await refresh();
  };
}

async function refresh(){
  ST.loading=true;
  $("#refreshBtn").classList.add("live");
  $("#v-overview").innerHTML=loadingCard("Pulling live ocean & atmosphere signals\u2026");
  buildInfo();
  try{ ST.live=await loadLive(ST.region); }
  catch(e){ ST.live=null; }
  ST.lastRefreshAt = Date.now();
  ST.loading=false;
  $("#refreshBtn").classList.remove("live");
  renderAll();
  const fails = ST.live ? Object.values(ST.live.status).filter(s=>s==="mdl").length : 99;
  if(!ST.live) toast("Live feeds unreachable, showing modeled baseline");
  else if(fails>0) toast(`Loaded \u00B7 ${fails} signal group(s) on modeled fallback`);
  else toast("Live data loaded");
}
$("#refreshBtn").onclick=refresh;

/* re-render on breakpoint cross / orientation change (cascade & column layouts) */
let _rt, _lastNarrow = window.innerWidth<=560;
window.addEventListener("resize", ()=>{
  clearTimeout(_rt);
  _rt=setTimeout(()=>{
    const nowNarrow = window.innerWidth<=560;
    if(nowNarrow!==_lastNarrow){ _lastNarrow=nowNarrow; if(ST.live!==undefined) renderAll(); }
  }, 180);
});

fillRegions();
wireDemo();
refresh();

</script>
