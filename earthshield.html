<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="EarthShield AI is a planetary cascade intelligence platform that models ocean warming and resource-consumption risks.">
<title>EarthShield AI — Planetary Cascade Intelligence (Green theme)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071A12; --panel:#0E2B1D; --panel2:#123A27; --line:#1B4A34;
  --txt:#EAF3EC; --muted:#8FB89E; --muted2:#5E8870;
  --amber:#E8B24A; --aqua:#48D0AE; --red:#F0795C; --violet:#9CA7E8;
  --green:#7FD89A;
  --r:14px; --rsm:10px;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Space Grotesk',sans-serif}

#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- top bar ---------- */
header{flex:0 0 auto;padding:calc(var(--sat) + 12px) 16px 11px;display:flex;flex-direction:column;
  gap:10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0C2519,#071A12)}
.hrow1{display:flex;align-items:center;gap:12px}
.hrow2{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.logo{width:34px;height:34px;flex:0 0 auto;position:relative}
.brand h1{font-family:'Space Grotesk';font-size:17px;font-weight:700;margin:0;letter-spacing:-.3px;white-space:nowrap}
.brand .sub{font-size:10.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.region-pick{position:relative;display:flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--rsm);padding:10px 13px;font-size:13px;font-weight:600;
  flex:1;min-width:0;color:var(--txt);transition:.15s;text-align:left}
.region-pick:hover,.region-pick:focus-within{border-color:var(--aqua)}
.region-pick > svg:first-child{flex:0 0 auto;color:var(--aqua)}
.region-pick .rp-label{flex:0 0 auto;color:var(--muted);font-size:11px;font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;border-right:1px solid var(--line);padding-right:9px}
.region-pick select{appearance:none;background:none;border:none;color:var(--txt);font:inherit;
  font-weight:600;outline:none;flex:1;min-width:0;cursor:pointer;
  position:absolute;inset:0;opacity:0;width:100%;height:100%}
.region-pick .rp-current{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-pick .rp-caret{flex:0 0 auto;color:var(--muted)}
.gbtn{flex:0 0 auto;width:42px;height:42px;border-radius:var(--rsm);background:var(--panel);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--amber);transition:.15s}
.gbtn:hover{color:#F0B968;border-color:var(--amber)}
.gbtn.live{color:var(--aqua);border-color:var(--aqua)}
@media(min-width:880px){
  .hrow2{max-width:420px;margin-left:auto;margin-top:-46px}
  .hrow1{align-items:center}
}

/* ---------- tab strip ---------- */
nav{flex:0 0 auto;display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);
  background:var(--bg);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{padding:9px 15px 11px;font-size:13px;font-weight:600;color:var(--muted);position:relative;
  white-space:nowrap;border-radius:8px 8px 0 0;transition:.15s}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--txt)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;
  background:var(--aqua);border-radius:2px}

/* ---------- scroll body ---------- */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:18px;overscroll-behavior:contain}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- generic panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:14px}
.phead{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.phead .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.phead h2{font-family:'Space Grotesk';font-size:14px;font-weight:600;margin:0;letter-spacing:.2px}
.phead .tag{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:20px}
.tag.real{color:var(--aqua);border-color:#1d5e4e}
.tag.model{color:var(--amber);border-color:#4a3c1c}

.grid{display:grid;gap:14px}
@media(min-width:880px){
  main{padding:22px 26px}
  .cols2{grid-template-columns:1fr 1fr}
  .cols3{grid-template-columns:repeat(3,1fr)}
  .wrap{max-width:1180px;margin:0 auto}
}

/* ---------- MOBILE ---------- */
@media(max-width:560px){
  header{padding:calc(var(--sat) + 11px) 14px 11px}
  .brand h1{font-size:16px}
  .gbtn{width:40px;height:40px}
  main{padding:14px}
  /* hero: stack and center the ring above the meta */
  .hero{padding:17px}
  .hero-top{flex-direction:column;align-items:center;text-align:center;gap:14px}
  .hero-meta{min-width:0;width:100%}
  .hero-meta h3{font-size:12px}
  .hero-meta .band{font-size:22px}
  .drivers{justify-content:center}
  .uncert{text-align:left}
  /* sliders / sim: single column already; keep delta 2-up but tighter */
  .delta-grid{gap:8px}
  .delta .dv .new{font-size:18px}
  /* cascade diagram: let it shrink to fit, no forced min-width scroll */
  #cascadeSVG{min-width:0;width:100%}
  .cascade-wrap{overflow-x:visible}
  /* meters & feed: a touch more breathing room */
  .panel{padding:14px}
  .meter .mt .nm{font-size:12px}
  .mit{padding:12px;gap:11px}
  .mit .red .rv{font-size:17px}
  .feed .frow{padding:11px 12px}
  .feed .frow .fnm .a{font-size:12px}
  /* 5 tabs spread evenly across the width */
  nav{gap:2px;padding:8px 8px 0;justify-content:space-between}
  .tab{flex:1;text-align:center;padding:9px 4px 11px;font-size:12px}
  .tab.on::after{left:6px;right:6px}
}
@media(max-width:560px){
  input[type=range]{height:6px}
  input[type=range]::-webkit-slider-thumb{width:22px;height:22px}
  input[type=range]::-moz-range-thumb{width:18px;height:18px}
}
/* very narrow phones */
@media(max-width:360px){
  .brand .sub{display:none}
  .delta-grid{grid-template-columns:1fr}
  .hero-meta .band{font-size:20px}
  .tab{font-size:11.5px}
}

/* ---------- score hero ---------- */
.hero{background:radial-gradient(135% 150% at 78% -10%,#15402B 0%,#0F3322 48%,#0A2418 100%);
  border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.hero .glow{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(60% 80% at 85% 10%,rgba(72,208,174,.15),transparent 60%)}
.hero-top{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.cascade-ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.cascade-ring svg{transform:rotate(-90deg)}
.cascade-ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.cascade-ring .num{font-family:'Space Grotesk';font-size:34px;font-weight:700;line-height:1}
.cascade-ring .lbl{font-size:9.5px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
.hero-meta{flex:1;min-width:200px}
.hero-meta h3{font-family:'Space Grotesk';font-size:13px;color:var(--muted);font-weight:500;
  letter-spacing:.4px;text-transform:uppercase;margin:0 0 4px}
.hero-meta .band{font-family:'Space Grotesk';font-size:25px;font-weight:700;margin:0 0 10px;letter-spacing:-.3px}
.hero-meta p{font-size:13px;line-height:1.55;color:#B7D3BF;margin:0}
.band-scale{font-family:'JetBrains Mono';font-size:13px;font-weight:600;color:var(--muted);
  margin-left:8px;vertical-align:middle}
.drivers{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{font-size:11.5px;font-weight:500;padding:5px 10px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.chip i{width:6px;height:6px;border-radius:50%;display:inline-block}
.hero-meta p.lede{font-size:13.5px;color:var(--aqua);font-weight:500;margin:0 0 8px;line-height:1.45}

/* run demo button */
.demo-btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:10px 16px;
  border-radius:30px;background:linear-gradient(100deg,var(--aqua),#2BB793);color:#04130D;
  font-family:'Space Grotesk';font-size:13px;font-weight:700;text-align:left;transition:.15s;
  position:relative}
.demo-btn:hover{filter:brightness(1.06)}
.demo-btn .dp{font-size:10px}
.demo-btn .ds{display:none}

/* why-different card accent */
.diff-card{border-left:3px solid var(--amber)}

/* live vs modeled note */
.lvm{margin-top:14px;border-top:1px solid var(--line);padding-top:13px;display:flex;flex-direction:column;gap:8px}
.lvm-row{display:flex;gap:10px;font-size:11.5px;line-height:1.45;align-items:baseline}
.lvm-k{flex:0 0 auto;font-weight:700;font-size:10px;letter-spacing:.5px;text-transform:uppercase;min-width:108px}
.lvm-v{color:var(--muted)}

/* hotspot map */
.hotspot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#072622}
.hot-map{width:100%;aspect-ratio:2/1;line-height:0}
.hot-map svg{width:100%;height:100%}
.hot-meta{display:flex;flex-wrap:wrap;gap:14px;padding:13px 14px;border-top:1px solid var(--line)}
.hot-meta > div{display:flex;flex-direction:column;gap:3px}
.hot-meta .hk{font-size:9.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.hot-meta .hv{font-size:12.5px;font-weight:600}

/* demo overlay */
#demoOverlay{position:fixed;inset:0;z-index:300;background:rgba(5,18,11,.9);backdrop-filter:blur(4px);
  display:none;flex-direction:column;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 20px);
  align-items:center;justify-content:center}
#demoOverlay.on{display:flex;animation:fade .3s ease}
.demo-card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.demo-step-no{font-family:'JetBrains Mono';font-size:11px;font-weight:700;color:var(--aqua);
  letter-spacing:1px;margin-bottom:10px}
.demo-card h3{font-family:'Space Grotesk';font-size:19px;font-weight:700;margin:0 0 9px;line-height:1.25}
.demo-card p{font-size:13px;color:#B7D3BF;line-height:1.55;margin:0 0 16px}
.demo-vis{height:96px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  margin-bottom:16px;display:grid;place-items:center;overflow:hidden;position:relative}
.demo-prog{display:flex;gap:6px;margin-bottom:18px}
.demo-prog i{flex:1;height:4px;border-radius:3px;background:var(--line);transition:.3s}
.demo-prog i.on{background:var(--aqua)}
.demo-prog i.done{background:var(--aqua);opacity:.5}
.demo-ctrl{display:flex;gap:10px}
.demo-ctrl .btn{flex:1}
.demo-skip{position:absolute;top:calc(var(--sat) + 16px);right:18px;color:var(--muted);
  font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line)}
.demo-bignum{font-family:'Space Grotesk';font-size:40px;font-weight:700;line-height:1}
.demo-arrow{font-size:24px;color:var(--muted)}

/* ---------- risk meters ---------- */
.meter{padding:13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--rsm)}
.meter .mt{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.meter .mt .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.meter .mt .nm{font-size:12.5px;font-weight:600;line-height:1.2}
.meter .mt .vv{margin-left:auto;font-family:'Space Grotesk';font-size:17px;font-weight:700}
.bar{height:7px;border-radius:6px;background:#06160E;overflow:hidden;position:relative}
.bar > i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .7s cubic-bezier(.4,1.3,.5,1)}
.meter .cap{font-size:10.5px;color:var(--muted);margin-top:7px;line-height:1.4}

/* ---------- cascade diagram ---------- */
.cascade-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:4px}
#cascadeSVG{display:block;min-width:640px}
.cz-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--muted)}
.cz-legend span{display:flex;align-items:center;gap:6px}
.cz-legend i{width:18px;height:3px;border-radius:2px;display:inline-block}

/* ---------- why-score explainer ---------- */
.why{margin-top:14px;padding:13px 14px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;border-left:3px solid var(--aqua)}
.why-h{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk';font-size:12.5px;
  font-weight:600;margin-bottom:6px}
.why-ic{font-size:14px}
.why-b{font-size:12px;color:#AEBED2;line-height:1.55}

/* ---------- preset scenarios ---------- */
.preset-lab{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);margin-bottom:9px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;padding-bottom:16px;
  border-bottom:1px solid var(--line)}
.preset{flex:1 1 auto;min-width:0;padding:10px 12px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt);font-size:12px;font-weight:600;transition:.15s;
  white-space:nowrap}
.preset:hover{border-color:var(--aqua);color:var(--aqua)}
.preset:active{transform:scale(.97)}

/* ---------- sim controls ---------- */
.ctrl{margin-bottom:16px}
.ctrl:last-child{margin-bottom:0}
.ctrl .clab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ctrl .clab .l{font-size:12.5px;font-weight:600}
.ctrl .clab .v{font-family:'JetBrains Mono';font-size:12.5px;font-weight:700;color:var(--aqua)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;
  background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--aqua);border:3px solid #071A12;box-shadow:0 0 0 1px var(--aqua);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--aqua);
  border:3px solid #071A12;cursor:pointer}
.ctrl .crange{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted2);margin-top:5px}
.runbar{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;padding:13px;border-radius:var(--rsm);font-family:'Space Grotesk';font-size:13.5px;
  font-weight:600;transition:.15s;text-align:center;border:1px solid transparent}
.btn.primary{background:var(--aqua);color:#04130D}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel2);border-color:var(--line);color:var(--muted);flex:0 0 auto;width:54px}
.btn.ghost:hover{color:var(--txt);border-color:var(--aqua)}

/* sim delta readout */
.delta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.delta{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rsm);padding:11px 12px}
.delta .dn{font-size:11px;color:var(--muted);margin-bottom:5px}
.delta .dv{display:flex;align-items:baseline;gap:8px}
.delta .dv .base{font-family:'JetBrains Mono';font-size:13px;color:var(--muted2)}
.delta .dv .arr{color:var(--muted2);font-size:12px}
.delta .dv .new{font-family:'Space Grotesk';font-size:20px;font-weight:700}
.delta .chg{font-family:'JetBrains Mono';font-size:11px;font-weight:700;margin-top:4px}
.empty-sim{text-align:center;padding:26px 16px;color:var(--muted)}
.empty-sim .ico{font-size:26px;margin-bottom:8px;opacity:.5}
.empty-sim p{font-size:12.5px;margin:0;line-height:1.5}

/* ---------- mitigation cards ---------- */
.mit{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rsm);padding:14px;
  display:flex;gap:13px;align-items:flex-start;transition:.15s;position:relative;overflow:hidden}
.mit + .mit{margin-top:10px}
.mit:hover{border-color:var(--line)}
.mit .rank{font-family:'Space Grotesk';font-size:13px;font-weight:700;color:#04130D;background:var(--aqua);
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.mit .mbody{flex:1;min-width:0}
.mit .mbody h4{font-family:'Space Grotesk';font-size:13.5px;font-weight:600;margin:0 0 4px}
.mit .mbody p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.45}
.mit .red{flex:0 0 auto;text-align:right}
.mit .red .rv{font-family:'Space Grotesk';font-size:19px;font-weight:700;color:var(--green);line-height:1}
.mit .red .rl{font-size:9px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:3px}

/* ---------- uncertainty banner ---------- */
.uncert{display:flex;gap:12px;align-items:flex-start;background:rgba(232,178,74,.10);
  border:1px solid #4a3c1c;border-radius:var(--rsm);padding:13px 15px;margin-top:14px}
.uncert.agree{background:rgba(127,216,154,.10);border-color:#2a5a3c}
.uncert .ui{flex:0 0 auto;margin-top:1px}
.uncert .ub h5{font-family:'Space Grotesk';font-size:12.5px;font-weight:600;margin:0 0 3px}
.uncert .ub p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.5}

/* ---------- data feed list ---------- */
.feed{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--rsm);overflow:hidden}
.feed .frow{display:flex;align-items:center;gap:12px;background:var(--panel);padding:12px 14px}
.feed .frow .fic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.feed .frow .fnm{flex:1;min-width:0}
.feed .frow .fnm .a{font-size:12.5px;font-weight:600}
.feed .frow .fnm .b{font-size:10.5px;color:var(--muted);margin-top:1px}
.feed .frow .fval{font-family:'JetBrains Mono';font-size:14px;font-weight:700;text-align:right}
.feed .frow .fval .u{font-size:9.5px;color:var(--muted);font-weight:400}
.fstat{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;
  border-radius:5px;flex:0 0 auto}
.fstat.ok{color:var(--aqua);background:rgba(72,208,174,.14)}
.fstat.mdl{color:var(--amber);background:rgba(232,178,74,.14)}
.fstat.err{color:var(--red);background:rgba(240,121,92,.14)}
.fstat.load{color:var(--muted);background:rgba(143,184,158,.14)}

/* ---------- info subtabs ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:0 0 auto;padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;
  color:var(--muted);background:var(--panel);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.subtab:hover{color:var(--txt)}
.subtab.on{color:#04130D;background:var(--aqua);border-color:var(--aqua)}

/* ---------- source links ---------- */
.src-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--rsm);overflow:hidden}
.src-row{display:flex;align-items:center;gap:12px;background:var(--panel);padding:13px 14px;
  text-decoration:none;color:inherit;transition:.15s}
.src-row:hover{background:var(--panel2)}
.src-row .src-nm{flex:0 0 auto;font-family:'Space Grotesk';font-weight:700;font-size:13px;
  color:var(--aqua);min-width:78px}
.src-row .src-d{flex:1;font-size:11.5px;color:#B7D3BF;line-height:1.4}

<script>
/* ===================================================================
   EarthShield AI — Planetary Cascade Intelligence (single-file POC)
   Internal model identity is never surfaced to end users.
   =================================================================== */
const AI_ENGINE = "esai-cascade-core-v1";  // internal only — never shown in UI

/* =========================================================
   REGIONS — mix of US coastal + global hotspots.
   baselines: modeled regional pressure/exposure indices
   (0..1) calibrated from public-source ranges in the brief
   (NASA ocean-heat, IEA data center TWh, IPCC land-use).
   Live signals (SST, instability, AQI) overwrite the
   ocean/weather portions at runtime where reachable.
   ========================================================= */
const REGIONS = [
  {id:"miami",   name:"South Florida (Miami)",  lat:25.76, lon:-80.19, grid:"FRCC",
   b:{coastPop:.88, coastExp:.92, energy:.66, dataCtr:.58, forest:.18, mining:.10, industry:.46, water:.55, sstClim:28.4}},
  {id:"njcoast", name:"New Jersey Coast",        lat:39.36, lon:-74.42, grid:"PJM",
   b:{coastPop:.74, coastExp:.71, energy:.72, dataCtr:.81, forest:.22, mining:.12, industry:.58, water:.5,  sstClim:22.1}},
  {id:"gulf",    name:"Gulf of Mexico (NOLA)",   lat:29.30, lon:-89.40, grid:"MISO",
   b:{coastPop:.62, coastExp:.95, energy:.78, dataCtr:.42, forest:.20, mining:.66, industry:.74, water:.48, sstClim:28.9}},
  {id:"houston", name:"Houston–Galveston, TX",   lat:29.31, lon:-94.79, grid:"ERCOT",
   b:{coastPop:.79, coastExp:.83, energy:.91, dataCtr:.69, forest:.14, mining:.71, industry:.88, water:.62, sstClim:28.6}},
  {id:"bangla",  name:"Bay of Bengal (Bangladesh)", lat:22.0, lon:90.4, grid:"BD",
   b:{coastPop:.97, coastExp:.99, energy:.41, dataCtr:.18, forest:.40, mining:.30, industry:.55, water:.78, sstClim:29.2}},
  {id:"manila",  name:"Philippines (Manila Bay)", lat:14.55, lon:120.9, grid:"PH",
   b:{coastPop:.93, coastExp:.90, energy:.48, dataCtr:.34, forest:.46, mining:.62, industry:.6,  water:.66, sstClim:29.6}},
  {id:"carib",   name:"Caribbean (San Juan)",    lat:18.46, lon:-66.10, grid:"PR",
   b:{coastPop:.80, coastExp:.88, energy:.55, dataCtr:.22, forest:.34, mining:.18, industry:.4,  water:.6,  sstClim:28.8}},
  {id:"chennai", name:"India SE Coast (Chennai)",lat:13.08, lon:80.27, grid:"IN-S",
   b:{coastPop:.95, coastExp:.84, energy:.6,  dataCtr:.52, forest:.16, mining:.5,  industry:.78, water:.83, sstClim:29.0}},
];

/* live state per session */
const ST = {
  region: REGIONS[0],
  live: null,            // {sst, sstAnom, cape, shear, humidity, aqi, pm25, status:{}}
  loading: false,
  sim: null,             // last simulation result
  simInputs: {energy:0, forest:0, sst:0, dataCtr:0, coastPop:0},
  infoTab: "about",
};

/* =========================================================
   DATA LAYER — real key-free CORS APIs (Open-Meteo family).
   Sandbox blocks these hosts; the browser does not. Each
   signal degrades to a modeled baseline on failure and is
   labelled accordingly in the Data Feeds view.
   ========================================================= */
async function jget(url, ms=9000){
  const c = new AbortController(); const t=setTimeout(()=>c.abort(), ms);
  try{ const r=await fetch(url,{signal:c.signal}); clearTimeout(t);
    if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}

async function loadLive(reg){
  const out = {status:{}};
  const {lat,lon} = reg;
  // 1) Ocean: sea-surface temperature (Open-Meteo Marine)
  try{
    const m = await jget(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=sea_surface_temperature&forecast_days=1`);
    const arr=(m.hourly&&m.hourly.sea_surface_temperature||[]).filter(v=>v!=null);
    if(arr.length){ out.sst=+(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1); out.status.sst="ok"; }
    else throw new Error("empty");
  }catch(e){ out.sst=reg.b.sstClim; out.status.sst="mdl"; }
  out.sstAnom = +(out.sst - reg.b.sstClim).toFixed(1);

  // 2) Atmosphere: severe-convective ingredients (CAPE, shear, humidity)
  try{
    const w = await jget(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=relative_humidity_2m,wind_speed_10m&hourly=cape,wind_speed_700hPa,wind_speed_10m&forecast_days=1`);
    const cape=(w.hourly&&w.hourly.cape||[]).filter(v=>v!=null);
    out.cape = cape.length ? Math.round(Math.max(...cape)) : 800;
    const up=(w.hourly&&w.hourly.wind_speed_700hPa||[]); const lo=(w.hourly&&w.hourly.wind_speed_10m||[]);
    let sh=null; for(let i=0;i<up.length;i++){ if(up[i]!=null&&lo[i]!=null){ sh=Math.max(sh??0, Math.abs(up[i]-lo[i])); } }
    out.shear = sh!=null?Math.round(sh):18;
    out.humidity = w.current ? Math.round(w.current.relative_humidity_2m) : 70;
    out.status.atmo="ok";
  }catch(e){ out.cape=900; out.shear=20; out.humidity=72; out.status.atmo="mdl"; }

  // 3) Pollution: US AQI / PM2.5 (Open-Meteo Air Quality)
  try{
    const a = await jget(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm2_5`);
    if(a.current){ out.aqi=Math.round(a.current.us_aqi); out.pm25=+(a.current.pm2_5).toFixed(1); out.status.aqi="ok"; }
    else throw new Error("empty");
  }catch(e){ out.aqi=Math.round(40+reg.b.industry*70); out.pm25=+(8+reg.b.industry*22).toFixed(1); out.status.aqi="mdl"; }

  return out;
}

/* =========================================================
   CASCADE MODEL — the patentable core.
   Two engines feed a multi-domain Planetary Cascade Score.
   Each domain risk is 0..100. Deterministic + transparent.
   ========================================================= */
function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x));}

function computeRisks(reg, live, sim){
  const b=reg.b, s=sim||{energy:0,forest:0,sst:0,dataCtr:0,coastPop:0};
  // applied counterfactual deltas
  const sstAnom = (live?live.sstAnom:0) + s.sst;                 // °C above climatology
  const energy  = clamp(b.energy*100 + s.energy, 0, 100)/100;
  const dataCtr = clamp(b.dataCtr*100 + s.dataCtr,0,100)/100;
  const forest  = clamp(b.forest*100 - s.forest, 0, 100)/100;     // forest LOSS rises as cover drops
  const coastPop= clamp(b.coastPop*100 + s.coastPop,0,100)/100;
  const cape = live?live.cape:900, shear=live?live.shear:20, hum=live?live.humidity:72;
  const aqi  = live?live.aqi:60;

  // ---- ENGINE A: Ocean-warming impacts ----
  // Ocean heat risk driven by SST anomaly (NASA: ~90% excess heat to ocean)
  const oceanHeat = clamp(34 + sstAnom*26 + (b.sstClim>28?10:0));
  // Storm intensification: warm SST is the fuel; convective ingredients modulate.
  // (NOAA: warm water fuels stronger storms; severe-convective needs moisture+instability+lift+shear)
  const ingredients = clamp((cape/3000)*45 + (hum/100)*25 + Math.min(shear,30)/30*20 + 10);
  const stormInt = clamp(0.55*oceanHeat + 0.45*ingredients);
  const biodiv = clamp(28 + sstAnom*22 + b.industry*18 + aqi*0.12);          // reefs/fisheries
  const foodWater = clamp(22 + b.water*40 + forest*30 + sstAnom*10 + (b.sstClim>28?6:0));

  // ---- ENGINE B: Resource-consumption stress ----
  const aiEnergy = clamp(dataCtr*68 + energy*24 + 6);                          // IEA data center growth
  const resourceStress = clamp(b.industry*26 + b.mining*20 + energy*18 + forest*14 + aqi*0.09 + aiEnergy*0.16);
  const displacement = clamp(0.5*stormInt + 0.3*(coastPop*100) + 0.2*(b.coastExp*100));

  const domains = [
    {k:"ocean",  nm:"Ocean Heat",            v:Math.round(oceanHeat),  c:"--aqua",   eng:"A"},
    {k:"storm",  nm:"Storm Intensification", v:Math.round(stormInt),   c:"--red",    eng:"A"},
    {k:"biodiv", nm:"Biodiversity",          v:Math.round(biodiv),     c:"--green",  eng:"A"},
    {k:"food",   nm:"Food & Water",          v:Math.round(foodWater),  c:"--violet", eng:"A"},
    {k:"disp",   nm:"Human Displacement",    v:Math.round(displacement),c:"--red",   eng:"A"},
    {k:"res",    nm:"Resource Stress",       v:Math.round(resourceStress),c:"--amber",eng:"B"},
    {k:"ai",     nm:"AI Data Center Load",   v:Math.round(aiEnergy),   c:"--amber",  eng:"B"},
  ];

  // ---- Planetary Cascade Score: weighted, escalation-aware ----
  const w = {ocean:.14, storm:.18, biodiv:.10, food:.12, disp:.18, res:.16, ai:.12};
  let base=0; domains.forEach(d=>base+=d.v*w[d.k]);
  // escalation: when multiple domains are jointly high, the cascade compounds
  const hi = domains.filter(d=>d.v>=65).length;
  const cascade = clamp(base*(1 + hi*0.035));

  return {domains, cascade:Math.round(cascade),
    inputs:{sstAnom,energy,dataCtr,forest:1-forest,coastPop,cape,shear,aqi},
    drivers:topDrivers(reg,live,domains)};
}

function topDrivers(reg,live,domains){
  const d=[];
  if(live&&live.sstAnom>=0.3) d.push({t:`SST +${live.sstAnom}°C anomaly`, c:"--aqua"});
  if(reg.b.dataCtr>=.55) d.push({t:"High data center load", c:"--amber"});
  if(reg.b.coastExp>=.85) d.push({t:"Extreme coastal exposure", c:"--red"});
  if(reg.b.mining>=.6) d.push({t:"Heavy extraction", c:"--amber"});
  if(live&&live.aqi>=90) d.push({t:`AQI ${live.aqi}`, c:"--amber"});
  if(reg.b.coastPop>=.9) d.push({t:"Dense coastal population", c:"--violet"});
  const storm=domains.find(x=>x.k==="storm");
  if(storm&&storm.v>=70) d.push({t:"Storm ingredients elevated", c:"--red"});
  return d.slice(0,5);
}

function band(v){
  if(v>=78) return {t:"Severe", c:"--red"};
  if(v>=60) return {t:"Elevated", c:"--amber"};
  if(v>=40) return {t:"Moderate", c:"--violet"};
  return {t:"Guarded", c:"--aqua"};
}
function rcolor(v){ return v>=70?"--red":v>=50?"--amber":v>=32?"--violet":"--aqua"; }

/* =========================================================
   MITIGATION — ranked by expected cascade reduction.
   Each action re-runs the model with its counterfactual.
   ========================================================= */
function mitigations(reg, live){
  const baseR = computeRisks(reg, live, null).cascade;
  const acts = [
    {nm:"Shift data center load to low-carbon grid", d:"Move AI/compute workload to cleaner regional grids during peak demand.", sim:{dataCtr:-35,energy:-8}},
    {nm:"Harden coastal grid & substations", d:"Flood-proof and elevate critical electrical infrastructure.", sim:{coastPop:-12}, custom:r=>r-(reg.b.coastExp*7)},
    {nm:"Restore wetlands & mangrove buffers", d:"Natural storm-surge attenuation and carbon drawdown along the coast.", sim:{forest:18}, custom:r=>r-(reg.b.coastExp*5)},
    {nm:"Scale regional renewables", d:"Displace fossil generation feeding ocean heat uptake.", sim:{energy:-22}},
    {nm:"Reduce industrial discharge", d:"Cut effluent and emissions stressing reefs and fisheries.", sim:{}, custom:r=>r-(reg.b.industry*6)},
    {nm:"Pre-stage coastal evacuation plans", d:"Cut displacement lead-time risk for dense exposed populations.", sim:{coastPop:-10}, custom:r=>r-(reg.b.coastPop*4)},
    {nm:"Protect upland forest cover", d:"Limit land-use emissions (IPCC ~¼ of GHG) and downstream flooding.", sim:{forest:14}},
  ];
  const scored = acts.map(a=>{
    let after = computeRisks(reg, live, {energy:0,forest:0,sst:0,dataCtr:0,coastPop:0, ...a.sim}).cascade;
    if(a.custom) after = a.custom(after);
    return {nm:a.nm, d:a.d, red:Math.max(0, Math.round(baseR-after))};
  }).sort((x,y)=>y.red-x.red);
  return {baseR, list:scored};
}

/* =========================================================
   UNCERTAINTY — model-disagreement early warning.
   We perturb key inputs (±) and measure cascade spread.
   ========================================================= */
function uncertainty(reg, live){
  const variants=[];
  const perturb=[{sst:.4},{sst:-.4},{forest:8},{energy:10},{dataCtr:12},{coastPop:8}];
  perturb.forEach(p=>variants.push(computeRisks(reg,live,{energy:0,forest:0,sst:0,dataCtr:0,coastPop:0,...p}).cascade));
  const base=computeRisks(reg,live,null).cascade; variants.push(base);
  const spread = Math.max(...variants)-Math.min(...variants);
  return {spread, disagree: spread>=12};
}

/* =========================================================
   RENDER HELPERS
   ========================================================= */
const $=s=>document.querySelector(s);
const cv=v=>`var(${v})`;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._); t._=setTimeout(()=>t.classList.remove("show"),2200); }

function ringSVG(score){
  const band_=band(score), C=2*Math.PI*52, off=C*(1-score/100);
  return `<div class="cascade-ring">
    <svg width="132" height="132" viewBox="0 0 132 132">
      <circle cx="66" cy="66" r="52" stroke="${cv('--line')}" stroke-width="9" fill="none"/>
      <circle cx="66" cy="66" r="52" stroke="${cv(band_.c)}" stroke-width="9" fill="none"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
        style="transition:stroke-dashoffset 1s cubic-bezier(.4,1.2,.5,1)"/>
    </svg>
    <div class="ctr"><div class="num" style="color:${cv(band_.c)}">${score}</div>
      <div class="lbl">Cascade Score</div></div>
  </div>`;
}

function meterHTML(d){
  const col=cv(rcolor(d.v));
  return `<div class="meter">
    <div class="mt">
      <div class="ic" style="background:${col}1f;color:${col}">${domainIcon(d.k)}</div>
      <div class="nm">${d.nm}</div><div class="vv" style="color:${col}">${d.v}</div>
    </div>
    <div class="bar"><i style="width:${d.v}%;background:${col}"></i></div>
    <div class="cap">${domainCap(d.k)}</div>
  </div>`;
}
function domainIcon(k){
  const m={ocean:"\u301C",storm:"\u2301",biodiv:"\u274B",food:"\u25F7",disp:"\u2691",res:"\u26CF",ai:"\u25A6"};
  return `<span style="font-size:14px">${m[k]||"\u2022"}</span>`;
}
function domainCap(k){
  return {ocean:"Heat absorbed by sea surface vs. local climatology.",
    storm:"Ocean fuel \u00D7 convective ingredients (moisture, instability, shear).",
    biodiv:"Reef, fishery & marine-species stress.",
    food:"Agricultural & freshwater supply pressure.",
    disp:"Population displacement potential from storm + exposure.",
    res:"Industry, mining, energy & pollution load.",
    ai:"Data center electricity demand pressure (IEA trajectory)."}[k]||"";
}

/* ---- the signature cascade chain diagram ---- */
function cascadeDiagram(R){
  const stress=[
    {id:"ai",  nm:"AI Data Centers", v:R.domains.find(d=>d.k==="ai").v, c:"--amber"},
    {id:"res", nm:"Resource Use",    v:R.domains.find(d=>d.k==="res").v, c:"--amber"},
    {id:"sst", nm:"Ocean Warming",   v:Math.round(clamp(34+R.inputs.sstAnom*26)), c:"--aqua"},
  ];
  const mid=[
    {id:"storm", nm:"Storm Intensity", v:R.domains.find(d=>d.k==="storm").v, c:"--red"},
    {id:"ocean", nm:"Ocean Heat",      v:R.domains.find(d=>d.k==="ocean").v, c:"--aqua"},
  ];
  const out=[
    {id:"disp", nm:"Displacement", v:R.domains.find(d=>d.k==="disp").v, c:"--red"},
    {id:"food", nm:"Food & Water", v:R.domains.find(d=>d.k==="food").v, c:"--violet"},
    {id:"biodiv",nm:"Biodiversity",v:R.domains.find(d=>d.k==="biodiv").v,c:"--green"},
  ];
  const narrow = (typeof window!=="undefined" && window.innerWidth<=560);
  const W = narrow?420:680, H = narrow?360:300;
  const x1 = narrow?60:70, x2 = narrow?210:300, x3 = narrow?360:560;
  const yPos=(arr,i)=>{ const gap=H/(arr.length+1); return gap*(i+1); };
  const links=[
    ["ai","ocean"],["res","ocean"],["res","storm"],["sst","storm"],["sst","ocean"],
    ["storm","disp"],["storm","food"],["ocean","biodiv"],["ocean","food"],["ocean","storm"],
  ];
  const pos={};
  stress.forEach((n,i)=>pos[n.id]={x:x1,y:yPos(stress,i),...n});
  mid.forEach((n,i)=>pos[n.id]={x:x2,y:yPos(mid,i),...n});
  out.forEach((n,i)=>pos[n.id]={x:x3,y:yPos(out,i),...n});

  let path="";
  links.forEach(([a,b])=>{
    const A=pos[a],B=pos[b]; if(!A||!B) return;
    const inten=(A.v+B.v)/2;
    const wd=1+inten/22, op=.18+inten/180;
    const col=inten>=66?"--red":inten>=48?"--amber":"--aqua";
    const mx=(A.x+B.x)/2;
    path+=`<path d="M${A.x+8} ${A.y} C ${mx} ${A.y}, ${mx} ${B.y}, ${B.x-8} ${B.y}"
      stroke="${cv(col)}" stroke-width="${wd.toFixed(1)}" fill="none" opacity="${op.toFixed(2)}"
      stroke-linecap="round"/>`;
  });
  let nodes="";
  const rMax = narrow?11:15, rDiv = narrow?12:9, fNode = narrow?9.5:11;
  [...stress,...mid,...out].forEach(n=>{
    const p=pos[n.id], col=cv(n.c), r=rMax+n.v/rDiv;
    nodes+=`<g>
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${col}1a" stroke="${col}" stroke-width="1.6"/>
      <circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${col}"/>
      <text x="${p.x}" y="${p.y-r-7}" text-anchor="middle" fill="${cv('--txt')}"
        font-size="${fNode}" font-weight="600" font-family="Space Grotesk">${n.nm}</text>
      <text x="${p.x}" y="${p.y+r+15}" text-anchor="middle" fill="${col}"
        font-size="${fNode}" font-weight="700" font-family="JetBrains Mono">${n.v}</text>
    </g>`;
  });
  const colLbl=(x,t)=>`<text x="${x}" y="20" text-anchor="middle" fill="${cv('--muted')}"
    font-size="${narrow?8.5:10}" font-weight="600" letter-spacing="${narrow?.6:1.4}" font-family="Space Grotesk">${t}</text>`;
  return `<svg id="cascadeSVG" viewBox="0 0 ${W} ${H}" width="100%">
    ${colLbl(x1,"HUMAN PRESSURE")}${colLbl(x2,"SYSTEM STRESS")}${colLbl(x3,"CASCADING OUTCOME")}
    ${path}${nodes}</svg>`;
}

/* ---- "why this score is high" explainer, built from real drivers ---- */
function whyScore(R, bnd){
  const drivers = R.drivers.map(d=>d.t);
  // include the single highest domain as context
  const top = [...R.domains].sort((a,b)=>b.v-a.v)[0];
  const label = bnd.t==="Severe"||bnd.t==="Elevated" ? "Why this score is high"
              : bnd.t==="Moderate" ? "What's driving this score" : "Why this score stays low";
  const list = drivers.length ? drivers.join(", ")
             : "no single dominant stressor \u2014 risk is spread evenly across domains";
  return `<div class="why">
    <div class="why-h"><span class="why-ic" style="color:${cv(bnd.c)}">\u24D8</span>${label}</div>
    <div class="why-b"><b>Main drivers:</b> ${list}. The highest single domain is
      <b style="color:${cv(rcolor(top.v))}">${top.nm.toLowerCase()}</b> at ${top.v}/100.</div>
  </div>`;
}

function renderSimDelta(sim){
  const cells=[["Cascade Score","cascade"]].concat(
    sim.after.domains.filter(d=>["storm","ocean","disp","ai"].includes(d.k)).map(d=>[d.nm,d.k]));
  const getv=(obj,k)=> k==="cascade"?obj.cascade : obj.domains.find(d=>d.k===k).v;
  let html="";
  cells.forEach(([nm,k])=>{
    const b=getv(sim.base,k), a=getv(sim.after,k), diff=a-b;
    const col=diff>0?"--red":diff<0?"--green":"--muted";
    const sign=diff>0?"\u25B2 +":diff<0?"\u25BC ":"";
    html+=`<div class="delta">
      <div class="dn">${nm}</div>
      <div class="dv"><span class="base">${b}</span><span class="arr">\u2192</span>
        <span class="new" style="color:${cv(rcolor(a))}">${a}</span></div>
      <div class="chg" style="color:${cv(col)}">${diff===0?'no change':sign+Math.abs(diff)}</div>
    </div>`;
  });
  return `<div class="delta-grid">${html}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5">
    Counterfactual applied to the live + modeled baseline. Severity scales every downstream domain,
    not just the input touched.</div>`;
}

  return `<div class="panel">
    <div class="phead"><span class="dot" style="background:var(--violet)"></span>
      <h2>Sources</h2><span class="tag">Research-backed</span></div>
    <div class="src-list">${rows}</div>
  </div>`;
}

function buildInfo(){
  const sub = ST.infoTab || "about";
  const subBtns = [["about","About"],["innovation","Innovation"],["data","Data feeds"],["method","Method"],["sources","Sources"]]
    .map(([k,l])=>`<button class="subtab ${sub===k?'on':''}" data-sub="${k}">${l}</button>`).join("");
  let body="";
  if(sub==="about") body = infoAbout();
  else if(sub==="innovation") body = infoInnovation();
  else if(sub==="data") body = dataFeedHTML();
  else if(sub==="method") body = infoMethod();
  else if(sub==="sources") body = sourcesHTML();

  $("#v-info").innerHTML = `<div class="subtabs">${subBtns}</div><div id="infoBody">${body}</div>
    <div class="foot"><b style="color:var(--muted)">Disclaimer:</b> EarthShield AI is a student-developed
      proof of concept by Ansh Saini of South Brunswick High School, New Jersey. It is for educational and
      decision-support purposes only and should not replace official alerts, forecasts, evacuation orders,
      or instructions from local authorities. Decision-support prototype, not an operational forecast.</div>`;
  document.querySelectorAll("#v-info .subtab").forEach(btb=>btb.onclick=()=>{
    ST.infoTab=btb.dataset.sub; buildInfo(); $("#main").scrollTop=0;
  });
}

function infoAbout(){
  return `
    <div class="hero" style="margin-bottom:14px">
      <div class="glow"></div>
      <div style="position:relative">
        <div style="font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--aqua);font-weight:600;margin-bottom:8px">About the platform</div>

    </div>

      <div class="phead"><span class="dot" style="background:var(--amber)"></span>

      <p style="font-size:12.5px;color:#B7D3BF;line-height:1.6;margin:0 0 12px">
        Most tools evaluate climate hazards separately. EarthShield treats them as a connected chain and

        than to replace operational forecasts.</p>
    </div>`;
}

  return `
    <div class="panel" style="border-left:3px solid var(--aqua)">
      <div class="phead"><span class="dot" style="background:var(--aqua)"></span>

function infoMethod(){
  return `
    <div class="panel method">
      <div class="phead"><span class="dot" style="background:var(--aqua)"></span>
        <h2>What EarthShield claims \u2014 and what it doesn't</h2></div>
      <div class="claimbox"><b>The narrow claim.</b> EarthShield predicts cascading <i>regional</i> risk from
        combined ocean-warming and human resource-consumption signals, then ranks mitigation actions \u2014
        it does <i>not</i> claim to predict all effects of climate change.</div>
      <h3>Two engines</h3>
      <p><b>Engine A \u2014 Ocean-warming impact.</b> Sea-surface temperature anomaly drives ocean-heat, storm
        intensification, biodiversity, food/water and displacement risk. Storm risk treats warm water as
        fuel and modulates it by severe-convective <i>ingredients</i> \u2014 moisture, instability (CAPE) and
        shear \u2014 rather than asserting that warming directly causes any individual storm or tornado.</p>
      <p><b>Engine B \u2014 Resource-consumption stress.</b> Scores human pressure from industry, mining, energy,
        land-use change and, notably, AI data center electricity demand \u2014 a fast-rising modern driver.</p>
      <h3>Planetary Cascade Score</h3>
      <p>Domain risks are weighted and combined, with an escalation term: when several domains are jointly
        high, the cascade compounds. A model-disagreement check perturbs the inputs and raises an
        uncertainty warning when outputs are assumption-sensitive \u2014 a built-in reliability signal.</p>
      <h3>Live vs modeled data</h3>
      <ul>
        <li><b>Live (open APIs):</b> sea-surface temperature, convective instability (CAPE), wind shear, humidity, air quality.</li>

      </ul>
      <p class="src">Source basis: NASA (ocean absorbs ~90% of excess heat); NOAA (warm seas fuel stronger

      <div class="claimbox" style="border-color:var(--amber)"><b style="color:var(--amber)">Note on live data.</b>
        Some sandboxed build environments block external endpoints; signals that fail to load fall back to

    </div>`;
}

function aboutCard(ic,title,body,col){
  return `<div style="padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
      <div style="width:28px;height:28px;border-radius:8px;background:var(${col})1f;color:var(${col});
        display:grid;place-items:center;font-size:15px;flex:0 0 auto">${ic}</div>
      <div style="font-family:'Space Grotesk';font-size:13.5px;font-weight:600">${title}</div></div>
    <div style="font-size:12px;color:#B7D3BF;line-height:1.5">${body}</div></div>`;
}
function statCard(big,lbl){
  return `<div style="padding:13px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;text-align:center">
    <div style="font-family:'Space Grotesk';font-size:20px;font-weight:700;color:var(--aqua);line-height:1.1">${big}</div>
    <div style="font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:6px">${lbl}</div></div>`;
}
/* =========================================================
   RUN CASCADE DEMO — 5-step guided walkthrough
   ========================================================= */
const DEMO_STEPS = [
  { no:"STEP 1 OF 5", title:"Ocean SST anomaly rises",
    body:"A marine heatwave pushes sea-surface temperature above its local climatology. Because the ocean absorbs the large majority of excess planetary heat, this is the primary state variable the cascade builds on.",
    vis:()=>`<div style="text-align:center"><div class="demo-bignum" style="color:var(--aqua)">+1.6\u00B0C</div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px">SEA-SURFACE TEMP ANOMALY</div></div>` },
  { no:"STEP 2 OF 5", title:"AI & data center energy load increases",
    body:"Regional electricity demand climbs as AI data center load grows. In fossil-leaning grids this lifts emissions \u2014 feeding more heat into the same ocean. EarthShield treats this modern driver as first-class.",
    vis:()=>`<div style="text-align:center"><div class="demo-bignum" style="color:var(--amber)">+45%</div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px">AI DATA-CENTRE LOAD</div></div>` },
  { no:"STEP 3 OF 5", title:"Storm, food & displacement risks update",
    body:"Warmer seas add fuel to storm systems; where convective ingredients align, intensity and rainfall risk climb. Food-and-water stress and human-displacement potential rise alongside.",
    vis:()=>`<div style="display:flex;gap:18px;align-items:center">
      <div style="text-align:center"><div class="demo-bignum" style="font-size:26px;color:var(--red)">\u2191</div><div style="font-size:10px;color:var(--muted);margin-top:4px">STORM</div></div>
      <div style="text-align:center"><div class="demo-bignum" style="font-size:26px;color:var(--violet)">\u2191</div><div style="font-size:10px;color:var(--muted);margin-top:4px">FOOD/WATER</div></div>
      <div style="text-align:center"><div class="demo-bignum" style="font-size:26px;color:var(--red)">\u2191</div><div style="font-size:10px;color:var(--muted);margin-top:4px">DISPLACEMENT</div></div></div>` },
  { no:"STEP 4 OF 5", title:"Cascade chain highlights the risk path",
    body:"The escalation-aware model compounds jointly elevated domains into a single Planetary Cascade Score, and the cascade graph lights up the path carrying the most risk \u2014 from human pressure through to outcomes.",
    vis:()=>`<div style="display:flex;align-items:center;gap:8px;font-family:'Space Grotesk';font-weight:700;font-size:12px">
      <span style="color:var(--amber)">PRESSURE</span><span class="demo-arrow" style="font-size:16px">\u2192</span>
      <span style="color:var(--aqua)">STRESS</span><span class="demo-arrow" style="font-size:16px">\u2192</span>
      <span style="color:var(--red)">OUTCOME</span></div>` },
  { no:"STEP 5 OF 5", title:"Best action surfaces",
    body:"Each mitigation is re-run as a counterfactual and ranked by the points it removes from the score. The Actions tab shows the highest-payoff intervention first \u2014 turning the cascade into a decision.",
    vis:()=>`<div style="text-align:center"><div class="demo-bignum" style="color:var(--green)">\u22129 pts</div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px">TOP RANKED ACTION</div></div>` },
];
let _demoIdx=0;
function renderDemoStep(){
  const s=DEMO_STEPS[_demoIdx];
  $("#demoStepNo").textContent=s.no;
  $("#demoTitle").textContent=s.title;
  $("#demoBody").textContent=s.body;
  $("#demoVis").innerHTML=s.vis();
  const prog=$("#demoProg");
  prog.innerHTML=DEMO_STEPS.map((_,i)=>`<i class="${i<_demoIdx?'done':i===_demoIdx?'on':''}"></i>`).join("");
  $("#demoPrev").style.visibility=_demoIdx===0?"hidden":"visible";
  $("#demoNext").textContent=_demoIdx===DEMO_STEPS.length-1?"Finish \u2192 Actions":"Next";
}
function runDemo(){
  _demoIdx=0; renderDemoStep();
  $("#demoOverlay").classList.add("on");
}
function endDemo(goActions){
  $("#demoOverlay").classList.remove("on");
  if(goActions) setView("mitigation");
}
function wireDemo(){
  const ov=$("#demoOverlay"); if(!ov) return;
  $("#demoNext").onclick=()=>{
    if(_demoIdx<DEMO_STEPS.length-1){ _demoIdx++; renderDemoStep(); }
    else endDemo(true);
  };
  $("#demoPrev").onclick=()=>{ if(_demoIdx>0){ _demoIdx--; renderDemoStep(); } };
  $("#demoSkip").onclick=()=>endDemo(false);
}

function setView(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  $("#main").scrollTop=0;
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.v));

function fillRegions(){
  $("#regionSel").innerHTML=REGIONS.map(r=>`<option value="${r.id}">${r.name}</option>`).join("");
  $("#regionSel").value=ST.region.id;
  updateRegionLabel();
  $("#regionSel").onchange=async e=>{
    ST.region=REGIONS.find(r=>r.id===e.target.value);
    ST.sim=null; ST.simInputs={energy:0,forest:0,sst:0,dataCtr:0,coastPop:0};
    updateRegionLabel();
    await refresh();
  };
}

async function refresh(){
  ST.loading=true;
  $("#refreshBtn").classList.add("live");
  $("#v-overview").innerHTML=loadingCard("Pulling live ocean & atmosphere signals\u2026");
  buildInfo();
  try{ ST.live=await loadLive(ST.region); }
  catch(e){ ST.live=null; }
  ST.loading=false;
  $("#refreshBtn").classList.remove("live");
  renderAll();
  const fails = ST.live ? Object.values(ST.live.status).filter(s=>s==="mdl").length : 99;
  if(!ST.live) toast("Live feeds unreachable \u2014 showing modeled baseline");
  else if(fails>0) toast(`Loaded \u00B7 ${fails} signal group(s) on modeled fallback`);
  else toast("Live data loaded");
}
$("#refreshBtn").onclick=refresh;

/* re-render on breakpoint cross / orientation change (cascade & column layouts) */
let _rt, _lastNarrow = window.innerWidth<=560;
window.addEventListener("resize", ()=>{
  clearTimeout(_rt);
  _rt=setTimeout(()=>{
    const nowNarrow = window.innerWidth<=560;
    if(nowNarrow!==_lastNarrow){ _lastNarrow=nowNarrow; if(ST.live!==undefined) renderAll(); }
  }, 180);
});

fillRegions();
wireDemo();
refresh();

</script>
</body>
</html>
